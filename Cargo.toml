[workspace]
resolver = "2"
members = [
    "programs/vault",
    "programs/matching_engine",
    "crates/darkpool-crypto",
    "crates/darkpool-matcher",
    "crates/nyx-tee",
    "crates/nyx-tee-loadgen",
]
exclude = [
    "darkpool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nyx Darkpool"]


[workspace.dependencies]
# Anchor
anchor-lang = "0.32.1"
anchor-spl  = "0.32.1"

# Solana
solana-program = "2"

# Light Protocol (Merkle + Poseidon)
light-poseidon = "0.3.0"
solana-poseidon = "3.1.11"

# ZK Groth16 verifier (on-chain)
groth16-solana = "0.2.0"

# ZK Groth16 prover (off-chain)
ark-groth16 = "0.5.0"
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-ec = "0.5.0"

# Key derivation / crypto
ed25519-dalek = "2.2.0"
hkdf = "0.12.4"
sha3 = "0.10.8"
sha2 = "0.10.8"
rand = "0.8"

# SPL tokens
spl-token = "4.0"

# TEE / MagicBlock
ephemeral-rollups-sdk = { version = "0.8.0", features = ["anchor", "access-control"] }

# Serde
borsh = "1.5"
bytemuck = { version = "1.16", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Testing
litesvm = "0.9.1"
proptest = "1.4"
hex = "0.4"

# nyx-tee — async runtime + HTTP/WS server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tokio-tungstenite = "0.21"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# dstack SDK — sits inside the CVM, talks to /var/run/dstack.sock
# Pinned to a specific commit during Phase 1 so build is reproducible.
# Bump in lockstep with any image rebuild that needs new SDK features.
dstack-sdk = { git = "https://github.com/Dstack-TEE/dstack.git", branch = "master" }

# Solana client (used by nyx-tee to submit settle txs from the TEE)
solana-client = "1.18"
solana-sdk = "1.18"

# Logging / metrics inside the TEE
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"

# HTTPS client — used by nyx-tee/oracle to pull from Hermes.
# Pinned to rustls so we don't depend on the host OpenSSL (which
# wouldn't exist inside our dstack-os runtime anyway).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# secp256k1 in pure Rust — needed by nyx-tee/oracle/vaa.rs for the
# ecrecover step that verifies Wormhole guardian signatures.
# k256 is the RustCrypto implementation; same auditable surface as
# the rest of the workspace's crypto.
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }

# JWT — nyx-tee/api/auth.rs uses HS256 with a 32-byte secret derived
# from dstack via `get_key("nyx/jwt-secret/v1", "jwt")`. We pinned
# v9 (the current major) which dropped the dependency on the
# obsolete `ring` crate in favour of RustCrypto primitives.
jsonwebtoken = { version = "9", default-features = false }

# Constant-time comparison for credential verification. RustCrypto's
# canonical impl; same crate used by ed25519-dalek under the hood.
subtle = "2.5"

# nyx-tee-loadgen — synthetic order traffic generator.
# CLI parser. v4 is the stable major; derives keep the main.rs CLI
# definition declarative.
clap = { version = "4", features = ["derive"] }
# hdrhistogram for percentile-aware latency tracking. Records
# microseconds in a fixed window; cheap recording, O(1) querying.
hdrhistogram = "7"
# Pseudo-RNG for workload generators. rand 0.8 already pulled in
# by ed25519-dalek; this brings rand_distr for lognormal sampling.
rand_distr = "0.4"

# nyx-tee/solana_rpc — modular Solana crates (PR 4g.2+).
#
# We deliberately AVOID `solana-client` / `solana-sdk` 1.18 because
# they pull a `zeroize` major that conflicts with `ark-ec` 0.5.
# Instead use the post-modularisation 2.x/3.x split crates that
# `programs/vault`'s dev-deps already use. These compile cleanly
# alongside the existing `ark-*` 0.5 workspace deps because they
# share the same modern zeroize constraint.
#
# The JSON-RPC client itself is hand-rolled on top of `reqwest`
# (already in tree for oracle/hermes) so there's no `solana-rpc-
# client` dep — just the type system.
# `curve25519` feature unlocks `Address::find_program_address`,
# which we need for PDA derivation (`note_lock`, `vault_config`).
solana-address           = { version = "2", features = ["curve25519"] }
solana-hash              = "3"
solana-keypair           = "~3.1"
# `~3.1` not `~3.0` to satisfy litesvm 0.9.1's tighter requirement
# — picked up by the matching_engine dev-deps.
solana-signature         = "~3.1"
solana-signer            = "~3.0"
# PR 4g.3 — ix / message / transaction construction. Same modular
# family as the rest; same version pins programs/vault's dev-deps
# use, so the workspace dep graph stays consistent.
solana-instruction       = "~3.1"
solana-message           = "~3.0"
# `serde` feature gives us `Transaction: Serialize`; `bincode`
# unlocks `Transaction::new_signed_with_payer` + tx serialise.
# Together: we can build, sign, and wire-encode a tx in three
# library calls.
solana-transaction       = { version = "~3.0", features = ["serde", "bincode"] }
solana-system-interface  = "3.0.0"

# bincode 1.x — Solana's tx wire format. Pinned at 1 because 2.x's
# API broke the `bincode::serialize` global fn.
bincode                  = "1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
