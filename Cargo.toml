[workspace]
resolver = "2"
members = [
    "programs/vault",
    "crates/darkpool-crypto",
    "crates/darkpool-matcher",
    "crates/darknyx-tee",
    "crates/darknyx-tee-loadgen",
]
exclude = [
    "darkpool",
    # Vendored ICICLE GPU/CPU Groth16 prover (icicle-snark + its nested
    # icicle/ C++ tree + wrappers/rust workspace), under third_party/ next to
    # the rapidsnark submodule. Pulled in only by the `icicle` feature of
    # crates/darknyx-tee as a path dep; kept OUT of our workspace so a default
    # build never triggers its cmake/native build.
    "third_party/icicle-snark",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Darknyx Darkpool"]


[workspace.dependencies]
# Anchor
anchor-lang = "1.1.2"
anchor-spl  = "1.1.2"

# Solana — monolithic facade (3.x re-exports the modular crates). Only
# darkpool-matcher's change-note parity test still pulls this directly for
# `solana_program::hash::hashv`; the vault program migrated to
# `anchor_lang::solana_program::` (Anchor 1.x re-export) and dropped the dep.
solana-program = "3"

# Modular Solana crates used on-chain by the vault program. Anchor 1.x's
# `anchor_lang::solana_program` re-export is a thin facade that does NOT expose
# `hash`, `ed25519_program`, or `sysvar::instructions` (it never did — the
# vault used the standalone `solana-program` crate for these under 0.32). With
# the 1.x bump we drop the monolithic dep and pull the split crates directly:
solana-sdk-ids            = "3.1"  # ed25519_program::ID, sysvar::instructions::ID
solana-sha256-hasher      = "3.1"  # hashv (canonical_payload_hash SHA-256)
solana-instructions-sysvar = "3"   # load_instruction_at_checked

# Light Protocol (Merkle + Poseidon)
light-poseidon = "0.4.0"
solana-poseidon = "3.1.11"

# ZK Groth16 verifier (on-chain)
groth16-solana = "0.2.0"

# ZK Groth16 prover (off-chain)
ark-groth16 = "0.5.0"
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-ec = "0.5.0"
ark-relations = "0.5.1"
# Zkey/R1CS parsing + the optional in-TEE Wasmer fallback, in one dep.
# The real-settle loadgen uses native C++ witness generation and consumes only
# ark-circom's zkey parser/reduction. Published 0.5.0 uses ark-* 0.5 from
# crates.io and fits the arkworks-0.5 workspace above.
ark-circom = "0.5.0"
# num-bigint 0.4 — the type `ark_circom::CircomBuilder::push_input`
# takes (`T: Into<num_bigint::BigInt>`). We construct BigInts from
# BE-32 note commitments + u64 amounts when feeding circuit signals.
num-bigint = "0.4"

# Key derivation / crypto
ed25519-dalek = "2.2.0"
# X25519 ECDH for the change-amount recovery backstop (Proposal B): the TEE
# encrypts each fill's change_amount to the order's viewing-encryption pubkey.
# `static_secrets` lets one ephemeral secret serve both sides of a fill
# (StaticSecret is Clone/reusable; EphemeralSecret consumes itself per ECDH).
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12.4"
sha3 = "0.10.8"
sha2 = "0.10.8"
rand = "0.8"

# SPL tokens
spl-token = "4.0"

# Serde
borsh = "1.5"
bytemuck = { version = "1.16", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Testing
litesvm = "0.13.0"
proptest = "1.4"
hex = "0.4"

# darknyx-tee — async runtime + HTTP/WS server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tokio-tungstenite = "0.21"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# dstack SDK — sits inside the CVM, talks to /var/run/dstack.sock
# Pinned to a specific commit during Phase 1 so build is reproducible.
# Bump in lockstep with any image rebuild that needs new SDK features.
# Pinned to a specific commit (not `branch = "master"`, which is mutable)
# for reproducible builds — this is the rev Cargo.lock already resolves to.
dstack-sdk = { git = "https://github.com/Dstack-TEE/dstack.git", rev = "f67b4f67ebabef0a27795705121698280a1038dc" }

# Solana client (used by darknyx-tee to submit settle txs from the TEE)
solana-client = "1.18"
solana-sdk = "1.18"

# Logging / metrics inside the TEE
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"

# HTTPS client — used by darknyx-tee/oracle to pull from Hermes.
# Pinned to rustls so we don't depend on the host OpenSSL (which
# wouldn't exist inside our dstack-os runtime anyway).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# secp256k1 in pure Rust — needed by darknyx-tee/oracle/vaa.rs for the
# ecrecover step that verifies Wormhole guardian signatures.
# k256 is the RustCrypto implementation; same auditable surface as
# the rest of the workspace's crypto.
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }

# JWT — darknyx-tee/api/auth.rs uses HS256 with a 32-byte secret derived
# from dstack via `get_key("darknyx/jwt-secret/v2", "jwt")`. We pinned
# v9 (the current major) which dropped the dependency on the
# obsolete `ring` crate in favour of RustCrypto primitives.
jsonwebtoken = { version = "9", default-features = false }

# Constant-time comparison for credential verification. RustCrypto's
# canonical impl; same crate used by ed25519-dalek under the hood.
subtle = "2.5"

# Argon2id password hashing for API credentials (api_secret +
# passphrase). RustCrypto's canonical impl; the `password-hash`
# trait layer gives us salted PHC-string hashing + constant-time
# verify. Default features pull in `std` + `alloc`; no external C.
argon2 = "0.5"

# darknyx-tee-loadgen — synthetic order traffic generator.
# CLI parser. v4 is the stable major; derives keep the main.rs CLI
# definition declarative.
clap = { version = "4", features = ["derive", "env"] }
# hdrhistogram for percentile-aware latency tracking. Records
# microseconds in a fixed window; cheap recording, O(1) querying.
hdrhistogram = "7"
# Pseudo-RNG for workload generators. rand 0.8 already pulled in
# by ed25519-dalek; this brings rand_distr for lognormal sampling.
rand_distr = "0.4"

# darknyx-tee/solana_rpc — modular Solana crates (PR 4g.2+).
#
# We deliberately AVOID `solana-client` / `solana-sdk` 1.18 because
# they pull a `zeroize` major that conflicts with `ark-ec` 0.5.
# Instead use the post-modularisation 2.x/3.x split crates that
# `programs/vault`'s dev-deps already use. These compile cleanly
# alongside the existing `ark-*` 0.5 workspace deps because they
# share the same modern zeroize constraint.
#
# The JSON-RPC client itself is hand-rolled on top of `reqwest`
# (already in tree for oracle/hermes) so there's no `solana-rpc-
# client` dep — just the type system.
# `curve25519` feature unlocks `Address::find_program_address`,
# which we need for PDA derivation (`note_lock`, `vault_config`).
# Pins realigned to litesvm 0.13.0's requirements (the dev-dep that drives the
# test graph): it demands solana-address =2.2.0, solana-hash ^4.2.0,
# solana-instruction =3.2.0, solana-message =3.1.0, solana-signature ^3.3.0,
# solana-transaction ^3.1.0. darknyx-tee's runtime settle path shares these
# `{ workspace = true }` pins, so the whole graph unifies on one version set
# (a 3.x/4.x split is NOT resolvable — vault-dev's `=3.2.0` can't coexist with
# darknyx-tee's `~3.1`). The `copy` feature on solana-hash is REQUIRED: 4.x gates
# `impl Copy for Hash` behind `#[cfg_attr(feature = "copy", derive(Copy))]`, and
# darknyx-tee's settle path shares a single blockhash by value. Without it, the
# image's `cargo build -p darknyx-tee` (a narrow feature scope that doesn't pick up
# the feature transitively the way a `--workspace` build does) fails with
# "use of moved value: blockhash" in settle/worker.rs.
solana-address           = { version = "=2.2.0", features = ["curve25519"] }
solana-hash              = { version = "4", features = ["copy"] }
solana-keypair           = "~3.1"
solana-signature         = "^3.3"
solana-signer            = "~3.0"
# PR 4g.3 — ix / message / transaction construction. Same modular family.
solana-instruction       = "=3.2.0"
solana-message           = "=3.1.0"
# `serde` feature gives us `Transaction: Serialize`; `bincode`
# unlocks `Transaction::new_signed_with_payer` + tx serialise.
solana-transaction       = { version = "^3.1", features = ["serde", "bincode"] }
solana-system-interface  = "3.0.0"
# PR 4g.5c — per-batch ALT (Tx C). `bincode` feature unlocks the
# `create_lookup_table` / `extend_lookup_table` ix builders.
# Pinned to =3.0.1: 3.1.0 requires solana-instruction ^3.4, which
# conflicts with the workspace's `~3.1` pin (vault).
# 3.0.1 needs only solana-instruction 3.0, compatible with ours.
solana-address-lookup-table-interface = { version = "=3.0.1", features = ["bincode"] }

# bincode 1.x — Solana's tx wire format. Pinned at 1 because 2.x's
# API broke the `bincode::serialize` global fn.
bincode                  = "1"

# Dev builds: strip debuginfo from DEPENDENCIES only. The dependency
# graph here (solana-sdk, ark-*, groth16-solana, wasmer in darknyx-tee, …)
# is what makes target/debug balloon — each dep's unstripped debuginfo
# dominates the artifact size, and cargo never GCs the stale copies left
# by earlier builds. Stripping deps' debuginfo cuts target/debug roughly
# in half while keeping full debuginfo for our own workspace crates, so
# backtraces through Darknyx code are unaffected. (See README / dev-commands
# for the periodic `cargo clean`/`cargo-sweep` GC story.)
[profile.dev]
# Workspace crates build ~48 test binaries across the repo, and full debug info
# (rustc's `debug = 2` default) dominates both codegen and link time for every
# one of them. Line tables keep panic backtraces and test-failure locations —
# everything a test run actually consumes — and drop only the DWARF a
# step-debugger would want.
#
# Measured 2026-07-28: incremental rebuild + link of all test binaries after
# touching one source file, 19.35s -> 6.94s (-64%). If you need full debug info
# for a debugger session, override locally with
# `CARGO_PROFILE_DEV_DEBUG=2 cargo test ...` rather than editing this.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
