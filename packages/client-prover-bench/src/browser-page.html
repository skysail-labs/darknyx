<!doctype html>
<meta charset="utf-8" />
<title>Darknyx client prover benchmark</title>
<pre id="status">starting</pre>
<script type="module">
  const status = document.querySelector("#status");
  let maxMainThreadStallMs = 0;
  const config = await fetch("/config.json").then((response) =>
    response.json(),
  );
  async function measureMemory() {
    if (!config.collectMemory) return null;
    if (typeof performance.measureUserAgentSpecificMemory === "function") {
      const bytes = await Promise.race([
        performance.measureUserAgentSpecificMemory().then(({ bytes }) => bytes),
        new Promise((resolve) => setTimeout(() => resolve(null), 2_000)),
      ]);
      if (bytes !== null) {
        return { bytes, source: "measureUserAgentSpecificMemory" };
      }
    }
    return performance.memory?.usedJSHeapSize
      ? {
          bytes: performance.memory.usedJSHeapSize,
          source: "performance.memory.usedJSHeapSize",
        }
      : null;
  }
  const memoryBytesAtBoot = await measureMemory();
  let lastHeartbeat = performance.now();
  const heartbeat = setInterval(() => {
    const current = performance.now();
    maxMainThreadStallMs = Math.max(
      maxMainThreadStallMs,
      current - lastHeartbeat - 16,
    );
    lastHeartbeat = current;
  }, 16);
  const worker = new Worker("/browser-worker.js");
  worker.onmessage = async ({ data }) => {
    if (data.type === "soak_ready") {
      await fetch("/phase", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ phase: "soak" }),
      });
      worker.postMessage({ type: "start_soak" });
      return;
    }
    if (data.type === "progress") {
      status.textContent = `${data.mode} ${data.completed}`;
      return;
    }
    if (data.type === "error") {
      status.textContent = data.message;
      await fetch("/result", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ error: data.message }),
      });
      return;
    }
    if (data.type === "complete") {
      clearInterval(heartbeat);
      status.textContent = "complete";
      const memoryBytesAfter = await measureMemory();
      await fetch("/result", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          ...data,
          browser: {
            user_agent: navigator.userAgent,
            hardware_concurrency: navigator.hardwareConcurrency,
            device_memory_gib: navigator.deviceMemory ?? null,
            cross_origin_isolated: self.crossOriginIsolated,
            prover_threads: 1,
            measured_memory_bytes_at_boot: memoryBytesAtBoot?.bytes ?? null,
            measured_memory_source_at_boot: memoryBytesAtBoot?.source ?? null,
            measured_memory_bytes_after: memoryBytesAfter?.bytes ?? null,
            measured_memory_source_after: memoryBytesAfter?.source ?? null,
            max_main_thread_stall_ms: maxMainThreadStallMs,
          },
        }),
      });
    }
  };
  worker.postMessage(config);
</script>
