[package]
name = "vault"
version.workspace = true
edition.workspace = true
description = "Darknyx dark pool custody vault: UTXO note Merkle tree, nullifier set, consumed-notes set, note locks, Groth16 verification of spend + wallet-create proofs."

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# v2: anchor-spl no longer exposes `idl-build`. This project generates and
# consumes no IDL — the SDK hand-codes every discriminator and Borsh layout
# (CLAUDE.md §7.1) — so the feature is dropped outright rather than narrowed to
# anchor-lang alone. Nothing referenced it.

anchor-debug = []
custom-heap = []
custom-panic = []
# Host-side testing (disables BPF-only code paths).
test-sbf = []
# Compiles the DEV-NET-ONLY admin backdoors — `reset_merkle_tree` +
# `close_vault_config` (audit_1 F-01/F-02). OFF by default so a mainnet build
# (`cargo build-sbf`, no features) has NEITHER instruction discriminator and
# cannot freeze/brick funds. Dev, test, and devnet builds MUST pass
# `--features devnet-admin` (deploy-devnet.sh + the litesvm suites depend on it).
devnet-admin = []
[dependencies]
# v2 dropped the `init-if-needed` feature gate; the constraint is available
# unconditionally (guide §7.1). `deposit` still uses it for the per-mint
# OutstandingMint + vault ATA on the first deposit of each mint.
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
wincode = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-sha256-hasher = { workspace = true }
solana-instructions-sysvar = { workspace = true }
groth16-solana = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
darkpool-crypto = { path = "../../crates/darkpool-crypto" }
bytemuck = { version = "1.20.0", features = ["min_const_generics"] }

[target.'cfg(target_os = "solana")'.dependencies]
solana-poseidon = { workspace = true }

[target.'cfg(not(target_os = "solana"))'.dependencies]
light-poseidon = { workspace = true }

[dev-dependencies]
serde_json = "1.0"
# `precompiles` loads the Ed25519 program — the settle-regression tests
# (tee_forced_settle_batched / match_batch_verify, migrated from matching_engine)
# send the TEE Ed25519 signature-verify ix.
litesvm = { workspace = true, features = ["precompiles"] }
solana-account = "~3.4"
# v2 EXPERIMENT: was "=2.2.0". anchor-lang 2.0.0-rc.1 declares solana-address
# "^2.0" + wincode "^0.5", but solana-address only uses wincode 0.5 at 2.6.x
# (2.2-2.5 -> 0.4.x, 2.7 -> 0.6). Any other choice makes Address implement
# SchemaRead/SchemaWrite from a DIFFERENT wincode than the derive requires,
# and the failure names neither crate. Upstream declares a range it does not
# actually support.
solana-address = { workspace = true }
solana-instruction = "3"        # v2 EXPERIMENT: relaxed for litesvm 0.15.2
solana-keypair = "~3.1"
solana-message = "3"            # v2 EXPERIMENT: relaxed for litesvm 0.15.2
solana-signer = "~3.0"
solana-transaction = "^3.1"
solana-system-interface = "3.0.0"
sha2 = "0.10"
borsh = { workspace = true, features = ["derive"] }
darkpool-crypto = { path = "../../crates/darkpool-crypto" }
# Property-based fuzzing of the Merkle index handling (tests/merkle_fuzz.rs):
# randomized + shrinking sweeps of append_leaves / walk_merkle_path_n16.
proptest = "1"
bincode = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
