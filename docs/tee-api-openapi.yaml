openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# Darknyx TEE — API contract
#
# Wire contract for the confidential matching and settlement service.
#
# Conventions:
#   * Base URL: deployment origin; routes are mounted at `/`.
#   * Transport: TLS terminated INSIDE the enclave by dstack-ingress.
#     The TLS cert's private key is generated by the TEE and never
#     leaves it. Clients verify this binding by fetching the
#     /evidences/ bundle — see the `attestation` tag below.
#   * TLS terminates inside the confidential deployment. Clients verify the
#     evidence bundle and attestation before sending private order intent.
#   * Auth: OAuth2 client_credentials. Long-lived (api_key,
#     api_secret, passphrase) → short-lived bearer token.
#   * Settlement: matched orders are reserved until each match's Solana
#     settlement confirms. Per-match outcomes are independent; definitive
#     failures are terminal and ambiguous results remain reserved while
#     reconciling. Marker close is asynchronous cleanup after expiry.
#   * Markets: one attested venue may serve several isolated books. The signed
#     order symbol selects one book; proof batches never mix markets.
#   * Tree state: the TEE mirrors each `MerkleTree[tree_id].current_root`
#     + the full per-shard leaf set in-memory (K mirrors under
#     tree-sharding). `/tree/*` is a convenience mirror; correctness-critical
#     clients verify returned roots against Solana. Reads take optional
#     `?tree_id` (default 0).
#   * Transparency: `/transparency` is an unauthenticated convenience snapshot;
#     clients independently verify its chain-derived and attestation fields.
#
# Versioning: this is the canonical-order-v2 / settlement-payload-v9 contract.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Darknyx TEE API
  version: 4.1.0
  description: |
    Public + authenticated REST and WebSocket API for the Darknyx dark pool
    TEE matching layer. One attested endpoint may expose several independently
    routed spot markets. Pairs with the v2 on-chain custody program
    (vault, program ID `C63vKvysCzX55PKraas4Wc22ijqjGJQdPC1mrzCFVWZx`).
  contact:
    name: Darknyx engineering
  license:
    name: Apache-2.0

servers:
  - url: https://api.darknyx.example.com
    description: Mainnet placeholder; use the origin published with a deployment.
  - url: https://api.devnet.darknyx.example.com
    description: Devnet placeholder; use the origin published with a deployment.

# ─────────────────────────────────────────────────────────────────────────────
# Tags — grouped for docs rendering
# ─────────────────────────────────────────────────────────────────────────────

tags:
  - name: auth
    description: OAuth2 client-credentials and bearer-token lifecycle.
  - name: admin
    description: Admin-gated account provisioning, suspension, and token invalidation.
  - name: attestation
    description: |
      TEE attestation quote retrieval + RA-TLS evidence bundle. Verify
      before any sensitive write. The /evidences/* endpoints under
      this tag are served by dstack-ingress, not by darknyx-tee directly,
      but they're documented here for client-side completeness.
  - name: info
    description: |
      Application/instance metadata, boot-session id, and settlement signers.
      Verify measured identity through `/attestation`, not self-reported fields.
  - name: instruments
    description: Public market metadata.
  - name: orders
    description: Place / cancel / modify / inspect orders.
  - name: system
    description: Public engine liveness + server time (GTT slot conversion).
  - name: account
    description: Per-account open orders and preferences. Balances remain client-derived.
  - name: tree
    description: Convenience Merkle-tree mirror; clients can verify the same state on Solana.
  - name: transparency
    description: Public solvency snapshot + engine identity + aggregate stats.
  - name: settlement
    description: Batch settlement status (TEE → L1 tx_signature lookup).

# ─────────────────────────────────────────────────────────────────────────────
# Security schemes
# ─────────────────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived (≤ 1h) bearer token from POST /auth/token.

        Expiry is EXACT — there is no grace period past `expires_in`, on REST
        or on the streaming transport. Refresh on a margin.

        A structurally valid, unexpired token is still refused when it has been
        revoked (401), when the operator has invalidated the tokens the account
        was holding (401), or when the account is suspended (403). Suspension
        also blocks issuing a new one, so re-authenticating does not clear it.

  # ───── Shared schemas ──────────────────────────────────────────────────────

  schemas:

    Error:
      type: object
      description: |
        The error envelope. Every non-2xx response renders as this shape, with
        the mapped HTTP status. Success responses are NOT enveloped (their typed
        body is returned directly). Every response — success and error — carries
        an `x-request-id` header for correlation with server logs.
      required: [code, message]
      properties:
        code:
          type: integer
          description: |
            Stable numeric error code. Ranges: 1000–1099 request validation,
            1100–1199 auth, 1200–1299 conflict, 1300–1399 not found, 1400–1499
            rate limit, 5000+ server. See the Error Codes reference.

            One exception to the ranges: `1402` is returned with HTTP 503, not
            429. It signals that credential verification is momentarily at
            capacity and was refused rather than queued. Branch on the numeric
            code rather than inferring the status from its range.
          example: 1102
        message:
          type: string
          example: "trading_key_signature does not verify against the canonical body"

    AuthTokenRequest:
      type: object
      required: [api_key, api_secret, passphrase]
      properties:
        api_key:
          type: string
          description: Public credential identifier provisioned at account setup.
        api_secret:
          type: string
          format: password
          description: HMAC secret, paired with api_key.
        passphrase:
          type: string
          format: password
          description: Account-level passphrase (third factor; required).

    AuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, account_id]
      properties:
        access_token:
          type: string
          description: "Bearer token. Pass as `Authorization: Bearer <token>`."
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds from issue time. Expiry is exact; there is no validation leeway.
        account_id:
          type: string
          description: Stable per-account identifier.

    RegisterAccountRequest:
      type: object
      required: [api_key, api_secret, passphrase]
      properties:
        api_key:
          type: string
          description: Public credential identifier for the new account. Must be unique.
        api_secret:
          type: string
          format: password
          description: Secret for the new account. Argon2id-hashed before storage; never persisted in plaintext.
        passphrase:
          type: string
          format: password
          description: Account-level passphrase for the new account. Argon2id-hashed before storage.
        is_admin:
          type: boolean
          default: false
          description: Whether the new account may use the account-administration and settlement-metrics routes.

    RegisterAccountResponse:
      type: object
      required: [api_key, is_admin]
      properties:
        api_key:
          type: string
          description: The registered api_key (echoed back for confirmation).
        is_admin:
          type: boolean
          description: The role the account was created with. Secret/passphrase are never echoed.

    AttestationQuote:
      type: object
      description: |
        Intel TDX attestation quote, quote-bound event log, echoed report data,
        and the primary settlement signer. Fetch `/info.tee_pubkeys` for the
        complete ordered signer set committed by report_data.
      required: [quote, event_log, report_data, tee_pubkey]
      properties:
        quote:
          type: string
          description: Hex-encoded TDX quote (DCAP format).
        event_log:
          type: string
          description: |
            The dstack event log as a JSON STRING (an array of measured
            events — NOT hex-encoded). A client replays it against the
            DCAP-verified quote's RTMR3 to bind the recorded compose-hash
            + instance-id + key-provider events
            using the SDK attestation verifier.
        report_data:
          type: string
          description: |
            64-byte report_data field embedded in the quote, hex.
            Layout when callers pass `?reportData=<nonce>`:
              report_data[0..32] = caller-supplied nonce
              report_data[32..64] = SHA-256(pk_0 || ... || pk_{K-1})
        tee_pubkey:
          type: string
          description: |
            Base58 shard-0 Ed25519 settlement signer. This field alone is not
            the signer-set binding; verify the full `/info.tee_pubkeys` array
            against report_data and finalized on-chain VaultConfig.
        # The MRTD / RTMR0-3 fields are present inside the binary
        # quote and are exposed by dstack-verifier when verification
        # runs. They're not duplicated here as separate response
        # fields — clients parse them out of `quote` via dcap-qvl
        # (or by hitting Phala's /api/v1/attestations/verify endpoint).

    AppInfo:
      type: object
      description: |
        Application + instance metadata, returned by GET /info.
        Mirrors what dstack-sdk `client.info()` returns plus a
        couple of Darknyx-specific fields. Used in tandem with
        /attestation by the SDK's verifyTeeAttestation() helper.
      required: [app_id, instance_id, app_name, device_id, compose_hash, boot_session_id, tcb_info, tee_pubkey, tee_pubkeys, version]
      properties:
        app_id:
          type: string
          description: Hex app-id — deterministic from deployer + compose.
        instance_id:
          type: string
          description: Hex instance-id of this specific CVM.
        app_name:
          type: string
        compose_hash:
          type: string
          description: |
            SHA-256 of canonicalised app-compose.json. CONVENIENCE ONLY —
            the client's attestation check pins its EXPECTED_COMPOSE_HASH
            against the compose-hash read from the DCAP-VERIFIED quote's
            RTMR3 event log, NOT against this self-reported field (a
            malicious gateway can put anything here).
        boot_session_id:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: |
            Fresh 32-byte process-boot session id, hex. Every canonical place
            and cancel intent binds this value, so requests prepared before a
            CVM restart cannot be replayed into the new process.
        tcb_info:
          type: object
          required: [mrtd]
          properties:
            mrtd:
              type: string
              description: Initial Trust Domain measurement.
        device_id:
          type: string
          description: TDX platform identifier of this host (PPID-derived).
        tee_pubkey:
          type: string
          description: |
            Base58 Ed25519 pubkey (same as in AttestationQuote). This is
            the PRIMARY (shard-0) signer. Under tree-sharding the TEE
            derives K = num_trees signer keys (paths
            darknyx/ed25519-signer/v2/{0..K-1}); all K are registered in the
            on-chain `vault_config.tee_pubkeys` set via one
            `set_tee_pubkey` rotation, and each is a shard settle
            fee-payer. Prefer the complete set below.
        tee_pubkeys:
          type: array
          items: { type: string }
          description: |
            The FULL K-shard signer set (base58, shard order) — every key
            the vault accepts settle payloads from. A client reconciles this
            against finalized on-chain `vault_config.tee_pubkeys`. The quote's
            report_data binds SHA-256 of their raw concatenation in shard order;
            `tee_pubkey` is `tee_pubkeys[0]`.
        version:
          type: string
          description: Semver tag of the darknyx-tee build (e.g. v0.4.2).

    RaTlsEvidence:
      type: object
      description: |
        Evidence files used to verify that the served TLS certificate is bound
        to a key held inside the confidential deployment.
      properties:
        quote_json:
          type: string
          description: Contents of /evidences/quote.json (TDX quote bundle).
        cert_pem:
          type: string
          description: Current TLS cert, PEM-encoded.
        acme_account_json:
          type: string
          description: |
            JSON document with the dstack-ingress-managed
            Let's Encrypt account URI.
        sha256sum_txt:
          type: string
          description: |
            SHA-256 of (cert_pem || acme_account_json). The quote's
            report_data contains sha256(sha256sum_txt) — the binding.

    Instrument:
      type: object
      description: |
        One isolated market served by this attested venue. Every returned
        instrument shares the same gateway/session identity but has its own
        governed mint pair, book, oracle, and proof batches.
      required: [symbol, base_mint, quote_mint, tick_size, min_order_size, oracle]
      properties:
        symbol:
          type: string
          description: Canonical symbol signed into an order and used for book routing.
          example: "SOL-USDC"
        base_mint:
          type: string
          description: Base SPL mint pubkey (base58).
        quote_mint:
          type: string
          description: Quote SPL mint pubkey (base58).
        tick_size:
          type: string
          description: Raw integer price increment in protocol price units.
        min_order_size:
          type: string
          description: Raw integer minimum amount in the base mint's smallest units.
        oracle:
          type: object
          required: [type, pubkey]
          properties:
            type: { type: string, enum: [pyth_pull_v2] }
            pubkey: { type: string, description: Pyth feed identifier (typically 32-byte hex). }

    PlaceOrderRequest:
      type: object
      description: |
        The canonical-order v2 wire schema (`darknyx-order-v4` signature
        domain). All
        32/64/16-byte fields are
        hex-encoded strings; all numeric fields are JSON integers (u64).
        The trading-key signature covers the canonical encoding of the
        economic fields, `viewing_pubkey`, `session_id`, and `arrival_nonce`;
        the opening fields (`owner_commitment`, `note_inner_hash`) are pinned
        indirectly because the matcher re-derives
        `note_commitment` from them and rejects a mismatch.
      required:
        - symbol
        - side
        - order_type
        - amount
        - price_limit
        - expiry_slot
        - order_id
        - note_commitment
        - user_commitment
        - arrival_nonce
        - trading_key
        - trading_key_signature
        - owner_commitment
        - note_inner_hash
        - merkle_root
        - valid_input_proof
        - viewing_pubkey
        - session_id
      properties:
        symbol:
          type: string
        side:
          type: string
          enum: [bid, ask]
          description: "`bid` = buy base; `ask` = sell base."
        order_type:
          type: string
          enum: [limit, ioc, fok]
        amount:
          type: integer
          format: uint64
          description: Order size in base units.
        price_limit:
          type: integer
          format: uint64
          description: |
            Worst acceptable price, in quote units per base. Required for
            a bid (must be > 0); an ask may use `0` to accept any clearing
            price. Every non-zero value must be an integer multiple of the
            instrument's `tick_size`.
        min_fill_size:
          type: integer
          format: uint64
          description: |
            Optional (default 0). Reject fills smaller than this; set equal
            to `amount` for resting all-or-none.
        expiry_slot:
          type: integer
          format: uint64
          description: |
            Solana slot past which this order auto-expires. Bounded by the
            protocol maximum (currently 4,500 slots) to prevent an unbounded
            collateral-lock window.
        order_id:
          type: string
          description: 16-byte client-chosen id, hex. Must be unique + non-zero.
        note_commitment:
          type: string
          description: |
            32-byte hex — Poseidon6 commitment to the collateral note this
            order is backed by. The opening and VALID_INPUT proof are checked
            at intake on a settlement-enabled venue. The commitment can reserve
            at most one live or settlement-pending order in this venue; the
            on-chain lock remains the final authority at settlement.
        user_commitment:
          type: string
          description: |
            32-byte hex — intended output-owner identity signed into the order.
            Top byte must be zero (BN254 Fr safety). Current settlement derives
            the actual output owner from the verified, note-bound
            `owner_commitment` rather than trusting this client assertion.
        arrival_nonce:
          type: integer
          format: uint64
          description: |
            Nonce bound into the signed canonical body. After exact-body
            idempotency handling, it must be strictly greater than every prior
            accepted nonce for the same trading key.
        trading_key:
          type: string
          description: 32-byte hex — the Ed25519 public key that owns this order.
        trading_key_signature:
          type: string
          description: |
            64-byte hex — Ed25519 signature over `sha256(canonical body)`
            from the trading key. Lets the TEE attribute the order to a
            specific key without a per-order on-chain tx.
        owner_commitment:
          type: string
          description: |
            32-byte hex — the collateral note's owner commitment
            `Poseidon3(DOMAIN_OWNER=1, spending_key, r_owner)`. Part of the
            input-note opening the in-TEE VALID_MATCH_BATCH prover needs
            (the circuit re-derives `note_commitment` from the opening).
            Distinct from `user_commitment`. Verified against the signed
            `note_commitment` at intake. Held in enclave memory only.
        note_inner_hash:
          type: string
          description: |
            32-byte hex — the collateral note's amount-independent
            `inner_hash`, which anchors both its commitment and nullifier.
        merkle_root:
          type: string
          description: |
            32-byte hex — the merkle root the `valid_input_proof` was
            generated against. A settlement-enabled venue checks its recent-root
            mirror before accepting the order; `lock_note` checks the
            authoritative on-chain window again at settlement.
        valid_input_proof:
          type: string
          description: |
            256-byte hex (`pi_a ‖ pi_b ‖ pi_c`) — the per-note VALID_INPUT
            Groth16 proof that gates `lock_note`. The TEE cannot generate
            it (needs the spending key + merkle witness), so the client
            supplies it. A settlement-enabled venue verifies it at intake
            against `(merkle_root, note_commitment, collateral mint)`;
            on-chain `lock_note` verifies it again. Enqueue-only simulator /
            load-test deployments do not settle and may deliberately accept
            stub proofs.
        collateral_amount:
          type: integer
          format: uint64
          description: |
            Optional over-collateralization: the actual value the
            collateral note carries when it exceeds the order's nominal
            cost. Lets a large note back a small order; the surplus returns
            as a change note. Omit for exact collateral.
        tree_id:
          type: integer
          format: uint8
          default: 0
          description: Merkle-tree shard containing the collateral note.
        viewing_pubkey:
          type: string
          description: |
            Required 32-byte contributory X25519 viewing-encryption public key,
            hex (`deriveViewingEncKeypair().publicKey`). The TEE
            encrypts each fill's `(trade, change)` output amounts to it and
            writes the ciphertext on-chain, so exact and partial output notes
            remain recoverable after a CVM redeploy. It is signed; low-order
            encodings that yield an all-zero shared secret are rejected.
        session_id:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: |
            Required 32-byte boot session id from `GET /info`, hex, bound into
            the signature. A stale session is rejected even when every other
            field and signature is valid.

    PlaceOrderResponse:
      type: object
      required: [order_id, status, arrival_slot]
      properties:
        order_id: { type: string }
        status: { type: string, enum: [accepted] }
        arrival_slot: { type: integer, format: uint64 }

    CancelOrderRequest:
      type: object
      required: [trading_key, cancel_nonce, session_id, trading_key_signature]
      properties:
        trading_key: { type: string, description: 32-byte Ed25519 pubkey, hex. }
        cancel_nonce: { type: integer, format: uint64 }
        session_id: { type: string, description: 32-byte hex boot session from /info; bound into the cancel signature so a captured body cannot be replayed in a later boot. }
        trading_key_signature: { type: string, description: 64-byte canonical cancel signature, hex. }

    CancelOrderResponse:
      type: object
      required: [order_id, status]
      properties:
        order_id: { type: string }
        status: { type: string, enum: [cancelled] }

    ModifyOrderRequest:
      type: object
      required: [cancel_signature, cancel_nonce, replacement]
      properties:
        cancel_signature: { type: string, description: 64-byte signature over the old order's canonical cancel body. }
        cancel_nonce: { type: integer, format: uint64 }
        replacement: { $ref: '#/components/schemas/PlaceOrderRequest' }

    ModifyOrderResponse:
      type: object
      required: [old_order_id, order_id, status, arrival_slot]
      properties:
        old_order_id: { type: string }
        order_id: { type: string, description: Replacement id; may equal old_order_id for reprice-in-place. }
        status: { type: string, enum: [modified] }
        arrival_slot: { type: integer, format: uint64 }

    Order:
      type: object
      description: The `GET /orders/{order_id}` status body.
      required:
        - order_id
        - symbol
        - side
        - order_type
        - status
        - amount
        - filled_quantity
        - price_limit
        - expiry_slot
        - arrival_slot
      properties:
        order_id:
          type: string
          description: 16-byte order id, hex (the one supplied at placement).
        symbol:
          type: string
          description: Canonical instrument symbol selecting the isolated market book.
        side: { type: string, enum: [bid, ask] }
        order_type: { type: string, enum: [limit, ioc, fok] }
        status:
          type: string
          enum: [empty, pending, pending_settlement, expired, cancelled]
          description: |
            `pending` (resting), `pending_settlement` (reserved while the TEE
            reconciles Tx D), `expired`, `cancelled`, or `empty` (slot
            reclaimed). Definitive failures leave the order lookup surface and
            emit terminal `settlement_failed` on the authenticated orders
            channel with a reason and lock expiry slot.
        amount:
          type: integer
          format: uint64
          description: Original order size, base units.
        filled_quantity:
          type: integer
          format: uint64
          description: Cumulative filled quantity.
        price_limit: { type: integer, format: uint64 }
        expiry_slot: { type: integer, format: uint64 }
        arrival_slot:
          type: integer
          format: uint64
          description: Slot stamped on arrival; frozen for the order's life.

    Account:
      type: object
      description: |
        `GET /account` response. Returns ONLY the caller's open orders — the
        slice of account state the TEE legitimately holds (it tracks the
        order_id→account map at intake). Balances and notes are intentionally
        absent: linking an account to its notes needs the spending key, which
        the TEE never sees. Clients derive balances + spendable notes themselves
        from `/tree/*` + their own keys.
      required: [account_id, open_orders]
      properties:
        account_id: { type: string }
        open_orders:
          type: array
          description: The caller's orders still resting across all market books.
          items: { $ref: '#/components/schemas/Order' }

    AccountSettings:
      type: object
      description: |
        Per-account preferences (`GET`/`PUT /account/settings`), persisted with
        the account. Omitted fields default on `PUT`.
      properties:
        cancel_on_disconnect_default:
          type: boolean
          description: |
            Account-wide default for `/v1/stream` cancel-on-disconnect. A
            login frame's explicit `cancel_on_disconnect` value overrides it.
          default: false

    DrainStatus:
      type: object
      required: [draining, cancelled_resting, in_flight_settlements, safe_to_stop]
      properties:
        draining:
          type: boolean
          description: Whether a planned stop has been requested on this instance.
        cancelled_resting:
          type: integer
          description: |
            Resting orders cancelled by THIS request. Always 0 on a `GET`.
        in_flight_settlements:
          type: integer
          description: |
            Settlements still recorded in the write-ahead journal. Zero is a
            precondition for `safe_to_stop`.
        safe_to_stop:
          type: boolean
          description: |
            True only when trading is closed AND no settlement is in flight.
            Stopping the CVM while this is false risks work the journal would
            have to reconcile on the next boot.
        caveat:
          type: string
          description: |
            Present when the journal is not persistent (no state dir configured).
            The readiness answer then concerns this process's memory only, and a
            restart would recover nothing regardless of draining.

    TreeRoot:
      type: object
      required: [tree_id, merkle_root, leaf_count, on_chain_slot]
      properties:
        tree_id:
          type: integer
          default: 0
          description: |
            Which Merkle shard this root is for (echoes the request's
            `?tree_id`, default 0). Present under tree-sharding.
        merkle_root:
          type: string
          description: |
            Current Merkle root of shard `tree_id`, hex-encoded. It should
            equal finalized on-chain `MerkleTree[tree_id].current_root`.
            Historical roots accepted through the on-chain 64-entry history
            are not returned by this endpoint.
        leaf_count:
          type: integer
          description: Leaf count of this shard.
        on_chain_slot:
          type: integer
          description: |
            Solana slot at which the TEE last synced this shard's mirror
            from on-chain `MerkleTree[tree_id]`.

    InclusionProof:
      type: object
      required: [note_commitment, leaf_index, merkle_root, siblings]
      properties:
        note_commitment: { type: string }
        leaf_index: { type: integer }
        merkle_root: { type: string }
        siblings:
          type: array
          minItems: 20
          maxItems: 20
          items:
            type: string
            description: 32-byte hex.

    TransparencySnapshot:
      type: object
      required: [reserves, tee, stats]
      description: |
        Public, unauthenticated convenience snapshot. Independently read the
        corresponding Solana accounts and verify `/attestation` before treating
        the reserve or engine-identity fields as trusted evidence.
      properties:
        reserves:
          type: object
          required: [merkle_root, leaf_count, per_mint]
          properties:
            merkle_root:
              type: string
              description: |
                Shard-0 root. Under tree-sharding each
                shard has its own root; read per-shard via
                `/tree/root?tree_id=`.
            leaf_count:
              type: integer
              description: Total leaves SUMMED across all `num_trees` shards.
            per_mint:
              type: array
              items:
                type: object
                required: [mint, outstanding, vault_balance, stale]
                properties:
                  mint: { type: string }
                  outstanding:
                    type: string
                    description: |
                      Sum of unspent note amounts for this mint, in the mint's
                      smallest integer units.
                  vault_balance:
                    type: string
                    description: |
                      SPL balance in the vault token account, in the mint's
                      smallest integer units. Solvency requires this to be at
                      least `outstanding`.
                  stale:
                    type: boolean
                    description: |
                      true if either on-chain read was DEGRADED (RPC
                      error or malformed account); outstanding /
                      vault_balance are then "unknown", not a real 0 —
                      ignore the numbers for a solvency check.
        tee:
          type: object
          description: |
            Engine attestation IDENTITY — enough to tie this response to
            a measured image. The full challenge-response quote is at
            GET /attestation.
          required: [app_id, compose_hash, mrtd, signer_pubkey]
          properties:
            app_id: { type: string }
            compose_hash: { type: string }
            mrtd: { type: string }
            signer_pubkey:
              type: string
              description: Shard-0 Ed25519 signer (base58); verify the full set via `/info` and `/attestation`.
        stats:
          type: object
          description: Aggregate settlement-scheduler counters.
          required: [batches, jobs]
          properties:
            batches: { type: integer, description: Settle batches tracked. }
            jobs: { type: integer, description: Per-match settle jobs tracked. }

    SettlementStatus:
      type: object
      required: [batch_id, jobs]
      properties:
        batch_id: { type: integer, format: uint64 }
        jobs:
          type: array
          description: |
            Per-match status in match-index order. Confirmed siblings can reach
            `done` while an ambiguous sibling remains `settling` and redrives.
          items:
            type: object
            required: [batch_id, match_idx, stage, outcome, created_at_ms, last_transition_at_ms]
            properties:
              batch_id: { type: integer, format: uint64 }
              match_idx: { type: integer, format: uint8 }
              stage:
                type: string
                enum: [queued, locking_notes, proving, verifying, settling, closing, done, failed]
              outcome:
                type: object
                required: [kind]
                description: |
                  `ambiguous` is non-terminal and remains reserved while the TEE
                  reconciles both consumed-note PDAs and redrives within the
                  marker/lock window. `rejected` is terminal.
                properties:
                  kind: { type: string, enum: [pending, confirmed, rejected, ambiguous] }
                  signature: { type: string }
                  slot: { type: integer, format: uint64 }
                  reconciled_from_consumed_pdas: { type: boolean }
                  reason: { type: string }
              failed_reason: { type: string }
              created_at_ms: { type: integer, format: uint64 }
              last_transition_at_ms: { type: integer, format: uint64 }
              lock_buyer_sig: { type: string }
              lock_seller_sig: { type: string }
              verify_sig: { type: string }
              settle_sig: { type: string }
              close_sig:
                type: string
                description: Normally absent because marker close is asynchronous.

    OrderLifecycleUpdate:
      type: object
      required: [order_id, market_id, server_time_ms, kind]
      description: |
        One account-scoped event on the `/v1/stream` `orders` channel.
        `market_id` is the base58 `MarketConfig` PDA. Settlement-related
        transitions carry `match_id` as a decimal string so JavaScript clients
        do not lose u64 precision.
      properties:
        order_id: { type: string, description: 16-byte order id, hex. }
        market_id: { type: string, description: Base58 MarketConfig PDA. }
        match_id:
          type: string
          pattern: '^[0-9]+$'
          description: Present for pending, confirmed-fill, and settlement-failure transitions.
        server_time_ms: { type: integer, format: uint64 }
        kind:
          type: string
          enum: [pending_settlement, partially_filled, fully_filled, settlement_failed, cancelled, expired]
        filled_quantity: { type: integer, format: uint64 }
        new_amount: { type: integer, format: uint64 }
        new_note_amount: { type: integer, format: uint64 }
        reason: { type: string }
        lock_expiry_slot: { type: integer, format: uint64 }

    SettlementStageTimings:
      type: object
      description: Millisecond stage timings; absent stages did not complete.
      properties:
        lock_ms: { type: integer, format: uint64 }
        witness_ms: { type: integer, format: uint64 }
        prove_step_ms: { type: integer, format: uint64 }
        prove_ms: { type: integer, format: uint64 }
        verify_ms: { type: integer, format: uint64 }
        alt_tx_ms: { type: integer, format: uint64 }
        alt_wait_ms: { type: integer, format: uint64 }
        parallel_ms: { type: integer, format: uint64 }
        settle_ms: { type: integer, format: uint64 }
        close_ms: { type: integer, format: uint64 }
        total_ms: { type: integer, format: uint64 }

    SettlementBatchMetric:
      type: object
      required:
        - seq
        - batch_id
        - market_id
        - match_ids
        - active_matches
        - padded_slots
        - enqueued_at_ms
        - started_at_ms
        - completed_at_ms
        - queue_wait_ms
        - prover_backend
        - witness_backend
        - settle_concurrency
        - settle_send_concurrency
        - timings
        - outcomes
        - confirmed_slots
        - distinct_confirmed_slots
        - rebroadcasts
      properties:
        seq: { type: integer, format: uint64 }
        batch_id: { type: integer, format: uint64 }
        market_id: { type: string, description: Base58 MarketConfig PDA. }
        match_ids:
          type: array
          items: { type: string, pattern: '^[0-9]+$' }
        active_matches: { type: integer, format: uint16 }
        padded_slots: { type: integer, format: uint16 }
        enqueued_at_ms: { type: integer, format: uint64 }
        started_at_ms: { type: integer, format: uint64 }
        completed_at_ms: { type: integer, format: uint64 }
        queue_wait_ms: { type: integer, format: uint64 }
        prover_backend: { type: string }
        witness_backend: { type: string }
        prover_device: { type: string }
        settle_concurrency: { type: integer, format: uint16 }
        settle_send_concurrency: { type: integer, format: uint16 }
        timings: { $ref: '#/components/schemas/SettlementStageTimings' }
        outcomes:
          type: object
          required: [confirmed, rejected, ambiguous]
          properties:
            confirmed: { type: integer, format: uint64 }
            rejected: { type: integer, format: uint64 }
            ambiguous: { type: integer, format: uint64 }
        confirmed_slots: { type: integer, format: uint16 }
        distinct_confirmed_slots: { type: integer, format: uint16 }
        rebroadcasts: { type: integer, format: uint32 }
        pipeline_failure:
          type: string
          description: Stable low-cardinality failure label; raw RPC/provider errors are never retained here.

    SettlementMetrics:
      type: object
      required:
        - boot_session_id
        - app_id
        - compose_hash
        - version
        - schema_version
        - generated_at_ms
        - latest_seq
        - cursor_gap
        - counters
        - queue
        - histograms
        - recent_batches
      description: |
        Bounded, in-memory, privacy-preserving settlement telemetry. It never
        includes prices, amounts, order ids, commitments, owners, or witnesses.
        A `cursor_gap` means the caller fell behind the retained 1,024 records.
      properties:
        boot_session_id: { type: string }
        app_id: { type: string }
        compose_hash: { type: string }
        version: { type: string }
        schema_version: { type: integer, format: uint16 }
        generated_at_ms: { type: integer, format: uint64 }
        latest_seq: { type: integer, format: uint64 }
        oldest_available_seq: { type: integer, format: uint64 }
        cursor_gap: { type: boolean }
        counters: { type: object, additionalProperties: { type: integer, format: uint64 } }
        queue:
          type: object
          required: [depth, waiting_batches, running_batches, oldest_batch_age_ms, by_market]
          properties:
            depth: { type: integer, format: uint64 }
            waiting_batches: { type: integer, format: uint64 }
            running_batches: { type: integer, format: uint64 }
            oldest_batch_age_ms: { type: integer, format: uint64 }
            by_market: { type: object, additionalProperties: { type: object } }
        histograms: { type: object, additionalProperties: { type: object } }
        recent_batches:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/SettlementBatchMetric' }

# ─────────────────────────────────────────────────────────────────────────────
# REST endpoints
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ───── auth ────────────────────────────────────────────────────────────────

  /auth/token:
    post:
      tags: [auth]
      summary: Exchange long-lived credentials for a short-lived bearer token.
      description: |
        OAuth2 client_credentials grant. Issue rate is rate-limited per
        api_key: an account that exhausts its own allowance is throttled
        without affecting any other account, and an unrecognised api_key is
        rejected before any credential hashing, so it consumes no allowance at
        all.

        Credential verification is deliberately expensive, so the service
        bounds how much of it runs at once and REFUSES excess requests (503)
        rather than queueing them. A 429 message includes an approximate retry
        delay; use a short jittered retry for 503.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthTokenRequest' }
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '401':
          description: Bad credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The account exists but is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            This account's authentication allowance is exhausted. The message
            includes an approximate retry delay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: |
            Credential verification is at capacity. Shed rather than queued, so
            this clears quickly; use a short jittered retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/token/revoke:
    post:
      tags: [auth]
      summary: Revoke an issued bearer token.
      description: |
        Revokes the calling bearer token. Subsequent requests presenting the
        same token are rejected with 401, including after an engine restart.
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: Revoked. }
        '401':
          description: Token already invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───── admin ─────────────────────────────────────────────────────────────────

  /admin/drain:
    get:
      summary: Is it safe to stop this CVM?
      description: |
        Operator control for a PLANNED stop (redeploy, env change, shutdown).
        Admin-gated.

        `safe_to_stop` is computed from the in-flight settlement journal — the
        same durable state a restart would read — and never from elapsed time. A
        timer-based answer would grant permission to stop mid-settlement, which
        is exactly what the journal exists to survive.

        It requires BOTH conditions: trading closed AND nothing in flight. An
        empty journal on its own means nothing, because the next matcher tick can
        enqueue a settlement.

        Draining is NOT crash recovery and must not be described as a substitute
        for it in any runbook. It only helps when someone chooses to stop; a
        crash or an involuntary host migration gets none of it.
      tags: [admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Current drain state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrainStatus' }
        '401':
          description: Missing / invalid bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Authenticated account is not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Begin draining
      description: |
        Closes new trading and cancels every resting order, so clients are told
        explicitly instead of finding an empty book after the redeploy. Resting
        collateral is NOT locked on-chain at this stage, so this frees nothing
        and costs a re-place.

        Idempotent: repeating the request pauses once and reports truthfully.
        Poll `GET /admin/drain` until `safe_to_stop` is true before stopping.
      tags: [admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Drain requested; state after the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrainStatus' }
        '401':
          description: Missing / invalid bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Authenticated account is not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Abandon the drain
      description: |
        Re-opens trading. Clears ONLY the drain reason — an oracle or governance
        pause set while draining stays set, so cancelling a redeploy cannot
        re-open a venue some other condition independently closed.
      tags: [admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Drain abandoned; state after the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrainStatus' }
        '401':
          description: Missing / invalid bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Authenticated account is not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/accounts:
    post:
      tags: [admin]
      summary: Register a new API account (admin only).
      description: |
        Admin-gated account provisioning. The supplied secret and passphrase
        are stored only as password hashes and are never returned by the API.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAccountRequest' }
      responses:
        '201':
          description: Account registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterAccountResponse' }
        '400':
          description: Missing / empty api_key, api_secret, or passphrase.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing / invalid / revoked bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is authenticated but not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: An account with this api_key already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/accounts/{api_key}/disable:
    post:
      tags: [admin]
      summary: Suspend an account (admin only).
      description: |
        Suspends the account immediately. Every bearer token it currently holds
        stops being accepted on the next request — on HTTP and on the streaming
        socket alike — and it cannot obtain a new one until re-enabled.

        Enforcement happens at token validation against the live account
        record, so suspension does not wait for outstanding tokens to expire.

        Refused with 409 if the target is the only enabled admin: that would
        put every administrative route out of reach, including the enable that
        would reverse it, and a restart does not recover because the bootstrap
        seed only fires when its api_key is absent — not when the account it
        finds is suspended.

        Idempotent.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: api_key
          required: true
          schema: { type: string }
          description: The api_key identifying the account to suspend.
      responses:
        '204': { description: Account suspended. }
        '401':
          description: Missing / invalid / revoked bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is authenticated but not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No account with this api_key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            The target is the only enabled admin. Enable another admin first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/accounts/{api_key}/enable:
    post:
      tags: [admin]
      summary: Reinstate a suspended account (admin only).
      description: |
        Clears a suspension. Does not revive tokens that were separately
        invalidated via `/admin/accounts/{api_key}/revoke-tokens`.

        Idempotent.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: api_key
          required: true
          schema: { type: string }
      responses:
        '204': { description: Account reinstated. }
        '401':
          description: Missing / invalid / revoked bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is authenticated but not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No account with this api_key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/accounts/{api_key}/revoke-tokens:
    post:
      tags: [admin]
      summary: Invalidate every token currently held by an account (admin only).
      description: |
        Refuses every bearer token issued to the account up to and including
        the current second, WITHOUT suspending the account. Intended for a
        suspected token leak on an account that is otherwise in good standing:
        the holder authenticates again and continues, while anything issued
        earlier stops working.

        Because issuance timestamps have one-second resolution and the cutoff
        is inclusive, a client that re-authenticates in the same second may
        need one retry.

        If the CREDENTIALS are believed compromised rather than a token, this
        is not sufficient on its own — the holder can simply authenticate
        again. Use `/admin/accounts/{api_key}/disable`.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: api_key
          required: true
          schema: { type: string }
      responses:
        '204': { description: Outstanding tokens invalidated. }
        '401':
          description: Missing / invalid / revoked bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is authenticated but not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No account with this api_key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───── attestation ─────────────────────────────────────────────────────────

  /attestation:
    get:
      tags: [attestation]
      summary: Fresh TEE attestation quote (challenge-response).
      description: |
        Unauthenticated. Clients MUST verify this quote before sending private
        order intent.

        The caller supplies a fresh nonce via reportData; the TEE
        generates a quote with reportData populated as:
            report_data[0..32]  = caller's nonce
            report_data[32..64] = SHA-256(pk_0 || ... || pk_{K-1})

        Verification steps (handled by the SDK's
        verifyTeeAttestation() helper):
          1. Verify the Intel TCB certificate chain and quote locally.
          2. Replay RTMR3 event log → confirm rt_mr3 in quote.
          3. Confirm the measured compose hash is an approved release.
          4. Confirm the measured signer derivation context.
          5. Confirm reportData starts with the supplied nonce
             and ends with the hash of the complete ordered signer set.
          6. Compare every signer with finalized on-chain VaultConfig.
      parameters:
        - name: reportData
          in: query
          required: false
          schema: { type: string }
          description: |
            32-byte nonce in hex. If omitted, the TEE generates a
            quote with all-zero reportData[0..32]. Always supply a
            fresh nonce for live verification (replay protection).
      responses:
        '200':
          description: Current quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationQuote' }

  /info:
    get:
      tags: [info]
      summary: Application + instance metadata.
      description: |
        Returns application and instance metadata, the current boot-session
        identifier, and the complete ordered settlement-signer set. The
        compose hash here is a convenience value; security-sensitive clients
        verify the measured event log returned by `/attestation`.
      responses:
        '200':
          description: Application info.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInfo' }

  /evidences/quote.json:
    get:
      tags: [attestation]
      summary: (Served by dstack-ingress, not darknyx-tee) TDX quote bundle.
      description: |
        Static evidence file in the TLS verification chain. Its digest is bound
        into the attested evidence bundle.
      responses:
        '200':
          description: Quote JSON bundle (raw).
          content:
            application/json: {}

  /evidences/cert.pem:
    get:
      tags: [attestation]
      summary: (Served by dstack-ingress) Current TLS certificate.
      responses:
        '200':
          description: PEM-encoded cert.
          content:
            application/x-pem-file: {}

  /evidences/acme-account.json:
    get:
      tags: [attestation]
      summary: (Served by dstack-ingress) Let's Encrypt account URI.
      description: |
        Used together with CAA DNS records to prove that ONLY this
        TEE's ACME account can issue certs for this domain.
      responses:
        '200':
          description: ACME account JSON.
          content:
            application/json: {}

  /evidences/sha256sum.txt:
    get:
      tags: [attestation]
      summary: (Served by dstack-ingress) Hash of cert.pem + acme-account.json.
      description: |
        Allows clients to verify the evidence bundle wasn't tampered
        with. The quote's reportData contains sha256(this file).
      responses:
        '200':
          description: Plain-text hash.
          content:
            text/plain: {}

  # ───── instruments ─────────────────────────────────────────────────────────

  /instruments:
    get:
      tags: [instruments]
      summary: List all tradable instruments.
      description: |
        Returns every independently routed market served by this one attested
        venue. The array may contain multiple pairs; all use the same gateway,
        bearer session, and `/v1/stream` connection.
      responses:
        '200':
          description: All markets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Instrument' }

  /instruments/{symbol}:
    get:
      tags: [instruments]
      summary: Single instrument detail.
      description: |
        Returns one configured market. Use its canonical symbol unchanged in
        signed order requests.
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Instrument detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '404':
          description: Unknown symbol.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───── orders ──────────────────────────────────────────────────────────────

  /orders:
    post:
      tags: [orders]
      summary: Place a new order.
      description: |
        Routes the signed symbol to one market book, checks the note opening,
        recent proof root, and VALID_INPUT proof before booking on a
        settlement-enabled venue, then reserves the collateral commitment
        inside this venue.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '202':
          description: Order accepted into the matching queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceOrderResponse' }
        '400':
          description: |
            Validation error, including malformed fields, off-tick price,
            opening mismatch, stale proof root (1010), or invalid VALID_INPUT
            proof (1011).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing / invalid / expired / revoked bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Account suspended or trading-key signature invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Conflict — the referenced note_commitment is already
            reserved by another live or settlement-pending order, the order id
            is in use, or a replay/session nonce is stale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-account order-operation limit exceeded. Includes Retry-After.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: New trading is paused because a required subsystem or finalized governance view is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{order_id}:
    get:
      tags: [orders]
      summary: Current status of a live order.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          description: |
            Unknown order or an order owned by another account. Both cases use
            the same response so this endpoint is not an order-existence oracle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing / invalid / expired / revoked bearer token, or a
            token invalidated by the operator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [orders]
      summary: Cancel an open order.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
      responses:
        '200':
          description: Cancellation processed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelOrderResponse' }
        '400':
          description: Malformed id, key, session, or signature encoding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing / invalid / expired / revoked bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Account suspended, signature invalid, or trading key does not own the order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Order doesn't exist or is already terminal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The cancel nonce did not advance or the boot session is stale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [orders]
      summary: |
        Modify an open order — atomic cancel + replace.
      description: |
        "The same owner replaces their resting order with a new one." The body
        carries a signed cancel of the OLD order (over its id) plus a full new
        order (`replacement`, a normal signed order). The trading key that signs
        the cancel MUST be the one that signs the replacement. The swap is
        applied under one matcher lock with BOTH preconditions checked first
        (old order exists + owned; replacement order_id not already booked unless
        it is the same id, a reprice in place), so there is no window where the
        caller has neither order. The replacement carries its own note +
        VALID_INPUT proof (it may reuse the old note while the root is still in
        the recent-root window) — no new signed message type; it composes the
        existing cancel + order canonical bodies. The replacement must use the
        original order's symbol: moving between isolated market books requires
        cancel + a fresh placement. Its session_id also scopes the embedded
        cancel signature to the current boot.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
          description: The OLD order's id (hex) to replace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyOrderRequest' }
      responses:
        '200':
          description: Modified — old order cancelled, replacement resting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModifyOrderResponse' }
        '400':
          description: |
            Malformed request, cross-market replacement, or replacement
            place-order validation failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing / invalid / expired / revoked bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            Account suspended, or the booked order is not owned by this
            trading_key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The old order doesn't exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The replacement order_id is already booked, or a nonce/session is stale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: New trading became paused while the replacement was verified; the original order is unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───── account ─────────────────────────────────────────────────────────────

  /account:
    get:
      tags: [account]
      summary: The caller's open orders.
      description: |
        Returns the orders this account placed that are still in the book.
        Balances + notes are intentionally NOT returned — the TEE has no
        spending key, so clients derive those themselves from `/tree/*` + their
        own keys.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Open-orders snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401':
          description: Missing / invalid / expired / revoked bearer token, or a
            token invalidated by the operator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /account/settings:
    get:
      tags: [account]
      summary: Read the caller's account settings.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettings' }
        '401':
          description: Missing / invalid / expired / revoked bearer token, or a
            token invalidated by the operator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [account]
      summary: Replace the caller's account settings.
      description: |
        Replaces the settings wholesale (omitted fields default), then persists.
        Used e.g. to set the cancel-on-disconnect default for all future
        `/v1/stream` sessions.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountSettings' }
      responses:
        '200':
          description: The updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettings' }
        '401':
          description: Missing / invalid / expired / revoked bearer token, or a
            token invalidated by the operator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───── tree ────────────────────────────────────────────────────────────────

  /tree/root:
    get:
      tags: [tree]
      summary: |
        Current Merkle root + leaf count.
      description: |
        Convenience read served by the TEE's in-memory Merkle mirror.
        Eventually-consistent with the on-chain
        MerkleTree[tree_id].current_root and may lag briefly after a confirmed
        append.

        Under tree-sharding the on-chain tree is split into `num_trees`
        per-shard `MerkleTree` accounts; pass `?tree_id` to select a
        shard (default 0). The response echoes the `tree_id` it served.

        For correctness-sensitive reads, fetch the selected MerkleTree account
        from Solana and independently verify the returned root.
      parameters:
        - name: tree_id
          in: query
          required: false
          schema: { type: integer, default: 0 }
          description: Which Merkle shard to read (0..num_trees-1). Default 0.
      responses:
        '200':
          description: Tree root snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeRoot' }

  /tree/inclusion:
    get:
      tags: [tree]
      summary: |
        Inclusion proof for a specific note commitment.
      description: |
        Replacement for `MerkleShadow.witness()`. Clients build
        VALID_SPEND / VALID_INPUT proofs against the returned
        siblings.

        The TEE-served inclusion proof is verifiable: re-hash the
        leaf + siblings up to the returned merkle_root, compare
        against the on-chain MerkleTree[tree_id].current_root, accept
        the proof only if both match. The TEE cannot lie about an
        inclusion proof without the client detecting it on Solana — so
        this is a fast convenience read, not a trust assertion.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: commitment
          in: query
          required: true
          schema: { type: string }
          description: 32-byte hex note commitment.
        - name: tree_id
          in: query
          required: false
          schema: { type: integer, default: 0 }
          description: Which Merkle shard the commitment lives in. Default 0.
      responses:
        '200':
          description: Inclusion proof.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InclusionProof' }
        '404':
          description: Commitment not in the tree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing / invalid / expired / revoked bearer token, or a
            token invalidated by the operator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tree/leaves:
    get:
      tags: [tree]
      summary: |
        Page through leaves. Used by clients catching up cold or
        re-syncing after a long disconnect.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer }
        - name: to
          in: query
          required: true
          schema: { type: integer }
        - name: tree_id
          in: query
          required: false
          schema: { type: integer, default: 0 }
          description: Which Merkle shard to page (0..num_trees-1). Default 0.
      responses:
        '200':
          description: Leaves in [from, to) on the selected shard.
          content:
            application/json:
              schema:
                type: object
                required: [leaves, merkle_root]
                properties:
                  leaves:
                    type: array
                    items:
                      type: object
                      required: [leaf_index, value]
                      properties:
                        leaf_index: { type: integer }
                        value: { type: string }
                  merkle_root: { type: string }
        '401':
          description: Missing / invalid / expired / revoked bearer token, or a
            token invalidated by the operator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───── system ──────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [system]
      summary: Process liveness and uptime.
      responses:
        '200':
          description: The API process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime_ms, version]
                properties:
                  status: { type: string, enum: [ok] }
                  uptime_ms: { type: integer, format: uint64 }
                  version: { type: string }

  /system/status:
    get:
      tags: [system]
      summary: |
        Liveness / degraded-mode snapshot. Public, unauthenticated.
      description: |
        Reports whether the matching tick and the on-chain settle
        pipeline are wired, whether an oracle cache is attached, and the
        TEE's current Solana slot. `degraded` is `true` whenever the
        matcher or the settle pipeline is down, including a fail-closed pause
        caused by unavailable or changed finalized governance, so clients can
        back off before they hit a write failure. On a multi-market venue,
        governed-market drift pauses new trading across every book. Cancels,
        reads, and pending-settlement reconciliation continue.
      responses:
        '200':
          description: Engine status snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [degraded, matcher_running, settle_enabled, oracle_configured, current_slot, version]
                properties:
                  degraded:
                    type: boolean
                    description: true when matching, governance readiness, OR settle is down.
                  matcher_running: { type: boolean }
                  settle_enabled:
                    type: boolean
                    description: The on-chain settle pipeline is wired.
                  oracle_configured:
                    type: boolean
                    description: An oracle cache (clearing-price reference) is attached.
                  current_slot: { type: integer, format: uint64 }
                  version: { type: string }

  /time:
    get:
      tags: [system]
      summary: |
        Server time — current Solana slot + unix ms. Public.
      description: |
        The TEE's current slot and wall-clock time. Clients use this to
        convert a wall-clock GTT (good-till-time) expiry into an
        `expiry_slot` without running their own RPC.
      responses:
        '200':
          description: Server time snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [slot, unix_ms]
                properties:
                  slot: { type: integer, format: uint64 }
                  unix_ms: { type: integer, format: uint64, description: Server unix time, milliseconds. }

  # ───── transparency ────────────────────────────────────────────────────────

  /transparency:
    get:
      tags: [transparency]
      summary: |
        Public solvency snapshot + engine identity + aggregate stats.
        Unauthenticated.
      responses:
        '200':
          description: Transparency snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransparencySnapshot' }

  # ───── settlement ──────────────────────────────────────────────────────────

  /settlement/status/{batch_id}:
    get:
      tags: [settlement]
      summary: |
        Per-match settlement outcomes and on-chain signatures for one
        engine batch ID.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: batch_id
          in: path
          required: true
          schema: { type: integer, format: uint64 }
      responses:
        '200':
          description: Settlement status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementStatus' }
        '404':
          description: Unknown batch ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing / invalid / expired / revoked bearer token, or a
            token invalidated by the operator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/metrics/settlement:
    get:
      tags: [admin, settlement]
      summary: Read bounded settlement throughput and latency telemetry.
      description: |
        Admin-only. The live account registry is checked on every request, so
        admin demotion takes effect without waiting for the bearer token to
        expire. Use `after_seq` for incremental collection.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: after_seq
          in: query
          schema: { type: integer, format: uint64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: Settlement metrics snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementMetrics' }
        '401':
          description: Missing / invalid / expired / revoked bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Authenticated account is not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The settle scheduler is not wired on this instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ─────────────────────────────────────────────────────────────────────────────
# WebSocket (described inline because OpenAPI 3.1 has no first-class
# WS surface — AsyncAPI would be cleaner; here we document the wire
# protocol as a series of message schemas)
# ─────────────────────────────────────────────────────────────────────────────

x-websocket:

  url: /v1/stream
  description: |
    The sole WebSocket surface: one socket per session for
    order operations plus the `orders`, `fills`, and `tree` channels.
    Authenticate IN-BAND with `op: login` carrying a bearer token from
    POST /auth/token, then subscribe to channels. Bearer tokens never appear
    in the URL. The order.place/cancel/modify ops dispatch to the same intake
    core as the REST path. One session can trade every market returned by
    `/instruments`; each signed symbol routes to one isolated book.

    Served channels are `orders`, `fills` (per-account), and `tree` (global
    leaf-appends). Account snapshots and settlement status remain REST reads.

    TLS terminates at the dstack gateway — itself an attested confidential VM —
    which reaches this service over a mutually attested tunnel. Verify
    `/attestation` before sending private order intent.

    Two limits on what that verification proves today: it covers THIS service's
    image measurement and not the gateway's, and it does not authenticate the
    TLS session it was fetched over — nothing binds the quote to the connection's
    certificate. Binding them requires terminating TLS inside this service with
    an attestation-bound certificate, which is tracked and gated ahead of
    external users (T-03), and has not shipped.

    Heartbeat: client sends `op: ping` every ≤30s; server
    responds with `op: pong`. Server drops sessions silent for >60s.

    CONNECTION BOUNDS: the socket upgrades before you authenticate, so three
    limits apply.

      * **Unauthenticated window.** A socket that has not completed `login`
        within 10 seconds of connecting is closed with code 1008. This window is
        ABSOLUTE — pings and other frames do not extend it. Send `op: login`
        first, then heartbeat.
      * **Venue capacity.** When the service is at its concurrent-socket limit
        the upgrade is refused with HTTP **503** and a `Retry-After` header,
        before the WebSocket handshake completes. Retry with backoff.
      * **Per-account concurrency.** A `login` that would exceed the account's
        concurrent-stream limit is refused with error code **4290**; the socket
        stays open but unauthenticated (and so is subject to the window above).
        Close an existing stream and retry. Re-issuing `login` on an
        already-authenticated socket to refresh a token does NOT consume an
        additional slot.

  client_ops:

    login:
      description: |
        Authenticate the socket using a bearer token. Required
        before any other op (except ping). Server emits
        `auth_expired` ~60s before token expiry as a reminder.
      message:
        type: object
        required: [op, token]
        properties:
          op: { type: string, enum: [login] }
          request_id: { type: string, description: Optional client correlation id echoed in the response. }
          token: { type: string, description: Bearer token from POST /auth/token. }
          cancel_on_disconnect:
            type: boolean
            description: |
              If true, the TEE auto-cancels still-resting orders placed through
              this socket when it disconnects.
              Recommended for market makers.

    logout:
      description: End the session cleanly. Server closes the socket.
      message:
        type: object
        required: [op]
        properties:
          op: { type: string, enum: [logout] }
          request_id: { type: string, description: Optional client correlation id echoed in the response. }

    ping:
      description: Heartbeat (client → server).
      message:
        type: object
        required: [op]
        properties:
          op: { type: string, enum: [ping] }
          request_id: { type: string, description: Optional client correlation id echoed in the response. }

    subscribe:
      description: Subscribe to one or more channels.
      message:
        type: object
        required: [op, channels]
        properties:
          op: { type: string, enum: [subscribe] }
          request_id: { type: string, description: Optional client correlation id echoed in the response. }
          channels:
            type: array
            items:
              type: string
              enum: [orders, fills, tree]

    unsubscribe:
      description: Unsubscribe from channels.
      message:
        type: object
        required: [op, channels]
        properties:
          op: { type: string, enum: [unsubscribe] }
          request_id: { type: string, description: Optional client correlation id echoed in the response. }
          channels:
            type: array
            items: { type: string }

    order.place:
      description: |
        Place an order over WS (same shape as POST /orders, just
        encapsulated in the multiplexed socket). Server responds
        with the accepted order id and arrival slot; subsequent state changes arrive
        on the `orders` channel.
      message:
        type: object
        required: [op, params]
        properties:
          op: { type: string, enum: [order.place] }
          request_id: { type: string, description: Optional client correlation id echoed in the response. }
          params: { $ref: '#/components/schemas/PlaceOrderRequest' }

    order.cancel:
      description: Cancel an open order with a nonce- and boot-session-bound signature.
      message:
        type: object
        required: [op, order_id, params]
        properties:
          op: { type: string, enum: [order.cancel] }
          request_id: { type: string, description: Optional client correlation id echoed in the response. }
          order_id: { type: string }
          params:
            type: object
            required: [trading_key, cancel_nonce, session_id, trading_key_signature]
            properties:
              trading_key: { type: string }
              cancel_nonce: { type: integer }
              session_id: { type: string, description: Current 32-byte /info.boot_session_id, hex. }
              trading_key_signature: { type: string }

    order.modify:
      description: |
        Atomic cancel + replace (same as PUT /orders/{order_id}): cancel the
        OLD order and rest a fully-signed replacement under one matcher lock.
        The replacement must remain in the original market.
      message:
        type: object
        required: [op, order_id, params]
        properties:
          op: { type: string, enum: [order.modify] }
          request_id: { type: string, description: Optional client correlation id echoed in the response. }
          order_id: { type: string, description: The OLD order id (hex) to replace. }
          params:
            type: object
            required: [cancel_signature, cancel_nonce, replacement]
            properties:
              cancel_signature: { type: string }
              cancel_nonce: { type: integer }
              replacement: { $ref: '#/components/schemas/PlaceOrderRequest' }

  server_channels:

    orders:
      description: |
        Incremental updates for the user's own orders. A matched order first emits
        `pending_settlement` without changing quantities. Its own confirmed Tx D
        then emits `partially_filled` or `fully_filled`; a definitive failure
        emits terminal `settlement_failed` with `reason` and
        `lock_expiry_slot`. Every event carries the `MarketConfig` PDA and server
        emission time; settlement events also carry a decimal-string match id.
        Failed orders are never auto-rebooked.
      message: { $ref: '#/components/schemas/OrderLifecycleUpdate' }

    fills:
      description: |
        Per-fill change-output events. Each event carries `seq`, `order_id`,
        `consumed_note_commitment`, `output_role`, `change_amount`,
        `change_note_commitment`, `mint`, and `inner_hash`. Clients must resolve
        the consumed opening locally, derive
        `Poseidon3(24, input_inner, output_role)`, and recompute the output
        commitment before accepting it. A sequence gap triggers chain recovery.

    tree:
      description: |
        Leaf-append events (for clients that want to keep an
        incremental view of the tree, e.g. dapps showing live
        portfolio state).
