# Site-wide Git Sync: one repository, two GitBook spaces, each published as a
# TAB on the site.
#
# Each `content.directory` below is a self-contained space: it owns its
# `.gitbook.yaml`, its `README.md` and its `SUMMARY.md`. A space cannot read a
# sibling directory, which is why every link that crosses from Documentation to
# API Reference is written site-absolute (`/api-reference/...`) rather than as a
# relative `../` hop that would resolve to nothing once published.
#
# `path` is the URL segment the section is served under. Changing it silently
# breaks every cross-space link; grep for `](/api-reference/` and
# `](/documentation/` before touching it.
site:
  structure:
    - type: space
      key: documentation
      title: Documentation
      path: documentation
      content:
        directory: ./documentation
    - type: space
      key: api-reference
      title: API Reference
      path: api-reference
      content:
        directory: ./api-reference
