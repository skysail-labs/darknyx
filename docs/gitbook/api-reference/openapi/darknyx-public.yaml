x-websocket:
  url: /v1/stream
  description: "The sole WebSocket surface: one socket per session for\norder operations plus the `orders`,\
    \ `fills`, and `tree` channels.\nAuthenticate IN-BAND with `op: login` carrying a bearer token from\n\
    POST /auth/token, then subscribe to channels. Bearer tokens never appear\nin the URL. The order.place/cancel/modify\
    \ ops dispatch to the same intake\ncore as the REST path. One session can trade every market returned\
    \ by\n`/instruments`; each signed symbol routes to one isolated book.\n\nServed channels are `orders`,\
    \ `fills` (per-account), and `tree` (global\nleaf-appends). Account snapshots and settlement status\
    \ remain REST reads.\n\nThe UPGRADE request is on the public router, so it shares the venue-wide\n\
    public allowance and can be refused with `429` + `Retry-After` before the\nsocket is established (see\
    \ `components.responses.PublicRateLimited`). Once\nupgraded, the session is bounded by the per-account\
    \ limits and the\nconnection caps instead.\n\nOn the programmatic route, TLS terminates inside this\
    \ service with a\nboot-random, memory-only key; the deployment gateway passes the encrypted\nstream\
    \ through. Before login, verify the certificate on the WebSocket\nupgrade connection against `/transport-attestation`,\
    \ including the measured\ncompose hash, boot session and finalized signer-set pin. A quote fetched\
    \ on\nan unrelated probe connection does not authenticate this socket.\n\nHeartbeat: client sends\
    \ `op: ping` every ≤30s; server\nresponds with `op: pong`. Server drops sessions silent for >60s.\n\
    \nCONNECTION BOUNDS: the socket upgrades before you authenticate, so three\nlimits apply.\n\n  * **Unauthenticated\
    \ window.** A socket that has not completed `login`\n    within 10 seconds of connecting is closed\
    \ with code 1008. This window is\n    ABSOLUTE — pings and other frames do not extend it. Send `op:\
    \ login`\n    first, then heartbeat.\n  * **Venue capacity.** When the service is at its concurrent-socket\
    \ limit\n    the upgrade is refused with HTTP **503** and a `Retry-After` header,\n    before the\
    \ WebSocket handshake completes. Retry with backoff.\n  * **Per-account concurrency.** A `login` that\
    \ would exceed the account's\n    concurrent-stream limit is refused with error code **4290**; the\
    \ socket\n    stays open but unauthenticated (and so is subject to the window above).\n    Close an\
    \ existing stream and retry. Re-issuing `login` on an\n    already-authenticated socket to refresh\
    \ a token does NOT consume an\n    additional slot. A refresh cannot change account identity; that\
    \ attempt\n    returns stream error **4030** and requires a new connection.\n"
  client_ops:
    login:
      description: 'Authenticate the socket using a bearer token. Required

        before any other op (except ping). Server emits

        `auth_expired` ~60s before token expiry as a reminder.

        '
      message:
        type: object
        required:
        - op
        - token
        properties:
          op:
            type: string
            enum:
            - login
          request_id:
            type: string
            description: Optional client correlation id echoed in the response.
          token:
            type: string
            description: Bearer token from POST /auth/token.
          cancel_on_disconnect:
            type: boolean
            description: 'If true, the TEE auto-cancels still-resting orders placed through

              this socket when it disconnects.

              Recommended for market makers.

              '
    logout:
      description: End the session cleanly. Server closes the socket.
      message:
        type: object
        required:
        - op
        properties:
          op:
            type: string
            enum:
            - logout
          request_id:
            type: string
            description: Optional client correlation id echoed in the response.
    ping:
      description: Heartbeat (client → server).
      message:
        type: object
        required:
        - op
        properties:
          op:
            type: string
            enum:
            - ping
          request_id:
            type: string
            description: Optional client correlation id echoed in the response.
    subscribe:
      description: Subscribe to one or more channels.
      message:
        type: object
        required:
        - op
        - channels
        properties:
          op:
            type: string
            enum:
            - subscribe
          request_id:
            type: string
            description: Optional client correlation id echoed in the response.
          channels:
            type: array
            items:
              type: string
              enum:
              - orders
              - fills
              - tree
    unsubscribe:
      description: Unsubscribe from channels.
      message:
        type: object
        required:
        - op
        - channels
        properties:
          op:
            type: string
            enum:
            - unsubscribe
          request_id:
            type: string
            description: Optional client correlation id echoed in the response.
          channels:
            type: array
            items:
              type: string
    order.place:
      description: 'Place an order over WS (same shape as POST /orders, just

        encapsulated in the multiplexed socket). Server responds

        with the accepted order id and arrival slot; subsequent state changes arrive

        on the `orders` channel.

        '
      message:
        type: object
        required:
        - op
        - params
        properties:
          op:
            type: string
            enum:
            - order.place
          request_id:
            type: string
            description: Optional client correlation id echoed in the response.
          params:
            $ref: '#/components/schemas/PlaceOrderRequest'
    order.cancel:
      description: Cancel an open order with a nonce- and boot-session-bound signature.
      message:
        type: object
        required:
        - op
        - order_id
        - params
        properties:
          op:
            type: string
            enum:
            - order.cancel
          request_id:
            type: string
            description: Optional client correlation id echoed in the response.
          order_id:
            type: string
          params:
            type: object
            required:
            - trading_key
            - cancel_nonce
            - session_id
            - trading_key_signature
            properties:
              trading_key:
                type: string
              cancel_nonce:
                type: string
                pattern: ^(0|[1-9][0-9]*)$
              session_id:
                type: string
                description: 'Current 32-byte /info.boot_session_id, hex. Programmatic

                  clients verify the same boot session in the quote-bound

                  transport manifest; substitution causes intake rejection.

                  '
              trading_key_signature:
                type: string
    order.modify:
      description: 'Atomic cancel + replace (same as PUT /orders/{order_id}): cancel the

        OLD order and rest a fully-signed replacement under one matcher lock.

        The replacement must remain in the original market.

        '
      message:
        type: object
        required:
        - op
        - order_id
        - params
        properties:
          op:
            type: string
            enum:
            - order.modify
          request_id:
            type: string
            description: Optional client correlation id echoed in the response.
          order_id:
            type: string
            description: The OLD order id (hex) to replace.
          params:
            type: object
            required:
            - cancel_signature
            - cancel_nonce
            - replacement
            properties:
              cancel_signature:
                type: string
              cancel_nonce:
                type: string
                pattern: ^(0|[1-9][0-9]*)$
              replacement:
                $ref: '#/components/schemas/PlaceOrderRequest'
  server_channels:
    orders:
      description: 'Incremental updates for the user''s own orders. A matched order first emits

        `pending_settlement` without changing quantities. Its own confirmed Tx D

        then emits `partially_filled` or `fully_filled`; a definitive failure

        emits terminal `settlement_failed` with `reason` and

        `lock_expiry_slot`. Every event carries the `MarketConfig` PDA and server

        emission time; settlement events also carry a decimal-string match id.

        Failed orders are never auto-rebooked.

        '
      message:
        $ref: '#/components/schemas/OrderLifecycleUpdate'
    fills:
      description: 'Per-fill change-output events. Each event carries `seq`, `order_id`,

        `consumed_note_commitment`, `output_role`, `change_amount`,

        `change_note_commitment`, `mint`, and `inner_hash`. Clients must resolve

        the consumed opening locally, derive

        `Poseidon3(24, input_inner, output_role)`, and recompute the output

        commitment before accepting it. The input commitment is disclosed only

        to this authenticated per-account recovery stream; the public v11

        settlement consumes an unlinkable note-use tag and does not publish the

        input commitment. A sequence gap triggers chain recovery.

        '
    tree:
      description: 'Leaf-append events (for clients that want to keep an

        incremental view of the tree, e.g. dapps showing live

        portfolio state).

        '
