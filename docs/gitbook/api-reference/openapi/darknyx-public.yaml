    Account:
      type: object
      description: '`GET /account` response. Returns ONLY the caller''s open orders — the

        slice of account state the TEE legitimately holds (it tracks the

        order_id→account map at intake). Balances and notes are intentionally

        absent: linking an account to its notes needs the spending key, which

        the TEE never sees. Clients derive balances + spendable notes themselves

        from `/tree/*` + their own keys.

        '
      required:
      - account_id
      - open_orders
      properties:
        account_id:
          type: string
        open_orders:
          type: array
          description: The caller's orders still resting across all market books.
          items:
            $ref: '#/components/schemas/Order'
    AccountSettings:
      type: object
      description: 'Per-account preferences (`GET`/`PUT /account/settings`), persisted with

        the account. Omitted fields default on `PUT`.

        '
      properties:
        cancel_on_disconnect_default:
          type: boolean
          description: 'Account-wide default for `/v1/stream` cancel-on-disconnect. A

            login frame''s explicit `cancel_on_disconnect` value overrides it.

            '
          default: false
    TreeRoot:
      type: object
      required:
      - tree_id
      - merkle_root
      - leaf_count
      - on_chain_slot
      properties:
        tree_id:
          type: integer
          default: 0
          description: 'Which Merkle shard this root is for (echoes the request''s

            `?tree_id`, default 0). Present under tree-sharding.

            '
        merkle_root:
          type: string
          description: 'Current Merkle root of shard `tree_id`, hex-encoded. It should

            equal finalized on-chain `MerkleTree[tree_id].current_root`.

            Historical roots accepted through the on-chain 64-entry history

            are not returned by this endpoint.

            '
        leaf_count:
          type: integer
          description: Leaf count of this shard.
        on_chain_slot:
          type: integer
          description: 'Solana slot at which the TEE last synced this shard''s mirror

            from on-chain `MerkleTree[tree_id]`.

            '
    InclusionProof:
      type: object
      required:
      - note_commitment
      - leaf_index
      - merkle_root
      - siblings
      properties:
        note_commitment:
          type: string
        leaf_index:
          type: integer
        merkle_root:
          type: string
        siblings:
          type: array
          minItems: 20
          maxItems: 20
          items:
            type: string
            description: 32-byte hex.
    TransparencySnapshot:
      type: object
      required:
      - reserves
      - tee
      - stats
      description: 'Public, unauthenticated convenience snapshot. Independently read the

        corresponding Solana accounts and verify `/attestation` before treating

        the reserve or engine-identity fields as trusted evidence.

        '
      properties:
        reserves:
          type: object
          required:
          - shards
          - shard0_merkle_root
          - total_leaf_count
          - per_mint
          properties:
            shards:
              type: array
              description: 'Per-shard root + leaf count. There is no single global root —

                each shard has its own — so this is the only lossless form.


                This replaces a bare `merkle_root` (shard 0''s) that sat beside a

                `leaf_count` (the all-shard SUM). Both were documented, but as

                adjacent fields they read as a matched pair, and folding the

                count against that root yields a root the tree never had

                (SW-06).

                '
              items:
                type: object
                required:
                - tree_id
                - merkle_root
                - leaf_count
                properties:
                  tree_id:
                    type: integer
                  merkle_root:
                    type: string
                  leaf_count:
                    type: integer
            shard0_merkle_root:
              type: string
              description: 'Shard 0''s root, kept for pre-sharding consumers. Prefer

                `shards`.

                '
            total_leaf_count:
              type: integer
              description: 'Total leaves SUMMED across all `num_trees` shards — NOT the leaf

                count under `shard0_merkle_root`.

                '
            per_mint:
              type: array
              items:
                type: object
                required:
                - mint
                - outstanding
                - vault_balance
                - stale
                properties:
                  mint:
                    type: string
                  outstanding:
                    type: string
                    description: 'Sum of unspent note amounts for this mint, in the mint''s

                      smallest integer units.

                      '
                  vault_balance:
                    type: string
                    description: 'SPL balance in the vault token account, in the mint''s

                      smallest integer units. Solvency requires this to be at

                      least `outstanding`.

                      '
                  stale:
                    type: boolean
                    description: 'true if either on-chain read was DEGRADED (RPC

                      error or malformed account); outstanding /

                      vault_balance are then "unknown", not a real 0 —

                      ignore the numbers for a solvency check.

                      '
        tee:
          type: object
          description: 'Engine attestation IDENTITY — enough to tie this response to

            a measured image. The full challenge-response quote is at

            GET /attestation.

            '
          required:
          - app_id
          - compose_hash
          - mrtd
          - signer_pubkey
          properties:
            app_id:
              type: string
            compose_hash:
              type: string
            mrtd:
              type: string
            signer_pubkey:
              type: string
              description: Shard-0 Ed25519 signer (base58); verify the full set via `/info` and `/attestation`.
        stats:
          type: object
          description: Aggregate settlement-scheduler counters.
          required:
          - batches
          - jobs
          properties:
            batches:
              type: integer
              description: Settle batches currently retained by the scheduler. Terminal history is capped;
                active batches are never evicted. Not a lifetime counter.
            jobs:
              type: integer
              description: Per-match settle jobs belonging to retained batches; not a lifetime counter.
    SettlementStatus:
      type: object
      required:
      - batch_id
      - jobs
      properties:
        batch_id:
          type: integer
          format: uint64
        jobs:
          type: array
          description: 'Per-match status in match-index order. Confirmed siblings can reach

            `done` while an ambiguous sibling remains `settling` and redrives.

            '
          items:
            type: object
            required:
            - batch_id
            - match_idx
            - stage
            - outcome
            - created_at_ms
            - last_transition_at_ms
            properties:
              batch_id:
                type: integer
                format: uint64
              match_idx:
                type: integer
                format: uint8
              stage:
                type: string
                enum:
                - queued
                - locking_notes
                - proving
                - verifying
                - settling
                - closing
                - done
                - failed
              outcome:
                type: object
                required:
                - kind
                description: '`ambiguous` is non-terminal and remains reserved while the TEE

                  reconciles both consumed-note PDAs and redrives within the

                  marker/lock window. `rejected` is terminal.

                  '
                properties:
                  kind:
                    type: string
                    enum:
                    - pending
                    - confirmed
                    - rejected
                    - ambiguous
                  signature:
                    type: string
                  slot:
                    type: integer
                    format: uint64
                  reconciled_from_consumed_pdas:
                    type: boolean
                  reason:
                    type: string
                    enum:
                    - settlement_rejected
                    - reconciliation_pending
                    description: 'A closed-set label, not free-form text. Present only on

                      `rejected` / `ambiguous`. The detailed diagnostic stays

                      inside the enclave: this endpoint is readable by any

                      authenticated account, and internal error text is built by

                      interpolating errors that reach in from the RPC client

                      (SW-01).

                      '
              failed_reason:
                type: string
                enum:
                - rpc_unavailable
                - prover_failed
                - leaf_resolution_failed
                - alt_not_active
                - settlement_rejected
                - internal_error
                description: 'Present only when `stage` is `failed`. A closed-set label

                  identifying the CLASS of failure, never the internal message.

                  Which pipeline step failed is implied by the signature fields

                  populated so far. Labels are append-only — a new failure class

                  adds a value, existing ones are never renamed.

                  '
              created_at_ms:
                type: integer
                format: uint64
              last_transition_at_ms:
                type: integer
                format: uint64
              lock_buyer_sig:
                type: string
              lock_seller_sig:
                type: string
              verify_sig:
                type: string
              settle_sig:
                type: string
              close_sig:
                type: string
                description: Normally absent because marker close is asynchronous.
    OrderLifecycleUpdate:
      type: object
      required:
      - order_id
      - market_id
      - server_time_ms
      - kind
      description: 'One account-scoped event on the `/v1/stream` `orders` channel.

        `market_id` is the base58 `MarketConfig` PDA. Settlement-related

        transitions carry `match_id` as a decimal string so JavaScript clients

        do not lose u64 precision.

        '
      properties:
        order_id:
          type: string
          description: 16-byte order id, hex.
        market_id:
          type: string
          description: Base58 MarketConfig PDA.
        match_id:
          type: string
          pattern: ^[0-9]+$
          description: Present for pending, confirmed-fill, and settlement-failure transitions.
        server_time_ms:
          type: integer
          format: uint64
        kind:
          type: string
          enum:
          - pending_settlement
          - partially_filled
          - fully_filled
          - settlement_failed
          - cancelled
          - expired
        filled_quantity:
          type: integer
          format: uint64
        new_amount:
          type: integer
          format: uint64
        new_note_amount:
          type: integer
          format: uint64
        reason:
          type: string
        lock_expiry_slot:
          type: integer
          format: uint64
paths:
  /auth/token:
    post:
      tags:
      - auth
      summary: Exchange long-lived credentials for a short-lived bearer token.
      description: 'OAuth2 client_credentials grant. Issue rate is rate-limited per

        api_key: an account that exhausts its own allowance is throttled

        without affecting any other account, and an unrecognised api_key is

        rejected before any credential hashing, so it consumes no allowance at

        all.


        Credential verification is deliberately expensive, so the service

        bounds how much of it runs at once and REFUSES excess requests (503)

        rather than queueing them. A 429 message includes an approximate retry

        delay; use a short jittered retry for 503.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Bad credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account exists but is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'This account''s authentication allowance is exhausted. The message

            includes an approximate retry delay.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'Credential verification is at capacity. Shed rather than queued, so

            this clears quickly; use a short jittered retry.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-hideTryItPanel: true
  /auth/token/revoke:
    post:
      tags:
      - auth
      summary: Revoke an issued bearer token.
      description: 'Revokes the calling bearer token. Subsequent requests presenting the

        same token are rejected with 401, including after an engine restart.

        '
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Revoked.
        '401':
          description: Token already invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-hideTryItPanel: true
  /attestation:
    get:
      tags:
      - attestation
      summary: Fresh TEE attestation quote (challenge-response).
      description: "Unauthenticated. Clients MUST verify this quote before sending private\norder intent.\n\
        \nThe caller supplies a fresh nonce via reportData; the TEE\ngenerates a quote with reportData\
        \ populated as:\n    report_data[0..32]  = caller's nonce\n    report_data[32..64] = SHA-256(pk_0\
        \ || ... || pk_{K-1})\n\nVerification steps:\n  1. Verify the Intel TCB certificate chain and\
        \ quote locally.\n  2. Reject structurally impossible event entries; require exactly one\n   \
        \  runtime-typed compose-hash event; replay the log to confirm RTMR3.\n  3. Confirm the measured\
        \ compose hash is an independently approved release.\n  4. Confirm the measured signer derivation\
        \ context.\n  5. Confirm reportData starts with the supplied nonce\n     and ends with the hash\
        \ of the complete ordered signer set.\n  6. Compare every signer with finalized on-chain VaultConfig.\n\
        \nThe SDK's verifyTeeAttestation() helper performs steps 1-5 and returns\nthe quote-bound signer\
        \ set. The caller performs step 6; the reference\ndaemon performs both halves and refreshes the\
        \ on-chain comparison.\n"
      parameters:
      - name: reportData
        in: query
        required: false
        schema:
          type: string
        description: '32-byte nonce in hex. If omitted, the TEE generates a

          quote with all-zero reportData[0..32]. Always supply a

          fresh nonce for live verification (replay protection).

          '
      responses:
        '429':
          $ref: '#/components/responses/PublicRateLimited'
        '200':
          description: Current quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationQuote'
      x-hideTryItPanel: true
  /transport-attestation:
    get:
      tags:
      - attestation
      summary: Quote binding the served TLS certificate to this enclave.
      description: "Unauthenticated, and necessarily so: a client must verify the transport\nBEFORE it\
        \ sends any credential or order intent.\n\n`/attestation` proves an enclave with a given signer\
        \ set is alive. It\ndoes NOT prove the TLS connection carrying your orders terminates\nthere —\
        \ a party able to terminate TLS can relay a genuine\n`/attestation` response while routing traffic\
        \ elsewhere. This endpoint\ncloses that by binding the served certificate's public key into the\n\
        attested value:\n\n    report_data[0..32]  = caller's nonce (EXACTLY 32 bytes)\n    report_data[32..64]\
        \ = SHA-256(DOMAIN || canonical_manifest_bytes)\n\n`/attestation` is unchanged and remains valid;\
        \ the two coexist because\ndstack `get_quote` accepts caller-selected report_data on every call.\n\
        \nVerification steps:\n  1. Verify the Intel TCB chain and quote locally, and replay the event\n\
        \     log to confirm RTMR3 and recover the measured compose hash. The\n     compose hash is deliberately\
        \ NOT a manifest field — in the event\n     log it is verifiable, in the manifest it would be\
        \ self-reported.\n  2. Rebuild canonical_manifest_bytes from the returned manifest and\n     confirm\
        \ report_data[32..64] matches. The manifest fields are\n     claims until you recompute them.\n\
        \  3. Confirm report_data[0..32] is your nonce.\n  4. **Compare manifest.tls_spki_sha256 against\
        \ the certificate on the\n     socket you are actually using.** A separate probe connection does\n\
        \     not establish anything — DNS, load balancing, or a relay can make\n     the probe and the\
        \ request reach different peers.\n  5. Confirm manifest.signer_set_sha256 matches finalized on-chain\n\
        \     VaultConfig, and manifest.boot_session_id matches `/info`.\n\nStep 4 is the entire point\
        \ of the endpoint. A client that verifies the\nquote but not the socket certificate has gained\
        \ nothing over\n`/attestation`.\n\nEvery manifest field is taken from server state. The nonce\
        \ is the only\ncaller input, and it only ever lands in the left half of report_data.\n"
      parameters:
      - name: nonce
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        description: 'Fresh 32-byte nonce in hex (64 characters). Required, and rejected

          with 400 if absent, non-hex, or any length other than 32 bytes.

          Unlike `/attestation`, a short nonce is NOT zero-padded: silently

          padding would let a caller believe it has replay protection it does

          not have.

          '
      responses:
        '400':
          description: Nonce missing, non-hex, or not exactly 32 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/PublicRateLimited'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'RA-TLS transport is not enabled on this instance (legacy

            gateway-terminated deployment), or the dstack socket is

            unreachable. The endpoint reports unavailability rather than

            returning a manifest bound to no served certificate.

            '
        '200':
          description: Transport attestation bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportAttestation'
      x-hideTryItPanel: true
  /info:
    get:
      tags:
      - info
      summary: Application + instance metadata.
      description: 'Returns application and instance metadata, the current boot-session

        identifier, and the complete ordered settlement-signer set. The

        compose hash here is a convenience value; security-sensitive clients

        verify the measured event log returned by attestation. The boot session

        is replay-scoping data validated by intake and must equal the value

        bound by the `/transport-attestation` manifest.

        '
      responses:
        '429':
          $ref: '#/components/responses/PublicRateLimited'
        '200':
          description: Application info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfo'
      x-hideTryItPanel: true
  /evidences/quote.json:
    get:
      tags:
      - attestation
      summary: (Served by dstack-ingress, not darknyx-tee) TDX quote bundle.
      description: 'Evidence for the surrounding gateway deployment, not the Darknyx

        engine quote from `/attestation` or the boot-certificate binding from

        `/transport-attestation`. It is not the programmatic session''s trust

        root because that route passes the engine''s TLS through.

        '
      responses:
        '200':
          description: Quote JSON bundle (raw).
          content:
            application/json: {}
      x-hideTryItPanel: true
  /evidences/cert.pem:
    get:
      tags:
      - attestation
      summary: (Served by dstack-ingress) Current TLS certificate.
      description: 'A gateway evidence certificate. It is not the boot-random certificate

        served by `darknyx-tee` on the programmatic RA-TLS route.

        '
      responses:
        '200':
          description: PEM-encoded cert.
          content:
            application/x-pem-file: {}
      x-hideTryItPanel: true
  /evidences/acme-account.json:
    get:
      tags:
      - attestation
      summary: (Served by dstack-ingress) Let's Encrypt account URI.
      description: 'Gateway ACME-account metadata. Its presence is not a substitute for

        verifying the engine''s boot-random certificate and transport quote.

        '
      responses:
        '200':
          description: ACME account JSON.
          content:
            application/json: {}
      x-hideTryItPanel: true
  /evidences/sha256sum.txt:
    get:
      tags:
      - attestation
      summary: (Served by dstack-ingress) Hash of cert.pem + acme-account.json.
      description: 'Integrity metadata for the gateway evidence bundle. It does not bind

        the Darknyx engine''s boot certificate to the client''s session.

        '
      responses:
        '200':
          description: Plain-text hash.
          content:
            text/plain: {}
      x-hideTryItPanel: true
  /instruments:
    get:
      tags:
      - instruments
      summary: List all tradable instruments.
      description: 'Returns every independently routed market served by this one attested

        venue. The array may contain multiple pairs. REST and `/v1/stream` use

        separate sockets while sharing the same verified enclave origin, boot

        identity, and bearer session.

        '
      responses:
        '429':
          $ref: '#/components/responses/PublicRateLimited'
        '200':
          description: All markets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instrument'
      x-hideTryItPanel: true
  /instruments/{symbol}:
    get:
      tags:
      - instruments
      summary: Single instrument detail.
      description: 'Returns one configured market. Use its canonical symbol unchanged in

        signed order requests.

        '
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
      responses:
        '429':
          $ref: '#/components/responses/PublicRateLimited'
        '200':
          description: Instrument detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '404':
          description: Unknown symbol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-hideTryItPanel: true
  /orders:
    post:
      tags:
      - orders
      summary: Place a new order.
      description: 'Routes the signed symbol to one market book, checks the note opening,

        recent proof root, and VALID_INPUT proof before booking on a

        settlement-enabled venue, then reserves the collateral commitment

        inside this venue.

        '
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '202':
          description: Order accepted into the matching queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOrderResponse'
        '400':
          description: 'Validation error, including malformed fields, off-tick price,

            opening mismatch, stale proof root (1010), invalid VALID_INPUT

            proof (1011), or an expired/settlement-unsafe expiry (1012).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / invalid / expired / revoked bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account suspended or trading-key signature invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict — the referenced note_commitment is already

            reserved by another live or settlement-pending order, the order id

            is in use, or a replay/session nonce is stale.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Per-account order-operation limit exceeded. Includes Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: New trading is paused because a required subsystem or finalized governance view
            is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-hideTryItPanel: true
  /orders/{order_id}:
    get:
      tags:
      - orders
      summary: Current status of a live order.
      security:
      - BearerAuth: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Order detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: 'Unknown order or an order owned by another account. Both cases use

            the same response so this endpoint is not an order-existence oracle.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / invalid / expired / revoked bearer token, or a token invalidated by the
            operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-hideTryItPanel: true
    delete:
      tags:
      - orders
      summary: Cancel an open order.
      security:
      - BearerAuth: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Cancellation processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '400':
          description: Malformed id, key, session, or signature encoding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / invalid / expired / revoked bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account suspended, signature invalid, or trading key does not own the order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order doesn't exist or is already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The cancel nonce did not advance or the boot session is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-hideTryItPanel: true
    put:
      tags:
      - orders
      summary: 'Modify an open order — atomic cancel + replace.

        '
      description: '"The same owner replaces their resting order with a new one." The body

        carries a signed cancel of the OLD order (over its id) plus a full new

        order (`replacement`, a normal signed order). The trading key that signs

        the cancel MUST be the one that signs the replacement. The swap is

        applied under one matcher lock with BOTH preconditions checked first

        (old order exists + owned; replacement order_id not already booked unless

        it is the same id, a reprice in place), so there is no window where the

        caller has neither order. The replacement carries its own note +

        VALID_INPUT proof (it may reuse the old note while the root is still in

        the recent-root window) — no new signed message type; it composes the

        existing cancel + order canonical bodies. The replacement must use the

        original order''s symbol: moving between isolated market books requires

        cancel + a fresh placement. Its session_id also scopes the embedded

        cancel signature to the current boot.

        '
      security:
      - BearerAuth: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
        description: The OLD order's id (hex) to replace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyOrderRequest'
      responses:
        '200':
          description: Modified — old order cancelled, replacement resting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyOrderResponse'
        '400':
          description: 'Malformed request, cross-market replacement, or replacement

            place-order validation failure.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / invalid / expired / revoked bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Account suspended, or the booked order is not owned by this

            trading_key.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The old order doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The replacement order_id is already booked, or a nonce/session is stale.
