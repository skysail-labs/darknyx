name: surfpool-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/surfpool-qualification.yml'
      - 'scripts/surfpool/**'
      - 'packages/sdk/tests/devnet-setup.test.ts'
      - 'packages/sdk/tests/devnet-deposit-withdraw.test.ts'
      - 'packages/sdk/tests/surfpool-qualification.test.ts'
      - 'crates/darknyx-tee/tests/surfpool_merkle_sync.rs'
      - 'programs/vault/**'
      - 'Cargo.lock'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SURFPOOL_RPC_URL: http://127.0.0.1:18899
  SOLANA_RPC_URL: http://127.0.0.1:18899
  DARKNYX_E2E_CONFIG_PATH: .surfpool/qualification/e2e-config.json
  ADMIN_KEYPAIR: .surfpool/qualification/keypairs/admin.json
  TEE_AUTHORITY_KEYPAIR: .surfpool/qualification/keypairs/tee_authority.json
  TEE_AUTHORITY_1_KEYPAIR: .surfpool/qualification/keypairs/tee_authority_1.json
  ROOT_KEY_KEYPAIR: .surfpool/qualification/keypairs/root_key.json
  DARKNYX_NUM_TREES: '2'
  DARKNYX_TEE_FEE_EPOCH_KEY: '0008080808080808080808080808080808080808080808080808080808080808'
  RUN_SURFPOOL_QUALIFICATION: '1'
  SOLANA_CLI_VERSION: v3.1.12

jobs:
  qualify:
    name: Linux amd64 protocol qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Surfpool Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev libclang-dev pkg-config libudev-dev
          echo 'LIBCLANG_PATH=/usr/lib/llvm-14/lib' >> "$GITHUB_ENV"

      - name: Cache Solana CLI install
        id: cache-solana
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/solana/install
          key: solana-${{ runner.os }}-${{ env.SOLANA_CLI_VERSION }}

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_CLI_VERSION}/install)"

      - name: Put Solana CLI on PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache pinned Surfpool release build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .surfpool/source/target
          key: surfpool-source-${{ runner.os }}-rust-1.95.0-${{ hashFiles('scripts/surfpool/pin.json') }}

      - name: Build checksum-pinned Surfpool revision
        run: |
          set -euo pipefail
          mkdir -p .surfpool/bin .surfpool/source
          repo=$(jq -r .repository scripts/surfpool/pin.json)
          commit=$(jq -r .commit scripts/surfpool/pin.json)
          git -C .surfpool/source init
          git -C .surfpool/source remote add origin "https://github.com/${repo}.git"
          git -C .surfpool/source fetch --depth 1 origin "$commit"
          git -C .surfpool/source checkout --detach FETCH_HEAD
          test "$(git -C .surfpool/source rev-parse HEAD)" = "$commit"
          studio_url=$(jq -r .studioUi.url scripts/surfpool/pin.json)
          studio_sha=$(jq -r .studioUi.sha256 scripts/surfpool/pin.json)
          curl --fail --silent --show-error --location "$studio_url" \
            --output .surfpool/studio-dist.zip
          echo "$studio_sha  .surfpool/studio-dist.zip" \
            | sha256sum --check --strict
          export STUDIO_UI_DIST="$GITHUB_WORKSPACE/.surfpool/studio-dist.zip"
          (
            cd .surfpool/source
            cargo +1.95.0 build --release --locked \
              --target x86_64-unknown-linux-gnu \
              --features supervisor_ui --features version_check
          )
          cp .surfpool/source/target/x86_64-unknown-linux-gnu/release/surfpool \
            .surfpool/bin/surfpool
          echo "source-built Linux SHA-256: $(sha256sum .surfpool/bin/surfpool | cut -d' ' -f1)"
          echo "upstream artifact SHA-256:  $(jq -r '.artifacts["linux-x64"].binarySha256' scripts/surfpool/pin.json)"
          file .surfpool/bin/surfpool | grep -q 'ELF 64-bit.*x86-64'
          chmod 0755 .surfpool/bin/surfpool
          version=$(.surfpool/bin/surfpool --version)
          echo "$version"
          test "$version" = "$(jq -r .reportedVersion scripts/surfpool/pin.json)"

      - name: Reuse the fingerprinted vault SBF cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: pr-checks-sbf
          key: pr-checks-sbf-${{ hashFiles('programs/**/*.rs', 'crates/**/*.rs', 'Cargo.lock') }}
          cache-on-failure: true

      - name: Build fingerprinted vault SBF
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          bash scripts/build-vault-sbf.sh devnet-admin

      - name: Start fresh offline Surfpool
        run: |
          set -euo pipefail
          nohup .surfpool/bin/surfpool start \
            --offline --no-deploy --no-tui --no-studio --db :memory: \
            --port 18899 --ws-port 18900 --studio-port 19488 \
            --airdrop-amount 0 \
            > .surfpool/surfpool.log 2>&1 &
          echo "$!" > .surfpool/surfpool.pid
          for attempt in $(seq 1 100); do
            if curl --fail --silent --show-error \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"getVersion"}' \
              "$SURFPOOL_RPC_URL" > .surfpool/version.json; then
              jq . .surfpool/version.json
              exit 0
            fi
            sleep 0.2
          done
          echo 'Surfpool did not become healthy' >&2
          tail -200 .surfpool/surfpool.log
          exit 1

      - name: Install canonical vault and exercise RPC contract
        run: |
          node scripts/surfpool/install-vault.mjs
          node scripts/surfpool/qualify-rpc.mjs

      - name: Create isolated K=2 protocol foundation
        run: |
          set -euo pipefail
          mkdir -p .surfpool/qualification/keypairs
          for name in admin tee_authority tee_authority_1 root_key; do
            solana-keygen new --no-bip39-passphrase --silent --force \
              --outfile ".surfpool/qualification/keypairs/${name}.json"
          done
          admin=$(solana-keygen pubkey "$ADMIN_KEYPAIR")
          tee0=$(solana-keygen pubkey "$TEE_AUTHORITY_KEYPAIR")
          tee1=$(solana-keygen pubkey "$TEE_AUTHORITY_1_KEYPAIR")
          solana airdrop 5 "$admin" --url "$SOLANA_RPC_URL"
          export DARKNYX_INITIAL_TEE_PUBKEYS="$tee0,$tee1"
          echo "DARKNYX_INITIAL_TEE_PUBKEYS=$tee0,$tee1" >> "$GITHUB_ENV"
          (
            cd packages/sdk
            RUN_DEVNET_E2E=1 ../../node_modules/.bin/vitest run \
              tests/devnet-setup.test.ts
          )

      - name: Verify Groth16, generated proofs, and exact mirror recovery
        run: |
          set -euo pipefail
          (
            cd packages/sdk
            ../../node_modules/.bin/vitest run tests/surfpool-qualification.test.ts
            RUN_DEVNET_DW=1 ../../node_modules/.bin/vitest run \
              tests/devnet-deposit-withdraw.test.ts
          )
          cargo test -p darknyx-tee --test surfpool_merkle_sync -- --nocapture

      - name: Pin worst-case settle CU and wire-size sentinels
        run: |
          cargo test -p vault --test tee_forced_settle_batched \
            cu_profile_worst_case_settle -- --nocapture
          cargo test -p darknyx-tee \
            settle::pipeline::tests::settle_v0_tx_compiles_and_fits_under_cap \
            -- --nocapture

      - name: Stop Surfpool and prove teardown
        if: always()
        run: |
          set +e
          if [[ -f .surfpool/surfpool.pid ]]; then
            pid=$(cat .surfpool/surfpool.pid)
            kill "$pid" 2>/dev/null
            for attempt in $(seq 1 50); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.2
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null
            fi
            wait "$pid" 2>/dev/null
          fi
          tail -200 .surfpool/surfpool.log 2>/dev/null
          if curl --silent --max-time 1 "$SURFPOOL_RPC_URL" >/dev/null 2>&1; then
            echo 'Surfpool port is still reachable after teardown' >&2
            exit 1
          fi
          echo 'Surfpool stopped; RPC port is closed'
