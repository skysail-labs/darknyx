# Manually dispatched CVM + devnet release gate.
# (Historical note: the concurrency group `cvm-e2e-nightly`, the repo var
# `DARKNYX_NIGHTLY_CVM_ID`, and the CVM name `nightly-test-cvm` keep their original
# "nightly" names — they are stable identifiers, not the cadence.)
#
# Runs the REAL settle path against a live Phala CVM on Solana devnet: deposit
# real notes, POST crossing orders to the enclave, and assert it matches AND
# settles on-chain (cvm-settle-e2e, cvm-self-trade, cvm-multimatch-settle,
# cvm-merge-then-order, cvm-api-surface) plus the non-billable devnet round-trips.
# ALSO runs cvm-attestation-e2e: real @phala/dcap-qvl verification of the live
# TDX quote (the one thing offline mocks can't do) — report_data K-shard
# set-binding + event-log RTMR3 replay + the on-chain tee_pubkeys cross-check.
#
# WHY MANUAL: this spins a BILLABLE CVM and spends devnet SOL on every run
# (deploy + K-shard settles). Routine protocol integration now runs against the
# pinned Surfpool plus the production TEE under the dstack simulator. Dispatch
# this workflow explicitly for a release, protocol change, or showcase that
# needs real TDX, Phala KMS/gateway, RA-TLS, and real-cluster evidence.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️  TEARDOWN IS THE LOAD-BEARING PART. A CVM bills while running. The final
#     `Stop the CVM (always)` step runs with `if: always()`, and
#     `concurrency.cancel-in-progress: false` guarantees a queued run never
#     cancels a mid-flight one before its teardown fires. A separate sweeper
#     (see the TODO at the bottom) is the belt-and-suspenders for a force-cancel.
# ─────────────────────────────────────────────────────────────────────────────
#
# ONE-TIME SETUP (out of band — NOT done by this workflow, because signer
# rotation/funding and mint creation are not things to re-run per release test):
#   1. Provision a dedicated CVM named `darknyx-nightly-ci` (phala cvms create …) and
#      record its app_id → repo variable `DARKNYX_NIGHTLY_CVM_ID` (e.g. app_xxxx).
#   2. Run devnet-setup ONCE to mint the stable base/quote mints + settle ALT +
#      protocol config, producing `.devnet/e2e-config.json`. Base64 it into the
#      secret `DEVNET_E2E_CONFIG_B64`. (Stable mints — the CVM is pinned to them.)
#      Found it with numTrees>=2 (RUN_DEVNET_E2E + NUM_TREES=2) to have the
#      attestation e2e exercise the multi-key K-shard report_data binding; at
#      numTrees=1 the multi-key concat is only unit-tested.
#   3. Base64 the admin + funder devnet keypairs into `DEVNET_ADMIN_KEYPAIR_B64`
#      and `DEVNET_FUNDER_KEYPAIR_B64`.
#   4. Add secrets `PHALA_CLOUD_API_KEY`, `HELIUS_API_KEY`, and
#      `DARKNYX_NIGHTLY_FEE_EPOCH_KEY`. The fee key must be the 32-byte hex
#      secret whose Poseidon binding is recorded in DEVNET_E2E_CONFIG_B64.
# The K shard signers are deterministic per app_id; this workflow re-rotates +
# tops up their funding every run (idempotent), so a changed image (new
# compose_hash → new signers) is handled automatically.

name: cvm-e2e (manual release gate)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override with an immutable ghcr.io/...@sha256:... image ref"
        required: false
        type: string

# Never let a second run cancel a first mid-deploy — that could skip teardown and
# leak a billable CVM. Queue instead.
concurrency:
  group: cvm-e2e-nightly # Stable identifier retained for mutual exclusion.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Build the tee image from the CURRENT main SHA so the e2e runs against main's
  # ACTUAL tee code (not whatever tag deploy/docker-compose.yaml happens to pin).
  # Reuses tee-image.yml via workflow_call. Skipped when a manual dispatch pins
  # an existing tag through the image_tag input.
  build-image:
    if: ${{ inputs.image_tag == '' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/tee-image.yml
    with:
      tag: cvm-e2e-${{ github.sha }}

  cvm-e2e:
    needs: build-image
    # Run even if build-image was SKIPPED (a dispatch pinned an existing tag);
    # do NOT run if the build failed or was cancelled.
    if: ${{ !cancelled() && needs.build-image.result != 'failure' }}
    runs-on: ubuntu-latest
    # Runner cap (does NOT stop CVM billing on its own — the teardown step does;
    # this just bounds a hung job so it can't run forever before teardown).
    timeout-minutes: 50
    env:
      HELIUS_RPC: "https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}"
      CVM: ${{ vars.DARKNYX_NIGHTLY_CVM_ID }}
      DARKNYX_NIGHTLY_FEE_EPOCH_KEY: ${{ secrets.DARKNYX_NIGHTLY_FEE_EPOCH_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive # darknyx-tee icicle-snark path dep (see pr-checks.yml)

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020 # 1.93.0 (a BRANCH upstream, so it moves — pin it)
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Install the Phala CLI
        run: npm install -g phala

      # ── circuit artifacts — the SDK VALID_INPUT/VALID_SPEND provers need the
      #    .wasm + .zkey. Cache the ptau (pot16/pot18 ~370 MB) + built circuits. ──
      - name: Cache circuit artifacts
        id: cache-circuits
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            circuits/build
            scripts/ptau
          key: circuits-${{ hashFiles('circuits/**/*.circom', 'circuits/templates/*.circom', 'scripts/build-circuits.sh') }}
      # build-circuits.sh shells out to `circom` (compile) + snarkjs (setup +
      # DETERMINISTIC contribute → byte-identical to the committed circuit_final.zkey,
      # so client proofs still verify against the deployed program's VK). Install
      # circom first — it isn't on the runner (tee-image.yml installs it the same way).
      - name: Install circom 2.2.2 (cache miss only)
        if: steps.cache-circuits.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/iden3/circom/releases/download/v2.2.2/circom-linux-amd64 \
            -o /usr/local/bin/circom
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Build circuits (cache miss only)
        if: steps.cache-circuits.outputs.cache-hit != 'true'
        run: |
          bash scripts/download-ptau.sh
          bash scripts/build-circuits.sh

      # ── restore devnet secrets to the paths the tests + scripts expect ──
      # `umask 077` + never echo; these are keypairs/API keys.
      - name: Restore devnet keypairs + e2e-config (from secrets)
        run: |
          umask 077
          mkdir -p .devnet/keypairs
          echo "${{ secrets.DEVNET_ADMIN_KEYPAIR_B64 }}"  | base64 -d > .devnet/keypairs/admin.json
          echo "${{ secrets.DEVNET_FUNDER_KEYPAIR_B64 }}" | base64 -d > .devnet/keypairs/funder.json
          echo "${{ secrets.DEVNET_E2E_CONFIG_B64 }}"     | base64 -d > .devnet/e2e-config.json
          # The SDK harness loads the Helius key from packages/sdk/.env (gitignored).
          printf 'SOLANA_RPC_URL=%s\n' "$HELIUS_RPC" > packages/sdk/.env

      - name: Preflight — CVM id + config present
        run: |
          test -n "$CVM" || { echo "::error::repo variable DARKNYX_NIGHTLY_CVM_ID is unset (one-time setup)"; exit 1; }
          jq -e .baseMint.pubkey .devnet/e2e-config.json > /dev/null
          [[ "$DARKNYX_NIGHTLY_FEE_EPOCH_KEY" =~ ^[0-9a-fA-F]{64}$ ]] \
            || { echo "::error::DARKNYX_NIGHTLY_FEE_EPOCH_KEY must be a nonzero 32-byte hex secret"; exit 1; }
          [[ ! "$DARKNYX_NIGHTLY_FEE_EPOCH_KEY" =~ ^0{64}$ ]] \
            || { echo "::error::DARKNYX_NIGHTLY_FEE_EPOCH_KEY must be nonzero"; exit 1; }

      # ── reset the on-chain tree FIRST so the CVM mirror cold-boots empty and
      #    our deposits land at leaf 0.. (cvm tests assert startCount == 0) ──
      - name: Reset the Merkle tree (devnet)
        run: |
          SOLANA_RPC_URL="$HELIUS_RPC" ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
            node scripts/reset-merkle-tree.mjs

      # ── build the encrypted env (-e) file: real-mint regime (cvm-settle-e2e).
      #    Values never enter the compose_hash; shred after deploy. ──
      - name: Build the CVM env file
        id: envfile
        run: |
          umask 077
          FLOOR=$(node -e "const{Connection}=require('@solana/web3.js');(async()=>{process.stdout.write(String(await new Connection(process.env.HELIUS_RPC).getSlot('confirmed')))})()")

          # Per-window CVM credentials.
          #
          # The compose carries public `darknyx-test-*` defaults, and the test
          # harness deliberately REFUSES them for a live run
          # (`cvm-harness.ts::cvmCredential` throws when RUN_CVM_E2E=1 and the
          # variable is unset) — a live suite authenticating with credentials
          # published in the repo would be testing an access path no real
          # deployment has. So generate a fresh set, inject them through the
          # ENCRYPTED deploy env, and hand the same values to the test steps.
          #
          # Masked before they are used anywhere, so a later step that echoes
          # its environment cannot print them.
          API_KEY="darknyx-ci-$(openssl rand -hex 16)"
          API_SECRET="$(openssl rand -hex 32)"
          PASSPHRASE="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$API_KEY"
          echo "::add-mask::$API_SECRET"
          echo "::add-mask::$PASSPHRASE"
          {
            echo "DARKNYX_TEE_API_KEY=$API_KEY"
            echo "DARKNYX_TEE_API_SECRET=$API_SECRET"
            echo "DARKNYX_TEE_PASSPHRASE=$PASSPHRASE"
            echo "DARKNYX_TEE_SOLANA_RPC_URL=$HELIUS_RPC"
            echo "DARKNYX_TEE_DEPLOYMENT_TIER=development"
            echo "DARKNYX_TEE_ORACLE_MODE=pyth-solana-push-v1"
            echo "DARKNYX_TEE_SYNC_FROM_SLOT=$FLOOR"
            echo "DARKNYX_TEE_BASE_MINT=$(jq -r .baseMint.pubkey .devnet/e2e-config.json)"
            echo "DARKNYX_TEE_QUOTE_MINT=$(jq -r .quoteMint.pubkey .devnet/e2e-config.json)"
            echo "DARKNYX_TEE_SETTLE_LOOKUP_TABLE=$(jq -r .settleLookupTable .devnet/e2e-config.json)"
            echo "DARKNYX_TEE_FEE_RATE_BPS=30"
            echo "DARKNYX_TEE_FEE_EPOCH_KEY=$DARKNYX_NIGHTLY_FEE_EPOCH_KEY"
            echo "DARKNYX_TEE_PROTOCOL_OWNER_COMMITMENT=$(jq -r .protocol.ownerCommitmentHex .devnet/e2e-config.json)"
            echo "DARKNYX_TEE_NUM_TREES=$(jq -r '.numTrees // 1' .devnet/e2e-config.json)"
          } > /tmp/darknyx.env

          # The test steps need the SAME credentials the CVM was given — the
          # harness authenticates with them. This is the half that was missing:
          # the CVM had credentials, the suites did not, so every live run died
          # at "DARKNYX_TEE_API_KEY is required for live CVM tests".
          {
            echo "DARKNYX_TEE_API_KEY=$API_KEY"
            echo "DARKNYX_TEE_API_SECRET=$API_SECRET"
            echo "DARKNYX_TEE_PASSPHRASE=$PASSPHRASE"
          } >> "$GITHUB_ENV"

      - name: Select the image to deploy (built-from-main, or the dispatch override)
        env:
          # Via env, not inline interpolation — `image_tag` is free-form dispatch
          # input and would otherwise be parsed as shell syntax by the runner.
          DISPATCH_IMAGE: ${{ inputs.image_tag }}
          BUILT_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          if [ -n "$DISPATCH_IMAGE" ]; then
            IMAGE="$DISPATCH_IMAGE"
          else
            IMAGE="$BUILT_IMAGE"
          fi
          # Normalise `name:tag@sha256:…` -> `name@sha256:…`.
          #
          # tee-image emits the TAGGED digest form (`steps.immutable`:
          # "${TAGGED_IMAGE}@${DIGEST}"), because the tag is useful provenance.
          # The committed compose pins the UNTAGGED form, and the validation
          # below only accepts that. Both are valid OCI references and the
          # digest is what pins content either way, so the disagreement was
          # purely a shape mismatch between two workflows — but it failed the
          # workflow at this step every run, after the job had already built the
          # image and reset the devnet tree.
          #
          # Strip only the tag: `%%@*` takes the repository part, `%:*` drops a
          # trailing `:tag` (a no-op when absent, and ghcr.io carries no port).
          if [ "${IMAGE#*@}" != "$IMAGE" ]; then
            REPO="${IMAGE%%@*}"
            IMAGE="${REPO%:*}@${IMAGE#*@}"
          fi

          # Full-shape match, not a prefix glob: `@sha256:*` would accept a
          # truncated or trailing-garbage digest, and this value is substituted
          # straight into the compose that compose_hash measures.
          case "$IMAGE" in
            ghcr.io/skysail-labs/darknyx-tee@sha256:*) ;;
            *) echo "::error::CVM deploy requires an immutable ghcr @sha256 image: $IMAGE"; exit 1 ;;
          esac
          printf '%s' "$IMAGE" | grep -qE '^ghcr\.io/skysail-labs/darknyx-tee@sha256:[0-9a-f]{64}$' \
            || { echo "::error::malformed image digest: $IMAGE"; exit 1; }
          sed -i -E "s#^    image: ghcr.io/skysail-labs/darknyx-tee.*#    image: $IMAGE#" deploy/docker-compose.yaml
          grep -E 'image: ghcr' deploy/docker-compose.yaml

      # ── initial bring-up (re-pulls the image + derives signers) ──
      # NOTE: `phala cvms start` is async; issuing `phala deploy` while it is
      # still in flight fails with "Another operation is already in progress".
      # So: start → WAIT until status=running → deploy (with a busy-retry).
      - name: Deploy to the dedicated release CVM
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          APP_ID="${CVM#app_}"
          phala cvms start "$CVM" || true
          for i in $(seq 1 40); do
            ST=$(phala cvms list 2>/dev/null | awk -v a="$APP_ID" '$1==a{print $3}')
            [ "$ST" = "running" ] && { echo "CVM running"; break; }
            sleep 6
          done
          for d in $(seq 1 6); do
            OUT=$(phala deploy --cvm-id "$CVM" -c deploy/docker-compose.yaml -e /tmp/darknyx.env --wait 2>&1)
            echo "$OUT"
            echo "$OUT" | grep -q "already in progress" || break
            echo "deploy busy — retry $d in 20s"; sleep 20
          done
          shred -u /tmp/darknyx.env || rm -f /tmp/darknyx.env
          # The dstack gateway node (prodN) is assigned PER CVM — do NOT hardcode
          # it (nightly-test-cvm is on prod9, darknyx-hardening-3c2 on prod5). Resolve
          # the app's gateway base_domain and route through the
          # <app_id>-8443s.<base_domain> subdomain.
          #
          # T-03P: the `s` suffix selects dstack TLS PASSTHROUGH, so the enclave
          # terminates TLS itself. `:8080` is no longer published, so the old
          # `-8080.` form returns HTTP 000 — this workflow was left pointing at
          # it by the cutover and failed here every run.
          BASE=$(phala cvms get "$CVM" --json 2>/dev/null | sed -n '/{/,$p' \
                 | jq -r '.. | objects | .base_domain // empty' 2>/dev/null | grep . | head -1)
          [ -n "$BASE" ] || { echo "::error::could not resolve gateway base_domain for $CVM"; exit 1; }
          GW="https://${APP_ID}-8443s.${BASE}"
          echo "gateway: $GW"
          echo "GATEWAY=$GW" >> "$GITHUB_ENV"

      - name: Wait for the CVM to be healthy
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          # First cold boot includes a full ~GB image pull. This workflow builds a
          # NEW image every run, so the host has never cached it — this is
          # always the slow path, never the warm one.
          #
          # Raised 60 -> 120 (10 -> 20 min) after the first run that ever
          # reached this step timed out at exactly 600 s while the enclave was
          # in fact still starting, and came up shortly after. Earlier runs
          # never got this far, so the budget had never been exercised against
          # a genuinely fresh image.
          for i in $(seq 1 120); do
            # -k: the enclave serves its OWN boot-scoped certificate, so there
            # is no CA chain to validate. This is a LIVENESS probe only — the
            # security check is the SPKI-against-quote verification the test
            # suites perform via DARKNYX_CVM_TRANSPORT=ra-tls below, which is
            # what actually binds this peer to a TDX quote.
            if curl -fsSk "$GATEWAY/info" > /tmp/info.json 2>/dev/null; then
              echo "CVM healthy after ~$((i*10))s"; jq -e -r '.tee_pubkey' /tmp/info.json > /dev/null; break
            fi
            sleep 10
            if [ "$i" = 120 ]; then
              # Dump the enclave's own boot log before failing.
              #
              # Without this the step reports only "did not become healthy" and
              # the cleanup step then STOPS the CVM, so the reason is gone by
              # the time anyone looks — the failure is undiagnosable after the
              # fact. Under `ra-tls` the boot can fail closed on purpose
              # (TransportIdentity::generate refuses to fall back to
              # plaintext), and that is exactly the line worth seeing.
              echo "::group::enclave boot log (last 120 lines)"
              phala cvms logs "$CVM" 2>&1 | tail -120 || echo "(logs unavailable)"
              echo "::endgroup::"
              echo "::group::route probes"
              echo "-8443s (RA-TLS, -k):  $(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 "$GATEWAY/info" || true)"
              echo "-8080  (plaintext):   $(curl -s  -o /dev/null -w '%{http_code}' --max-time 20 "${GATEWAY/-8443s./-8080.}/info" || true)"
              echo "::endgroup::"
              echo "::error::CVM did not become healthy at $GATEWAY"
              exit 1
            fi
          done

      # T-03P: every cvm-* suite runs over the VERIFIED transport, which needs
      # the two governance pins. They are read from the live enclave rather than
      # stored, because a compose edit of ANY kind moves compose_hash — a stored
      # value would go stale silently and the suites would fail closed with a
      # pin error that looks like an attack.
      - name: Read the RA-TLS governance pins from the enclave
        run: |
          set -euo pipefail
          NONCE=$(openssl rand -hex 32)
          curl -fsSk --max-time 40 \
            "$GATEWAY/transport-attestation?nonce=$NONCE" -o /tmp/ta.json
          COMPOSE=$(jq -r '(.event_log | if type=="string" then fromjson else . end)
                            | map(select(.event=="compose-hash")) | .[0].event_payload' /tmp/ta.json)
          SIGNERS=$(jq -r '.manifest.signer_set_sha256' /tmp/ta.json)
          MODE=$(jq -r '.manifest.transport_mode' /tmp/ta.json)
          # Fail closed: an empty pin would disable the very check it configures.
          printf '%s' "$COMPOSE" | grep -qE '^[0-9a-f]{64}$' \
            || { echo "::error::bad compose hash from /transport-attestation: $COMPOSE"; exit 1; }
          printf '%s' "$SIGNERS" | grep -qE '^[0-9a-f]{64}$' \
            || { echo "::error::bad signer set from /transport-attestation: $SIGNERS"; exit 1; }
          [ "$MODE" = "ra-tls" ] \
            || { echo "::error::enclave reports transport_mode=$MODE, expected ra-tls"; exit 1; }
          echo "transport_mode : $MODE"
          echo "compose_hash   : $COMPOSE"
          echo "signer_set     : $SIGNERS"
          {
            echo "DARKNYX_CVM_TRANSPORT=ra-tls"
            echo "DARKNYX_EXPECT_COMPOSE_HASH=$COMPOSE"
            echo "DARKNYX_EXPECT_SIGNER_SET=$SIGNERS"
            echo "DARKNYX_TEE_RATLS_URL=$GATEWAY"
          } >> "$GITHUB_ENV"

      # ── rotate `tee_pubkeys` to the K shard signers from the boot log + fund.
      #    Idempotent: a same-image redeploy yields the same signers (no-op
      #    rotate + top-up); a changed image yields new signers (this fixes them). ──
      - name: Rotate + fund the K shard signers
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          # The boot log line is: shard_pubkeys=["k0","k1",…] "derived K-shard
          # TEE signer set …" — grep that line, then pull the base58 keys.
          KEYS=$(phala cvms logs "$CVM" | grep -F 'derived K-shard TEE signer set' \
                 | grep -oE '[1-9A-HJ-NP-Za-km-z]{43,44}' | tr '\n' ' ')
          # Fall back to the /info primary if the log grep came up empty.
          [ -z "$KEYS" ] && KEYS=$(jq -r '.tee_pubkey' /tmp/info.json)
          echo "shard signers: $KEYS"
          SOLANA_RPC_URL="$HELIUS_RPC" ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
            node scripts/rotate-tee-pubkey.mjs $KEYS
          # 0.5 SOL/signer — a night of tests spends well under that, and it keeps
          # the funder from draining (and limits stranded SOL when build-from-main
          # rotates to new signers). Override with FUND_TARGET_SOL.
          SOLANA_RPC_URL="$HELIUS_RPC" FUNDER_KEYPAIR=.devnet/keypairs/funder.json \
            FUND_TARGET_SOL="${FUND_TARGET_SOL:-0.5}" \
            node scripts/fund-tee-keys.mjs $KEYS

      # ── the actual tests ──
      # Keypair env vars resolve against REPO_ROOT (resolve(__dirname,"../../..")),
      # so they must be REPO-ROOT-relative (".devnet/…"), NOT relative to the
      # packages/sdk cwd — a "../../" prefix climbs ABOVE the repo (a bug the live
      # validation caught: "/Users/.devnet/keypairs/admin.json").
      - name: Devnet round-trip (deposit → withdraw; no CVM needed)
        run: |
          cd packages/sdk
          RUN_DEVNET_DW=1 SOLANA_RPC_URL="$HELIUS_RPC" \
            ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
            FUNDER_KEYPAIR=.devnet/keypairs/funder.json \
            ../../node_modules/.bin/vitest run tests/devnet-deposit-withdraw.test.ts

      # api-surface asserts NO on-chain tree state (auth / rate-limit / settings /
      # ws), so it needs no fresh tree — run it once against the live CVM.
      - name: CVM API-surface e2e
        run: |
          cd packages/sdk
          RUN_CVM_E2E=1 DARKNYX_TEE_GATEWAY="$GATEWAY" SOLANA_RPC_URL="$HELIUS_RPC" \
            FUNDER_KEYPAIR=.devnet/keypairs/funder.json \
            ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
            ../../node_modules/.bin/vitest run tests/cvm-api-surface.test.ts

      # Attestation is STATELESS (no on-chain tree state) — real Intel-TCB DCAP
      # verification of the live quote via @phala/dcap-qvl, the report_data
      # set-binding, and the on-chain vault_config.tee_pubkeys cross-check. Must
      # run AFTER the rotate step so vault_config.tee_pubkeys == /info.tee_pubkeys.
      # With numTrees>=2 in the founded e2e-config this also exercises the
      # multi-key (K-shard) report_data binding end-to-end; at numTrees=1 it
      # T-03P: the transport itself. This is the only suite that drives the
      # production adapter against a real TDX quote and a real passthrough
      # route, and it was NOT previously in this gate — the transport had no
      # live-CVM coverage at all. NODE_OPTIONS=--expose-gc is required: the RSS
      # retention test refuses to run without it rather than silently measuring
      # uncollected garbage.
      - name: RA-TLS transport against the live CVM
        run: |
          cd packages/sdk
          RUN_CVM_RATLS=1 NODE_OPTIONS="--expose-gc" \
            ../../node_modules/.bin/vitest run tests/cvm-ratls-transport.test.ts

      # validates the single-key case (the multi-key concat is unit-tested).
      - name: CVM attestation e2e (real DCAP)
        run: |
          cd packages/sdk
          RUN_CVM_ATTEST=1 DARKNYX_TEE_GATEWAY="$GATEWAY" SOLANA_RPC_URL="$HELIUS_RPC" \
            ../../node_modules/.bin/vitest run tests/cvm-attestation-e2e.test.ts

      # Each of these asserts startCount==0 then deposits+settles, so they CANNOT
      # share a tree — every one needs its own reset + a CVM-mirror cold-boot (a
      # redeploy re-reads DARKNYX_TEE_SYNC_FROM_SLOT). So: reset → redeploy → run, per
      # test. Signers are unchanged across same-image redeploys, so the earlier
      # rotate+fund still holds (no re-rotate needed).
      - name: CVM tree-consuming e2e (reset + redeploy per test)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          set -uo pipefail
          redeploy_fresh() {
            SOLANA_RPC_URL="$HELIUS_RPC" ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
              node scripts/reset-merkle-tree.mjs
            umask 077
            FLOOR=$(node -e "const{Connection}=require('@solana/web3.js');(async()=>{process.stdout.write(String(await new Connection(process.env.HELIUS_RPC).getSlot('confirmed')))})()")
            {
              # The SAME per-window credentials the initial deploy used.
              #
              # Omitting them here did two things: the redeployed CVM fell back
              # to the compose's public `darknyx-test-*` defaults while the test
              # steps still carried the generated ones, and — because the set of
              # env KEYS differs between the two deployments — the app-compose
              # differed, which moves compose_hash and made every tree-consuming
              # test fail `compose_mismatch`.
              echo "DARKNYX_TEE_API_KEY=$DARKNYX_TEE_API_KEY"
              echo "DARKNYX_TEE_API_SECRET=$DARKNYX_TEE_API_SECRET"
              echo "DARKNYX_TEE_PASSPHRASE=$DARKNYX_TEE_PASSPHRASE"
              echo "DARKNYX_TEE_SOLANA_RPC_URL=$HELIUS_RPC"
              echo "DARKNYX_TEE_DEPLOYMENT_TIER=development"
              echo "DARKNYX_TEE_ORACLE_MODE=pyth-solana-push-v1"
              echo "DARKNYX_TEE_SYNC_FROM_SLOT=$FLOOR"
              echo "DARKNYX_TEE_BASE_MINT=$(jq -r .baseMint.pubkey .devnet/e2e-config.json)"
              echo "DARKNYX_TEE_QUOTE_MINT=$(jq -r .quoteMint.pubkey .devnet/e2e-config.json)"
              echo "DARKNYX_TEE_SETTLE_LOOKUP_TABLE=$(jq -r .settleLookupTable .devnet/e2e-config.json)"
              echo "DARKNYX_TEE_FEE_RATE_BPS=30"
              echo "DARKNYX_TEE_FEE_EPOCH_KEY=$DARKNYX_NIGHTLY_FEE_EPOCH_KEY"
              echo "DARKNYX_TEE_PROTOCOL_OWNER_COMMITMENT=$(jq -r .protocol.ownerCommitmentHex .devnet/e2e-config.json)"
              echo "DARKNYX_TEE_NUM_TREES=$(jq -r '.numTrees // 1' .devnet/e2e-config.json)"
            } > /tmp/darknyx.env
            for d in $(seq 1 6); do
              OUT=$(phala deploy --cvm-id "$CVM" -c deploy/docker-compose.yaml -e /tmp/darknyx.env --wait 2>&1)
              echo "$OUT" | grep -q "already in progress" || break
              echo "deploy busy — retry $d in 20s"; sleep 20
            done
            # Same secure-erase as the initial deploy — this file carries the
            # Helius and Pyth credentials, and this helper rewrites it once per
            # tree-consuming test, so a plain rm would leave the most-written
            # secret file on the runner as recoverable blocks.
            shred -u /tmp/darknyx.env 2>/dev/null || rm -f /tmp/darknyx.env
            # -k, like the first health wait: the enclave serves its OWN
            # boot-scoped certificate, so there is no CA chain to validate.
            # This is the SECOND health wait in this workflow and it was missed
            # when the first one was fixed — without -k it can never succeed
            # against the RA-TLS route, so it burned its full 40x6s budget and
            # then ran the test against a CVM it had not confirmed was up.
            #
            # It also now FAILS LOUDLY instead of falling through: a silent
            # fall-through turns "the CVM never came back" into a confusing
            # test failure several minutes later.
            READY=0
            for i in $(seq 1 40); do
              curl -fsSk "$GATEWAY/info" -o /tmp/info.json 2>/dev/null && { READY=1; break; }
              sleep 6
            done
            [ "$READY" = 1 ] || { echo "::error::CVM did not come back after redeploy for $T"; exit 1; }

            # RE-READ the governance pins after EVERY redeploy.
            #
            # The pins captured once before this loop describe the deployment
            # that was live THEN. This helper redeploys the CVM before each
            # test, so a pin read earlier can describe a different enclave —
            # and the client correctly refuses with `compose_mismatch`, which
            # is what failed all four tree-consuming tests.
            #
            # That refusal is the transport working, not a bug: it is exactly
            # the check that stops a client talking to an enclave other than
            # the one its governance pins name. The fix is to re-pin, never to
            # relax the check.
            NONCE=$(openssl rand -hex 32)
            curl -fsSk --max-time 40 \
              "$GATEWAY/transport-attestation?nonce=$NONCE" -o /tmp/ta.json
            DARKNYX_EXPECT_COMPOSE_HASH=$(jq -r '(.event_log | if type=="string" then fromjson else . end)
                              | map(select(.event=="compose-hash")) | .[0].event_payload' /tmp/ta.json)
            DARKNYX_EXPECT_SIGNER_SET=$(jq -r '.manifest.signer_set_sha256' /tmp/ta.json)
            export DARKNYX_EXPECT_COMPOSE_HASH DARKNYX_EXPECT_SIGNER_SET
            printf '%s' "$DARKNYX_EXPECT_COMPOSE_HASH" | grep -qE '^[0-9a-f]{64}$' \
              || { echo "::error::bad compose hash after redeploy for $T"; exit 1; }
            printf '%s' "$DARKNYX_EXPECT_SIGNER_SET" | grep -qE '^[0-9a-f]{64}$' \
              || { echo "::error::bad signer set after redeploy for $T"; exit 1; }
            echo "re-pinned: compose=$DARKNYX_EXPECT_COMPOSE_HASH"
          }
          FAILED=""
          for T in cvm-settle-e2e cvm-self-trade cvm-multimatch-settle cvm-merge-then-order; do
            echo "::group::$T"
            redeploy_fresh
            ( cd packages/sdk && RUN_CVM_E2E=1 DARKNYX_TEE_GATEWAY="$GATEWAY" SOLANA_RPC_URL="$HELIUS_RPC" \
                FUNDER_KEYPAIR=.devnet/keypairs/funder.json ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
                ../../node_modules/.bin/vitest run tests/$T.test.ts ) || FAILED="$FAILED $T"
            echo "::endgroup::"
          done
          [ -z "$FAILED" ] || { echo "::error::CVM tests failed:$FAILED"; exit 1; }

      # ── DAEMON LIFECYCLE ────────────────────────────────────────────────
      # The daemon's integration contract with a live enclave — stream framing,
      # auth, the fills channel, leaf resolution, cancel — plus the transport
      # leak guard (ported here when cvm-daemon-smoke was retired into this
      # suite, where it covers strictly more of the flow).
      #
      # The offline daemon suites cover this logic against mocks, which cannot
      # catch wire drift. Nothing ran the live one, so the `leaf_count` →
      # `total_leaf_count` rename broke it silently. That is the gap this step
      # closes.
      #
      # Its settle assertion is RELATIVE (before+3), not an empty-tree check,
      # so unlike the tree-consuming suites above it needs no reset + cold boot
      # and can run straight after them.
      - name: Daemon lifecycle against the live CVM
        run: |
          set -euo pipefail
          # Re-pin: the loop above redeploys before every test, so pins read
          # earlier in the job can describe a different enclave and the client
          # correctly refuses with `compose_mismatch`.
          NONCE=$(openssl rand -hex 32)
          curl -fsSk --max-time 40 \
            "$GATEWAY/transport-attestation?nonce=$NONCE" -o /tmp/ta-daemon.json
          DARKNYX_EXPECT_COMPOSE_HASH=$(jq -r '(.event_log | if type=="string" then fromjson else . end)
                            | map(select(.event=="compose-hash")) | .[0].event_payload' /tmp/ta-daemon.json)
          DARKNYX_EXPECT_SIGNER_SET=$(jq -r '.manifest.signer_set_sha256' /tmp/ta-daemon.json)
          export DARKNYX_EXPECT_COMPOSE_HASH DARKNYX_EXPECT_SIGNER_SET
          printf '%s' "$DARKNYX_EXPECT_COMPOSE_HASH" | grep -qE '^[0-9a-f]{64}$' \
            || { echo "::error::bad compose hash before the daemon run"; exit 1; }
          ( cd packages/daemon && RUN_CVM_DAEMON_LIFECYCLE=1 \
              DARKNYX_CVM_TRANSPORT=ra-tls \
              DARKNYX_TEE_GATEWAY="$GATEWAY" SOLANA_RPC_URL="$HELIUS_RPC" \
              ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
              FUNDER_KEYPAIR=.devnet/keypairs/funder.json \
              ../../node_modules/.bin/vitest run tests/cvm-daemon-lifecycle.test.ts )

      # ── LEGACY-PATH COVERAGE ────────────────────────────────────────────
      # The gateway-terminated transport is kept deliberately as the REVERT
      # path (transport-integrity-plan.md §5.5), not as dead code. §5.5.4
      # flags the cost of that: after the cutover nothing exercised it, so
      # "it works" rested on the code paths existing rather than on a green
      # run — and an unexercised revert path degrades into a hope.
      # `cvm-daemon-lifecycle` was structurally unrunnable for weeks in
      # exactly that way while CI stayed green.
      #
      # So the revert gets exercised once per release run. That is what makes the
      # keep-decision durable rather than nominal.
      #
      # Runs LAST: it deploys a different compose, and every step above must
      # see the RA-TLS one.
      - name: Legacy (gateway-terminated) path still works
        env:
          # Every other phala-invoking step sets this explicitly. Omitting it
          # here left `phala deploy` unauthenticated.
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          set -euo pipefail
          # Tracing is load-bearing, not debug residue: the first run of this
          # step exited 1 in under a second with NO output and no annotation,
          # which is unlocalizable from the log. `set -x` is disabled only
          # around the block that writes credentials.
          set -x
          # DERIVED from the committed compose, never a second checked-in
          # file. Two env builders drifting is what produced a
          # compose_mismatch earlier in this workflow; a second compose would
          # drift the same way. A mechanical transform cannot.
          sed -e 's/DARKNYX_TEE_TRANSPORT_MODE:-ra-tls/DARKNYX_TEE_TRANSPORT_MODE:-gateway-terminated/' \
              -e 's|^      - "8443:8443"|      - "8080:8080"\n      - "8443:8443"|' \
              deploy/docker-compose.yaml > /tmp/compose-legacy.yaml
          # Assert the transform actually fired. A silent no-op would redeploy
          # RA-TLS and let this step "pass" while testing nothing — the exact
          # failure mode this job keeps producing.
          grep -q 'DARKNYX_TEE_TRANSPORT_MODE:-gateway-terminated' /tmp/compose-legacy.yaml \
            || { echo "::error::legacy transform did not set the transport mode"; exit 1; }
          grep -q '"8080:8080"' /tmp/compose-legacy.yaml \
            || { echo "::error::legacy transform did not publish :8080"; exit 1; }

          umask 077
          FLOOR=$(node -e "const{Connection}=require('@solana/web3.js');(async()=>{process.stdout.write(String(await new Connection(process.env.HELIUS_RPC).getSlot('confirmed')))})()")
          echo "checkpoint: sync floor = $FLOOR"
          set +x
          {
            echo "DARKNYX_TEE_API_KEY=$DARKNYX_TEE_API_KEY"
            echo "DARKNYX_TEE_API_SECRET=$DARKNYX_TEE_API_SECRET"
            echo "DARKNYX_TEE_PASSPHRASE=$DARKNYX_TEE_PASSPHRASE"
            echo "DARKNYX_TEE_SOLANA_RPC_URL=$HELIUS_RPC"
            echo "DARKNYX_TEE_DEPLOYMENT_TIER=development"
            echo "DARKNYX_TEE_ORACLE_MODE=pyth-solana-push-v1"
            echo "DARKNYX_TEE_SYNC_FROM_SLOT=$FLOOR"
            echo "DARKNYX_TEE_BASE_MINT=$(jq -r .baseMint.pubkey .devnet/e2e-config.json)"
            echo "DARKNYX_TEE_QUOTE_MINT=$(jq -r .quoteMint.pubkey .devnet/e2e-config.json)"
            echo "DARKNYX_TEE_SETTLE_LOOKUP_TABLE=$(jq -r .settleLookupTable .devnet/e2e-config.json)"
            echo "DARKNYX_TEE_FEE_RATE_BPS=30"
            echo "DARKNYX_TEE_FEE_EPOCH_KEY=$DARKNYX_NIGHTLY_FEE_EPOCH_KEY"
            echo "DARKNYX_TEE_PROTOCOL_OWNER_COMMITMENT=$(jq -r .protocol.ownerCommitmentHex .devnet/e2e-config.json)"
            echo "DARKNYX_TEE_NUM_TREES=$(jq -r '.numTrees // 1' .devnet/e2e-config.json)"
          } > /tmp/darknyx-legacy.env
          set -x
          echo "checkpoint: env file written ($(wc -l < /tmp/darknyx-legacy.env) lines)"

          # `OUT=$(phala deploy ...)` under `set -e` exits the step on a failed
          # deploy with the output still trapped in the substitution — a silent
          # death. Capture the status, ALWAYS print the output, then decide.
          DEPLOYED=0
          for d in $(seq 1 6); do
            OUT=$(phala deploy --cvm-id "$CVM" -c /tmp/compose-legacy.yaml -e /tmp/darknyx-legacy.env --wait 2>&1) && RC=0 || RC=$?
            echo "$OUT"
            if [ "$RC" = 0 ]; then DEPLOYED=1; break; fi
            echo "$OUT" | grep -q "already in progress" \
              || { echo "::error::legacy deploy failed (rc=$RC)"; exit 1; }
            echo "deploy busy — retry $d in 20s"; sleep 20
          done
          [ "$DEPLOYED" = 1 ] || { echo "::error::legacy deploy never succeeded"; exit 1; }
          shred -u /tmp/darknyx-legacy.env 2>/dev/null || rm -f /tmp/darknyx-legacy.env

          LEGACY_GW="${GATEWAY/-8443s./-8080.}"
          READY=0
          for i in $(seq 1 90); do
            # NO -k: on this path the GATEWAY terminates TLS with its own
            # publicly-trusted certificate, so ordinary validation must pass.
            # Needing -k here would mean we had not actually switched.
            curl -fsS "$LEGACY_GW/info" -o /tmp/info-legacy.json 2>/dev/null && { READY=1; break; }
            sleep 10
          done
          [ "$READY" = 1 ] || { echo "::error::legacy route never came up at $LEGACY_GW"; exit 1; }

          # The INVERSE assertion. Without it this step would pass on a
          # deployment that never left ra-tls at all.
          RATLS_CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 "$GATEWAY/info" || true)
          [ "$RATLS_CODE" != "200" ] \
            || { echo "::error::RA-TLS route still serving under gateway-terminated ($RATLS_CODE)"; exit 1; }
          echo "legacy up at :8080; ra-tls route now $RATLS_CODE"

          # A real suite over the legacy transport. DARKNYX_CVM_TRANSPORT is
          # deliberately UNSET so the harness selects plain fetch — the code
          # path a revert would actually take.
          ( cd packages/sdk && RUN_CVM_E2E=1 DARKNYX_TEE_GATEWAY="$LEGACY_GW" \
              SOLANA_RPC_URL="$HELIUS_RPC" \
              env -u DARKNYX_CVM_TRANSPORT -u DARKNYX_EXPECT_COMPOSE_HASH -u DARKNYX_EXPECT_SIGNER_SET \
              ../../node_modules/.bin/vitest run --project cvm tests/cvm-api-surface.test.ts )
      # ═══════════════════════════════════════════════════════════════════════
      # TEARDOWN — ALWAYS. Stops CVM billing whether the tests passed, failed,
      # or errored. `if: always()` + the queue-don't-cancel concurrency policy
      # are what keep a billable CVM from leaking.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Stop the CVM (always)
        if: always()
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          shred -u /tmp/darknyx.env 2>/dev/null || rm -f /tmp/darknyx.env
          shred -u packages/sdk/.env 2>/dev/null || rm -f packages/sdk/.env
          if [ -n "$CVM" ]; then
            phala cvms stop "$CVM" || echo "::warning::phala cvms stop failed — VERIFY MANUALLY in the dashboard"
          fi

# Belt-and-suspenders teardown lives in cvm-sweeper.yml: it unconditionally stops
# this CVM a few times a day, in the SAME concurrency group as this workflow so it
# can never race a live release run — covering the force-cancel edge where a hard
# cancel skips even the `if: always()` teardown above.
#
# Build-from-main honesty is handled by the `build-image` job (reuses
# tee-image.yml via workflow_call), so the e2e runs against main's actual tee code.
