# Nightly CVM + devnet end-to-end.
#
# Runs the REAL settle path against a live Phala CVM on Solana devnet: deposit
# real notes, POST crossing orders to the enclave, and assert it matches AND
# settles on-chain (cvm-settle-e2e, cvm-self-trade, cvm-multimatch-settle,
# cvm-merge-then-order, cvm-api-surface) plus the non-billable devnet round-trips.
#
# WHY NIGHTLY, NOT PER-PUSH: this spins a BILLABLE CVM and spends devnet SOL on
# every run (deploy + K-shard settles). Per-push would bill on every commit and
# race concurrent deploys against one devnet program. A nightly on `main` (plus
# manual `workflow_dispatch`) is the right cadence — it catches regressions in
# the deployed-system contract without burning money on every push. The fast,
# free, per-PR signal stays in pr-checks.yml (unit + litesvm + the SDK vitest
# suite, whose CVM/devnet tests auto-skip without RUN_CVM_E2E/RUN_DEVNET_*).
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️  TEARDOWN IS THE LOAD-BEARING PART. A CVM bills while running. The final
#     `Stop the CVM (always)` step runs with `if: always()`, and
#     `concurrency.cancel-in-progress: false` guarantees a queued run never
#     cancels a mid-flight one before its teardown fires. A separate sweeper
#     (see the TODO at the bottom) is the belt-and-suspenders for a force-cancel.
# ─────────────────────────────────────────────────────────────────────────────
#
# ONE-TIME SETUP (out of band — NOT done by this workflow, because signer
# rotation/funding and mint creation are not things you want to re-run nightly):
#   1. Provision a dedicated CVM named `nyx-nightly-ci` (phala cvms create …) and
#      record its app_id → repo variable `NYX_NIGHTLY_CVM_ID` (e.g. app_xxxx).
#   2. Run devnet-setup ONCE to mint the stable base/quote mints + settle ALT +
#      protocol config, producing `.devnet/e2e-config.json`. Base64 it into the
#      secret `DEVNET_E2E_CONFIG_B64`. (Stable mints — the CVM is pinned to them.)
#   3. Base64 the admin + funder devnet keypairs into `DEVNET_ADMIN_KEYPAIR_B64`
#      and `DEVNET_FUNDER_KEYPAIR_B64`.
#   4. Add secrets `PHALA_CLOUD_API_KEY` and `HELIUS_API_KEY`.
# The K shard signers are deterministic per app_id; this workflow re-rotates +
# tops up their funding every run (idempotent), so a changed image (new
# compose_hash → new signers) is handled automatically.

name: cvm-e2e (nightly)

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override the nyx-tee image tag to deploy (default: whatever deploy/docker-compose.yaml pins)"
        required: false
        type: string

# Never let a second run cancel a first mid-deploy — that could skip teardown and
# leak a billable CVM. Queue instead.
concurrency:
  group: cvm-e2e-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Build the tee image from the CURRENT main SHA so the e2e runs against main's
  # ACTUAL tee code (not whatever tag deploy/docker-compose.yaml happens to pin).
  # Reuses tee-image.yml via workflow_call. Skipped when a manual dispatch pins
  # an existing tag through the image_tag input.
  build-image:
    if: ${{ inputs.image_tag == '' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/tee-image.yml
    with:
      tag: cvm-e2e-${{ github.sha }}

  cvm-e2e:
    needs: build-image
    # Run even if build-image was SKIPPED (a dispatch pinned an existing tag);
    # do NOT run if the build failed or was cancelled.
    if: ${{ !cancelled() && needs.build-image.result != 'failure' }}
    runs-on: ubuntu-latest
    # Runner cap (does NOT stop CVM billing on its own — the teardown step does;
    # this just bounds a hung job so it can't run forever before teardown).
    timeout-minutes: 50
    env:
      HELIUS_RPC: "https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}"
      CVM: ${{ vars.NYX_NIGHTLY_CVM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # nyx-tee icicle-snark path dep (see pr-checks.yml)

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Install the Phala CLI
        run: npm install -g phala

      # ── circuit artifacts — the SDK VALID_INPUT/VALID_SPEND provers need the
      #    .wasm + .zkey. Cache the ptau (pot16/pot18 ~370 MB) + built circuits. ──
      - name: Cache circuit artifacts
        id: cache-circuits
        uses: actions/cache@v4
        with:
          path: |
            circuits/build
            circuits/ptau
          key: circuits-${{ hashFiles('circuits/**/*.circom', 'circuits/templates/*.circom', 'scripts/build-circuits.sh') }}
      - name: Build circuits (cache miss only)
        if: steps.cache-circuits.outputs.cache-hit != 'true'
        run: |
          bash scripts/download-ptau.sh
          bash scripts/build-circuits.sh

      # ── restore devnet secrets to the paths the tests + scripts expect ──
      # `umask 077` + never echo; these are keypairs/API keys.
      - name: Restore devnet keypairs + e2e-config (from secrets)
        run: |
          umask 077
          mkdir -p .devnet/keypairs
          echo "${{ secrets.DEVNET_ADMIN_KEYPAIR_B64 }}"  | base64 -d > .devnet/keypairs/admin.json
          echo "${{ secrets.DEVNET_FUNDER_KEYPAIR_B64 }}" | base64 -d > .devnet/keypairs/funder.json
          echo "${{ secrets.DEVNET_E2E_CONFIG_B64 }}"     | base64 -d > .devnet/e2e-config.json
          # The SDK harness loads the Helius key from packages/sdk/.env (gitignored).
          printf 'SOLANA_RPC_URL=%s\n' "$HELIUS_RPC" > packages/sdk/.env

      - name: Preflight — CVM id + config present
        run: |
          test -n "$CVM" || { echo "::error::repo variable NYX_NIGHTLY_CVM_ID is unset (one-time setup)"; exit 1; }
          jq -e .baseMint.pubkey .devnet/e2e-config.json > /dev/null

      # ── reset the on-chain tree FIRST so the CVM mirror cold-boots empty and
      #    our deposits land at leaf 0.. (cvm tests assert startCount == 0) ──
      - name: Reset the Merkle tree (devnet)
        run: |
          SOLANA_RPC_URL="$HELIUS_RPC" ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
            node scripts/reset-merkle-tree.mjs

      # ── build the encrypted env (-e) file: real-mint regime (cvm-settle-e2e).
      #    Values never enter the compose_hash; shred after deploy. ──
      - name: Build the CVM env file
        id: envfile
        run: |
          umask 077
          FLOOR=$(node -e "const{Connection}=require('@solana/web3.js');(async()=>{process.stdout.write(String(await new Connection(process.env.HELIUS_RPC).getSlot('confirmed')))})()")
          {
            echo "NYX_TEE_SOLANA_RPC_URL=$HELIUS_RPC"
            echo "NYX_TEE_SYNC_FROM_SLOT=$FLOOR"
            echo "NYX_TEE_BASE_MINT=$(jq -r .baseMint.pubkey .devnet/e2e-config.json)"
            echo "NYX_TEE_QUOTE_MINT=$(jq -r .quoteMint.pubkey .devnet/e2e-config.json)"
            echo "NYX_TEE_SETTLE_LOOKUP_TABLE=$(jq -r .settleLookupTable .devnet/e2e-config.json)"
            echo "NYX_TEE_FEE_RATE_BPS=30"
            echo "NYX_TEE_PROTOCOL_OWNER_COMMITMENT=$(jq -r .protocol.ownerCommitmentHex .devnet/e2e-config.json)"
            echo "NYX_TEE_NUM_TREES=$(jq -r '.numTrees // 1' .devnet/e2e-config.json)"
          } > /tmp/nyx.env

      - name: Select the image to deploy (built-from-main, or the dispatch override)
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            sed -i "s#\(image: ghcr.io/skysail-labs/nyx-tee:\).*#\1${{ inputs.image_tag }}#" deploy/docker-compose.yaml
          else
            sed -i "s#image: ghcr.io/skysail-labs/nyx-tee:.*#image: ${{ needs.build-image.outputs.image }}#" deploy/docker-compose.yaml
          fi
          grep -E 'image: ghcr' deploy/docker-compose.yaml

      # ── initial bring-up (re-pulls the image + derives signers) ──
      # NOTE: `phala cvms start` is async; issuing `phala deploy` while it is
      # still in flight fails with "Another operation is already in progress".
      # So: start → WAIT until status=running → deploy (with a busy-retry).
      - name: Deploy to the nightly CVM
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          APP_ID="${CVM#app_}"
          phala cvms start "$CVM" || true
          for i in $(seq 1 40); do
            ST=$(phala cvms list 2>/dev/null | awk -v a="$APP_ID" '$1==a{print $3}')
            [ "$ST" = "running" ] && { echo "CVM running"; break; }
            sleep 6
          done
          for d in $(seq 1 6); do
            OUT=$(phala deploy --cvm-id "$CVM" -c deploy/docker-compose.yaml -e /tmp/nyx.env --wait 2>&1)
            echo "$OUT"
            echo "$OUT" | grep -q "already in progress" || break
            echo "deploy busy — retry $d in 20s"; sleep 20
          done
          shred -u /tmp/nyx.env || rm -f /tmp/nyx.env
          GW="https://${APP_ID}-8080.dstack-pha-prod5.phala.network"
          echo "GATEWAY=$GW" >> "$GITHUB_ENV"

      - name: Wait for the CVM to be healthy
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "$GATEWAY/info" > /tmp/info.json 2>/dev/null; then
              echo "CVM healthy"; cat /tmp/info.json | jq -r '.tee_pubkey' > /dev/null; break
            fi
            sleep 6
            [ "$i" = 40 ] && { echo "::error::CVM did not become healthy"; exit 1; }
          done

      # ── rotate `tee_pubkeys` to the K shard signers from the boot log + fund.
      #    Idempotent: a same-image redeploy yields the same signers (no-op
      #    rotate + top-up); a changed image yields new signers (this fixes them). ──
      - name: Rotate + fund the K shard signers
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          # The boot log line is: shard_pubkeys=["k0","k1",…] "derived K-shard
          # TEE signer set …" — grep that line, then pull the base58 keys.
          KEYS=$(phala cvms logs "$CVM" | grep -F 'derived K-shard TEE signer set' \
                 | grep -oE '[1-9A-HJ-NP-Za-km-z]{43,44}' | tr '\n' ' ')
          # Fall back to the /info primary if the log grep came up empty.
          [ -z "$KEYS" ] && KEYS=$(jq -r '.tee_pubkey' /tmp/info.json)
          echo "shard signers: $KEYS"
          SOLANA_RPC_URL="$HELIUS_RPC" ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
            node scripts/rotate-tee-pubkey.mjs $KEYS
          SOLANA_RPC_URL="$HELIUS_RPC" FUNDER_KEYPAIR=.devnet/keypairs/funder.json \
            node scripts/fund-tee-keys.mjs $KEYS

      # ── the actual tests ──
      # Keypair env vars resolve against REPO_ROOT (resolve(__dirname,"../../..")),
      # so they must be REPO-ROOT-relative (".devnet/…"), NOT relative to the
      # packages/sdk cwd — a "../../" prefix climbs ABOVE the repo (a bug the live
      # validation caught: "/Users/.devnet/keypairs/admin.json").
      - name: Devnet round-trip (deposit → withdraw; no CVM needed)
        run: |
          cd packages/sdk
          RUN_DEVNET_DW=1 SOLANA_RPC_URL="$HELIUS_RPC" \
            ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
            FUNDER_KEYPAIR=.devnet/keypairs/funder.json \
            ../../node_modules/.bin/vitest run tests/devnet-deposit-withdraw.test.ts

      # api-surface asserts NO on-chain tree state (auth / rate-limit / settings /
      # ws), so it needs no fresh tree — run it once against the live CVM.
      - name: CVM API-surface e2e
        run: |
          cd packages/sdk
          RUN_CVM_E2E=1 NYX_TEE_GATEWAY="$GATEWAY" SOLANA_RPC_URL="$HELIUS_RPC" \
            FUNDER_KEYPAIR=.devnet/keypairs/funder.json \
            ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
            ../../node_modules/.bin/vitest run tests/cvm-api-surface.test.ts

      # Each of these asserts startCount==0 then deposits+settles, so they CANNOT
      # share a tree — every one needs its own reset + a CVM-mirror cold-boot (a
      # redeploy re-reads NYX_TEE_SYNC_FROM_SLOT). So: reset → redeploy → run, per
      # test. Signers are unchanged across same-image redeploys, so the earlier
      # rotate+fund still holds (no re-rotate needed).
      - name: CVM tree-consuming e2e (reset + redeploy per test)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          set -uo pipefail
          redeploy_fresh() {
            SOLANA_RPC_URL="$HELIUS_RPC" ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
              node scripts/reset-merkle-tree.mjs
            umask 077
            FLOOR=$(node -e "const{Connection}=require('@solana/web3.js');(async()=>{process.stdout.write(String(await new Connection(process.env.HELIUS_RPC).getSlot('confirmed')))})()")
            {
              echo "NYX_TEE_SOLANA_RPC_URL=$HELIUS_RPC"
              echo "NYX_TEE_SYNC_FROM_SLOT=$FLOOR"
              echo "NYX_TEE_BASE_MINT=$(jq -r .baseMint.pubkey .devnet/e2e-config.json)"
              echo "NYX_TEE_QUOTE_MINT=$(jq -r .quoteMint.pubkey .devnet/e2e-config.json)"
              echo "NYX_TEE_SETTLE_LOOKUP_TABLE=$(jq -r .settleLookupTable .devnet/e2e-config.json)"
              echo "NYX_TEE_FEE_RATE_BPS=30"
              echo "NYX_TEE_PROTOCOL_OWNER_COMMITMENT=$(jq -r .protocol.ownerCommitmentHex .devnet/e2e-config.json)"
              echo "NYX_TEE_NUM_TREES=$(jq -r '.numTrees // 1' .devnet/e2e-config.json)"
            } > /tmp/nyx.env
            for d in $(seq 1 6); do
              OUT=$(phala deploy --cvm-id "$CVM" -c deploy/docker-compose.yaml -e /tmp/nyx.env --wait 2>&1)
              echo "$OUT" | grep -q "already in progress" || break
              echo "deploy busy — retry $d in 20s"; sleep 20
            done
            rm -f /tmp/nyx.env
            for i in $(seq 1 40); do curl -fsS "$GATEWAY/info" -o /tmp/info.json 2>/dev/null && break; sleep 6; done
          }
          FAILED=""
          for T in cvm-settle-e2e cvm-self-trade cvm-multimatch-settle cvm-merge-then-order; do
            echo "::group::$T"
            redeploy_fresh
            ( cd packages/sdk && RUN_CVM_E2E=1 NYX_TEE_GATEWAY="$GATEWAY" SOLANA_RPC_URL="$HELIUS_RPC" \
                FUNDER_KEYPAIR=.devnet/keypairs/funder.json ADMIN_KEYPAIR=.devnet/keypairs/admin.json \
                ../../node_modules/.bin/vitest run tests/$T.test.ts ) || FAILED="$FAILED $T"
            echo "::endgroup::"
          done
          [ -z "$FAILED" ] || { echo "::error::CVM tests failed:$FAILED"; exit 1; }

      # ═══════════════════════════════════════════════════════════════════════
      # TEARDOWN — ALWAYS. Stops CVM billing whether the tests passed, failed,
      # or errored. `if: always()` + the queue-don't-cancel concurrency policy
      # are what keep a billable CVM from leaking.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Stop the CVM (always)
        if: always()
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          rm -f /tmp/nyx.env packages/sdk/.env
          if [ -n "$CVM" ]; then
            phala cvms stop "$CVM" || echo "::warning::phala cvms stop failed — VERIFY MANUALLY in the dashboard"
          fi

# Belt-and-suspenders teardown lives in cvm-sweeper.yml: it unconditionally stops
# this CVM a few times a day, in the SAME concurrency group as this workflow so it
# can never race a live nightly — covering the force-cancel edge where a hard
# cancel skips even the `if: always()` teardown above.
#
# Build-from-main honesty is handled by the `build-image` job (reuses
# tee-image.yml via workflow_call), so the e2e runs against main's actual tee code.
