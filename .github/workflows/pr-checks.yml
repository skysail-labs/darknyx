# PR gate — checks on the on-chain ZK custody layer + the SDK primitives
# that mirror it.
#
# Scope (per the CI plan):
#   - Rust: workspace `cargo fmt --check`, `cargo clippy -D warnings`,
#     unit tests for `darkpool-crypto`, `vault` (lib).
#   - Circuits (Phase 2): compile all four circom circuits, run the
#     snarkjs ceremony, produce `.wasm` + `.zkey` + `verification_key.json`.
#   - SDK: parity tests (TS ↔ Rust byte equality, requires Rust example
#     binaries), transport / wire-format unit tests, and the snarkjs
#     prover smoke tests (require circuits — Phase 2 promotes these from
#     auto-skipped to required).
#
# Out of scope (covered by later phases):
#   - Strict VK-consistency byte diff. Deferred because the snarkjs dev
#     contribution is empirically non-deterministic across runs. The
#     real catch-net comes in Phase 3 via `programs/vault/tests/zk_*`
#     integration tests that verify proofs against the committed Rust
#     VK consts at runtime.
#   - `programs/vault/tests/` litesvm integration tests (Phase 3 — they
#     need built circuits AND a Solana SBF toolchain).
#   - `cargo build-sbf` (Phase 4 — informational only on PRs).
#   - Env-gated devnet/ER/CN end-to-end tests (auto-skipped without
#     `RUN_*=1`; promoted to a nightly cron in Phase 4).
#
# Required-for-merge status check: the aggregator `pr-checks success`.
# Configure branch protection on `main` to require it.

name: pr-checks

on:
  # Stacked product PRs target the branch below them, not `main`. Run the same
  # required gate for every PR base so upper-stack changes cannot bypass CI.
  pull_request: {}
  push:
    branches: [main]

# When a PR is force-pushed, kill the in-flight run for that ref to save
# minutes. Push-to-main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # `dorny/paths-filter` (the `changes` job) calls the GitHub API to list a PR's
  # changed files on `pull_request` events — that needs `pull-requests: read`.
  # Without it the token (restricted to exactly the scopes listed here) 403s with
  # "Resource not accessible by integration". Read-only; no write scope added.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # NOTE: do NOT set `RUSTFLAGS: -D warnings` here at workflow scope.
  # It would be inherited by every `cargo` invocation in every job,
  # including external builds like `cargo install --git iden3/circom`
  # — upstream crates often carry harmless `dead_code` warnings that
  # would then break the install. The strict-warnings gate is enforced
  # for OUR workspace via the `cargo clippy --workspace -- -D warnings`
  # CLI argument, which catches both rustc and clippy lints on our
  # code without poisoning third-party builds.

jobs:
  # ------------------------------------------------------------------
  # Fast path: detect which parts of the tree changed. Downstream jobs
  # use `needs.changes.outputs.*` to decide whether to run or skip.
  # On push-to-base (not a PR), always run everything.
  # ------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      circuits: ${{ steps.filter.outputs.circuits }}
      sdk: ${{ steps.filter.outputs.sdk }}
      indexer: ${{ steps.filter.outputs.indexer }}
      daemon: ${{ steps.filter.outputs.daemon }}
      browser_custody: ${{ steps.filter.outputs.browser_custody }}
      browser_client: ${{ steps.filter.outputs.browser_client }}
      ts: ${{ steps.filter.outputs.ts }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Reject stale pre-Darknyx namespaces
        run: bash scripts/check-brand-namespace.sh
      - name: Debug endpoints must stay off by default
        run: bash scripts/check-no-debug-endpoints.sh
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            rust:
              - 'programs/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              # The `rust` job also hosts two cheap deployment guards, so this
              # filter must cover THEIR inputs — otherwise the guard does not run
              # on precisely the change it exists to catch. Before this, a PR
              # that only edited deploy/docker-compose.yaml (say, replacing a
              # digest with a mutable tag — the exact T-04 supply-chain hole) or
              # that only weakened a guard script would match no filter, skip the
              # `rust` job, and merge with the compose gate never executed. Same
              # class as T-18: a gate that reports nothing because it never ran.
              - 'deploy/**'
              - 'Dockerfile*'
              - 'scripts/check-compose-image-digests.sh'
              - 'scripts/check-icicle-cuda-arch-env.sh'
              # And the workflow itself, so an edit that weakens a guard's
              # invocation — or this very filter — runs the guards it affects.
              # `deps` already lists this file for the dependency gate; the
              # deployment guards need the same protection.
              - '.github/workflows/pr-checks.yml'
            circuits:
              - 'circuits/**'
              - 'scripts/ci-build-circuits.sh'
              - 'package.json'
              - 'package-lock.json'
            sdk:
              - 'packages/sdk/**'
              - 'package.json'
              - 'package-lock.json'
            indexer:
              - 'packages/indexer/**'
              - 'packages/sdk/src/settlement/**'
              - 'package.json'
              - 'package-lock.json'
            daemon:
              - 'packages/daemon/**'
              - 'packages/sdk/src/**'
              - 'package.json'
              - 'package-lock.json'
            browser_custody:
              - 'packages/browser-custody-spike/**'
              - 'package.json'
              - 'package-lock.json'
              # A workflow-only weakening must run the job it changes.
              - '.github/workflows/pr-checks.yml'
            browser_client:
              - 'packages/client-core/**'
              - 'packages/browser-client/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/pr-checks.yml'
            # Any TypeScript, anywhere, plus the configs that decide HOW it is
            # checked. The tsconfigs are listed deliberately: a PR that narrows
            # an `include` or flips `strict` would otherwise skip the very job
            # that would have caught it — the T-18 class of gate that never runs
            # on the change it exists to catch.
            ts:
              - 'packages/**'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/pr-checks.yml'
            # The dependency gate's OWN controls. Without this a PR that only
            # touches .cargo/audit.toml (adding an ignore) or the npm baseline
            # (adding a suppression) would not run deps-audit at all — a change
            # that weakens the gate escaping the gate. Same class as T-18.
            deps:
              - '.cargo/audit.toml'
              - 'audit-baseline/**'
              - 'scripts/check-dependency-audits.sh'
              - '.github/workflows/pr-checks.yml'

  rust:
    name: Rust — fmt, clippy, unit tests, examples
    runs-on: ubuntu-latest
    needs: [changes]
    # Always run on push to base branches; skip on PRs that touch nothing Rust.
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.rust == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive  # darknyx-tee's icicle-snark path dep is a git submodule; cargo workspace resolution needs its Cargo.toml

      # Cheap guard, needs the submodule (hence this job, not `changes`): the
      # CUDA-arch env var the Dockerfile forwards must be one the PINNED
      # icicle-snark build.rs reads. A mismatch is silent until a `-cuda` image
      # build dies late with `CUDA_ARCHITECTURES ... native, but no GPU was
      # detected` (cost a GPU build on 2026-07-21).
      - name: icicle CUDA-arch env consistency
        run: bash scripts/check-icicle-cuda-arch-env.sh

      - name: CVM compose image identities are immutable
        run: bash scripts/check-compose-image-digests.sh

      # Pinned to match rust-toolchain.toml. Bump both together.
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0 (a BRANCH upstream, so it moves — pin it)
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: pr-checks-rust
          # Don't cache target/ subdirs we'll wipe between steps.
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Library unit tests only. Integration tests under `programs/vault/tests/`
      # need the circuit artefacts (they shell out to snarkjs) — promoted in
      # Phase 3.
      - name: darkpool-crypto unit tests
        run: cargo test -p darkpool-crypto --lib

      - name: vault lib unit tests
        # Includes `canonical_payload_hash_fixed_vector` (TEE-signed hash
        # byte-stability) and `test_id` (program-ID sanity).
        run: cargo test -p vault --lib

      # SDK parity tests shell out to these helper binaries via spawnSync.
      # They cross-validate TS Poseidon / note-commitment / nullifier /
      # user-commitment / key-derivation against the canonical Rust impl.
      - name: Build darkpool-crypto example binaries
        run: cargo build -p darkpool-crypto --examples

      - name: Upload example binaries for the sdk job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: darkpool-crypto-examples
          path: |
            target/debug/examples/poseidon-hash
            target/debug/examples/user-commitment
            target/debug/examples/note-commitment-v2
            target/debug/examples/nullifier-v2
            target/debug/examples/derive-keys
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # Phase 2 — circuit build.
  # Installs circom + uses the npm-installed snarkjs to run the dev
  # ceremony for all four circuits. Heavy caches on the circom binary
  # and PTAU file so warm runs are ~30s; cold runs ~4 min (circom
  # compile + first ceremony).
  # ------------------------------------------------------------------
  circuits:
    name: Circuits — circom + snarkjs build
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.circuits == 'true' ||
      needs.changes.outputs.rust == 'true'
    timeout-minutes: 25
    steps:
      # NO `submodules: recursive` here, deliberately. Other jobs need the
      # icicle-snark submodule because cargo must resolve the darknyx-tee
      # workspace; this job never runs cargo against the workspace — it compiles
      # circom circuits and installs the circom binary from a SEPARATE clone in
      # /tmp. Cloning the submodule cost ~20 s of a ~60 s job, which is more than
      # the circuit build it wraps.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The pot19 N=16 proving key exceeds GitHub's regular blob limit and
          # is stored in LFS. The circuit artefact uploaded below must contain
          # the real zkey, never its pointer file.
          lfs: true

      - name: Install Rust 1.89.0 (for circom build)
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0 (a BRANCH upstream, so it moves — pin it)

      - name: Install Node.js (for snarkjs)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: npm ci (snarkjs + circomlib live here)
        run: npm ci

      # circom is a Rust binary; compiling from source takes ~3 min.
      # Cache the compiled binary keyed by version so subsequent runs
      # restore it instantly.
      - name: Cache circom binary
        id: cache-circom
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/circom
          key: circom-${{ runner.os }}-v2.2.2

      - name: Install circom 2.2.2 (cache miss only)
        if: steps.cache-circom.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v2.2.2 https://github.com/iden3/circom.git /tmp/circom
          cd /tmp/circom
          cargo install --path circom --locked

      # Compile wasm from source; use committed circuit_final.zkey files.
      # groth16 setup is non-deterministic, so we never re-run the ceremony
      # in CI. The committed zkeys were generated locally with `zkey beacon`
      # and match the Rust VK constants in programs/vault/src/zk/vk_*.rs.
      # To update after a circuit change: run build-circuits.sh locally,
      # regenerate Rust VKs with parse-vk-to-rust.js, commit both.
      # Circuit sources change rarely, but this job runs on every Rust PR (see
      # the `if:` above) and gates the TEE job — so an uncached rebuild sits on
      # the critical path of every slice. Keyed on the circom sources, the
      # templates, the committed proving keys, and the build script itself: any
      # of those changing must rebuild, nothing else should.
      - name: Cache built circuit artefacts
        id: cache-circuit-build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: circuits/build
          # The key must cover EVERY input that changes the generated artefacts,
          # not just the circuit sources. circom's optimiser and codegen differ
          # between releases, and snarkjs generates the witness/wasm — so a key
          # ignoring the compiler version or the JS lockfile would happily serve
          # artefacts built by a different toolchain. `circom-2.2.2` is the
          # version pinned in the install step below; bump both together.
          #
          # `circuits/**/*.circom` rather than a per-directory glob: the narrower
          # form happened to cover all 12 sources today, but a new helper or
          # include added beside a circuit would silently fall outside it and the
          # cache would then serve artefacts built from different sources.
          key: circuit-build-${{ runner.os }}-circom-2.2.2-${{ hashFiles('circuits/**/*.circom', 'circuits/build/*/circuit_final.zkey', 'scripts/ci-build-circuits.sh', 'package-lock.json') }}

      - name: Build circuits (wasm only; zkeys from repo)
        if: steps.cache-circuit-build.outputs.cache-hit != 'true'
        run: bash scripts/ci-build-circuits.sh

      # A cache hit must still produce everything downstream consumes. Checked
      # explicitly rather than trusted: a partial restore would let the TEE job
      # start and fail deep inside a proof test instead of here.
      #
      # The expected set is DERIVED FROM THE BUILD SCRIPT, not hardcoded here.
      # `ci-build-circuits.sh` compiles every deployed/client and match-batch
      # source to fresh wasm+r1cs while reusing committed zkeys; compilation
      # itself needs no PTAU. Reading the same source of truth the build reads
      # keeps this cache check from drifting again.
      - name: Verify restored artefacts are complete
        if: steps.cache-circuit-build.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          # Read into an ARRAY rather than relying on unquoted word-splitting:
          # correct in bash, but silently a single blob in shells that do not
          # split (zsh), which made a local rehearsal of this check produce
          # nonsense. Explicit beats shell-dependent.
          mapfile -t built < <(grep -E '^build_wasm [a-z0-9_]+' scripts/ci-build-circuits.sh | awk '{print $2}')
          test "${#built[@]}" -gt 0 || {
            echo "could not read the built-circuit list from scripts/ci-build-circuits.sh" >&2
            echo "(the script's shape changed; this check cannot verify anything) " >&2
            exit 1
          }
          missing=0
          # Circuits the script compiles must have wasm + r1cs + zkey.
          for name in "${built[@]}"; do
            for f in circuit_js/circuit.wasm circuit.r1cs circuit_final.zkey; do
              if [ ! -f "circuits/build/$name/$f" ]; then
                echo "MISSING circuits/build/$name/$f" >&2
                missing=1
              fi
            done
          done
          # Any future directory not yet wired into the script must still carry
          # its committed proving key.
          for d in circuits/build/*/; do
            name=$(basename "$d")
            skip=0
            for b in "${built[@]}"; do [ "$b" = "$name" ] && skip=1; done
            [ "$skip" = 1 ] && continue
            if [ ! -f "$d/circuit_final.zkey" ]; then
              echo "MISSING $d/circuit_final.zkey" >&2
              missing=1
            fi
          done
          test "$missing" = 0 || {
            echo "restored circuit cache is incomplete — rebuilding is safer than proceeding" >&2
            exit 1
          }
          echo "restored circuit artefacts complete (built: ${built[*]})"

      # Upload the build output for the sdk job. Only the artefacts the
      # prover tests actually consume: `.wasm` and `.zkey`. We don't
      # need the `.r1cs` / `.sym` / `verification_key.json` downstream.
      - name: Upload circuit build artefacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: circuit-build
          path: |
            circuits/build/*/circuit_js/circuit.wasm
            circuits/build/*/circuit_final.zkey
            circuits/build/*/circuit.r1cs
          if-no-files-found: error
          retention-days: 1

  sdk:
    name: SDK — parity + transport + provers (vitest)
    runs-on: ubuntu-latest
    needs: [changes, rust, circuits]
    if: >-
      always() && (
        github.event_name == 'push' ||
        needs.changes.outputs.sdk == 'true' ||
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.circuits == 'true'
      ) &&
      needs.rust.result != 'failure' &&
      needs.circuits.result != 'failure'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: npm ci (root, with workspaces)
        run: npm ci

      # upload-artifact@v4 strips the least-common-directory from the
      # uploaded paths (so the zip contains bare filenames /
      # leaf-relative paths, NOT the full `target/debug/examples/...`
      # or `circuits/build/...` prefixes). Re-anchor on download with
      # an explicit `path:` so the binaries and circuit artefacts land
      # where the tests expect them.
      # These artifacts may not exist when the upstream job was skipped
      # (e.g. SDK-only change). The prover / parity tests self-skip via
      # RUN_* env checks when wasm/zkey/binaries are absent.
      - name: Download Rust example binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          name: darkpool-crypto-examples
          path: target/debug/examples

      - name: Make example binaries executable
        run: chmod +x target/debug/examples/* 2>/dev/null || true

      - name: Download circuit build artefacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          name: circuit-build
          path: circuits/build

      # Run the entire SDK suite. With the circuit artefacts now in
      # place, the prover tests (`valid-input-prover`, `valid-create-prover`,
      # `helpers/snarkjs-prover`) leave the auto-skip path and execute
      # against the just-built `.wasm` + `.zkey`. Env-gated devnet / ER
      # / change-note flows still auto-skip via `RUN_*` env-var checks.
      - name: vitest run (parity, transport, provers, devnet-skipped)
        run: node node_modules/vitest/vitest.mjs run --root packages/sdk

  typecheck:
    name: TypeScript — tsc --noEmit (src + tests)
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      always() && (
        github.event_name == 'push' ||
        needs.changes.outputs.ts == 'true'
      )
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: npm ci (root, with workspaces)
        run: npm ci

      # WHY THIS JOB EXISTS
      #
      # Until it was added, `tsc` appeared NOWHERE in any workflow. The sdk /
      # indexer jobs run vitest, and vitest STRIPS types rather than checking
      # them, so no TypeScript type error was caught by CI at all — the
      # `tsc --noEmit` lines in CLAUDE.md §2.5 were local-only and depended on a
      # developer running them by hand.
      #
      # Worse, each package's build tsconfig includes only `src/`, so even the
      # local gate never saw `tests/`. Test files were checked by NOTHING: 23
      # real type errors were sitting on main when this job was written,
      # including a cancel body missing the S-07 `session_id` and a daemon
      # `proveAndBuildOrder` call missing `sessionId` entirely — the latter
      # meaning that env-gated test could not have placed an order at all.
      #
      # `tsconfig.test.json` is the tests-inclusive, emit-free variant. It must
      # be used here rather than the build config, or this job reproduces the
      # exact blind spot it exists to remove.
      # `@darknyx/sdk` resolves through its package.json `types: dist/index.d.ts`,
      # and `npm ci` does NOT build workspace packages. Without this step the
      # daemon typecheck fails with ~69 "Cannot find module '@darknyx/sdk'"
      # errors plus the implicit-any cascade they cause.
      #
      # This was missed locally because a stale `packages/sdk/dist` from an
      # earlier build was already on disk — the checker passed against an
      # artefact CI never has. Verified since by deleting every dist/ and
      # tsbuildinfo and re-running this exact sequence from clean.
      #
      # Building rather than path-mapping to sdk/src is deliberate: it checks the
      # daemon against the DECLARATIONS it actually consumes, so a declaration
      # emit that breaks is caught here too.
      - name: Build the SDK (daemon/indexer typecheck against its declarations)
        run: |
          node node_modules/typescript/bin/tsc -p packages/sdk/tsconfig.json
          test -f packages/sdk/dist/index.d.ts \
            || { echo "::error::sdk build produced no dist/index.d.ts"; exit 1; }

      - name: tsc --noEmit (sdk, tests included)
        run: node node_modules/typescript/bin/tsc -p packages/sdk/tsconfig.test.json --noEmit

      - name: tsc --noEmit (daemon, tests included)
        run: node node_modules/typescript/bin/tsc -p packages/daemon/tsconfig.test.json --noEmit

      - name: tsc --noEmit (indexer, tests included)
        run: node node_modules/typescript/bin/tsc -p packages/indexer/tsconfig.test.json --noEmit

      # Guard the guard: assert each tsconfig.test.json actually includes
      # `tests/`. Without this, narrowing an `include` would silently restore
      # the blind spot while this job kept reporting success — the T-18 pattern
      # this whole slice keeps finding.
      - name: Verify each typecheck config really covers tests/
        run: |
          set -euo pipefail
          fail=0
          for pkg in sdk daemon indexer; do
            cfg="packages/$pkg/tsconfig.test.json"
            test -f "$cfg" || { echo "::error::$cfg is missing"; fail=1; continue; }
            if ! grep -q '"tests/\*\*/\*"' "$cfg"; then
              echo "::error::$cfg no longer includes tests/**/* — the typecheck would skip test files"
              fail=1
            fi
            # And prove tsc really loaded a test file, rather than matching a
            # pattern that resolves to nothing.
            n=$(node node_modules/typescript/bin/tsc -p "$cfg" --listFiles --noEmit \
                  | grep -c "/packages/$pkg/tests/" || true)
            if [ "$n" -eq 0 ]; then
              echo "::error::$cfg matched ZERO files under packages/$pkg/tests/"
              fail=1
            else
              echo "$pkg: $n test files typechecked"
            fi
          done
          exit $fail

  browser-custody:
    name: Browser custody — WebAuthn PRF + recovery
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      always() && (
        github.event_name == 'push' ||
        needs.changes.outputs.browser_custody == 'true'
      )
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # `npm ci` executes dependency lifecycle scripts. Do not leave the
          # workflow token in git config where a compromised script can read it.
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: npm ci (root, with workspaces)
        run: npm ci

      # Chrome DevTools supplies one PRF-capable and one deliberately
      # PRF-incapable virtual authenticator. The test also proves the expected
      # same-origin attack succeeds after user verification; that negative
      # result pins the browser threat-model boundary instead of hiding it.
      - name: WebAuthn PRF vault lifecycle + adversarial boundary
        run: npm run test:browser-custody

  browser-client:
    name: Browser client — contracts + security boundary
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      always() && (
        github.event_name == 'push' ||
        needs.changes.outputs.browser_client == 'true'
      )
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: npm ci (root, with workspaces)
        run: npm ci

      - name: Build platform-neutral client core
        run: npm -w @darknyx/client-core run build

      - name: Build production browser client
        run: npm -w @darknyx/browser-client run build

      - name: Typecheck client-core tests and boundary assertions
        run: npm -w @darknyx/client-core run typecheck:tests

      - name: Client-core unit tests
        run: npm run test:client-core

      - name: Typecheck browser-client tests and boundary assertions
        run: npm -w @darknyx/browser-client run typecheck:tests

      - name: Production browser custody lifecycle
        run: npm run test:browser-client

  daemon:
    name: Daemon — keystore, lifecycle, attestation (vitest)
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      always() && (
        github.event_name == 'push' ||
        needs.changes.outputs.daemon == 'true'
      )
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: npm ci (root, with workspaces)
        run: npm ci

      # packages/daemon had NO CI job at all until this one. Its ~147 tests —
      # covering the non-custodial keystore that holds user spending keys,
      # attestation gating, and the order lifecycle — had never run in CI.
      # Live-CVM flows stay env-gated and self-skip.
      - name: vitest run (daemon)
        run: node node_modules/vitest/vitest.mjs run --root packages/daemon

  indexer:
    name: Indexer — decode parity + db/server (vitest)
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      always() && (
        github.event_name == 'push' ||
        needs.changes.outputs.indexer == 'true'
      )
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Node 22 so the built-in `node:sqlite` is available (the indexer's
      # zero-native-dep DB). The DB tests self-skip on older runtimes; the
      # decode parity gate runs regardless.
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: npm ci (root, with workspaces)
        run: npm ci

      - name: vitest run (decode parity + db/server)
        run: NODE_OPTIONS=--experimental-sqlite node node_modules/vitest/vitest.mjs run --root packages/indexer

  # ------------------------------------------------------------------
  # Phase 3 — consistency: `declare_id!()` in each program's lib.rs
  # MUST match the `[programs.localnet]` and `[programs.devnet]`
  # entries in Anchor.toml. Pure bash, no deps; catches the class of
  # "bumped the on-chain ID but forgot to update one of the three
  # places it's written" bugs before any expensive job runs.
  # ------------------------------------------------------------------
  consistency:
    name: Consistency — program-id sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: declare_id!() <-> Anchor.toml parity
        shell: bash
        run: |
          set -euo pipefail

          extract_declare_id() {
            local file="$1"
            grep -oE 'declare_id!\("[1-9A-HJ-NP-Za-km-z]+"\)' "$file" \
              | head -n1 \
              | sed -E 's/^declare_id!\("(.+)"\)$/\1/'
          }

          extract_anchor_toml_id() {
            local prog="$1"
            local section="$2"
            awk -v sec="[programs.${section}]" -v prog="${prog}" '
              $0 == sec { in_sec = 1; next }
              /^\[/ && in_sec { exit }
              in_sec && $1 == prog && $2 == "=" {
                gsub(/"/, "", $3); print $3; exit
              }
            ' Anchor.toml
          }

          fail=0
          for prog in vault; do
            decl=$(extract_declare_id "programs/${prog}/src/lib.rs")
            local_id=$(extract_anchor_toml_id "$prog" "localnet")
            devnet_id=$(extract_anchor_toml_id "$prog" "devnet")
            echo "${prog}: declare_id=${decl}  localnet=${local_id}  devnet=${devnet_id}"
            if [[ -z "$decl" || -z "$local_id" || -z "$devnet_id" ]]; then
              echo "::error file=Anchor.toml::Missing program-id entry for ${prog}"
              fail=1
            elif [[ "$decl" != "$local_id" || "$decl" != "$devnet_id" ]]; then
              echo "::error file=programs/${prog}/src/lib.rs::declare_id!() does not match Anchor.toml for ${prog}"
              fail=1
            fi
          done
          if [[ "$fail" -ne 0 ]]; then exit 1; fi
          echo "OK: all declare_id!() values match Anchor.toml"

  # ------------------------------------------------------------------
  # Phase 3 — SBF build.
  # Produces `target/deploy/vault.so` and uploads
  # them so downstream litesvm jobs don't each repeat the ~5-min
  # cargo-build-sbf. We install Anza's Solana CLI (which bundles its
  # own SBF toolchain) instead of relying on the host Rust pin —
  # build-sbf insists on its bundled compiler. The install dir is
  # ~700 MB so we cache it aggressively by version.
  # ------------------------------------------------------------------
  sbf-build:
    name: SBF — cargo build-sbf
    runs-on: ubuntu-latest
    needs: [changes]
    # MUST stay a superset of `vault-litesvm`'s condition below. That job
    # downloads this job's `sbf-programs` artifact, so any input that starts
    # litesvm has to start this too — otherwise litesvm runs with no artifact
    # to download and dies at the download step with a message that names the
    # artifact rather than the missing build.
    #
    # `circuits` is the one that bit: its path filter includes
    # `package-lock.json`, so a dependency bump sets circuits=true, rust=false.
    # This job skipped, litesvm ran, and every deps-only PR failed.
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.circuits == 'true'
    timeout-minutes: 25
    env:
      # Match the developer's local Agave install. v2.x bundles
      # Cargo 1.79.0, which cannot parse manifests that declare
      # edition = "2024" — and at least one transitive dep
      # (toml_parser 1.1.2+spec-1.1.0, pulled in by the Solana
      # SDK toml stack) now uses that edition. v3.1.x bundles
      # platform-tools v1.52 with rustc/cargo 1.89.0.
      SOLANA_CLI_VERSION: v3.1.12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive  # darknyx-tee's icicle-snark path dep is a git submodule; cargo workspace resolution needs its Cargo.toml

      - name: Cache Solana CLI install
        id: cache-solana
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/solana/install
          key: solana-${{ runner.os }}-${{ env.SOLANA_CLI_VERSION }}

      - name: Install Solana CLI (cache miss only)
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_CLI_VERSION}/install)"

      - name: Put Solana CLI on PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify solana + cargo-build-sbf available
        run: |
          solana --version
          cargo build-sbf --version || cargo-build-sbf --version

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Separate key from the host-rust job: build-sbf writes
          # intermediates under target/sbf-solana-solana/ and the
          # registry shape diverges enough that sharing slows both.
          # Include a source hash so the cache busts when programs/ or
          # crates/ change — without this the key never busts and stale
          # .so files can pass CI after a code change.
          shared-key: pr-checks-sbf
          key: pr-checks-sbf-${{ hashFiles('programs/**/*.rs', 'crates/**/*.rs', 'Cargo.lock') }}
          cache-on-failure: true

      # Empirically, `cargo build-sbf` at the workspace root only emits a
      # full .so for one program — the other gets an 896-byte stub. The
      # workaround the project's own deploy-devnet.sh recommends is to
      # invoke build-sbf per-program with an explicit manifest path. Do
      # that here so the artefact downstream litesvm jobs consume holds
      # two real binaries.
      # F-01/F-02: the devnet admin ixs (`reset_merkle_tree`,
      # `close_vault_config`) are `#[cfg(feature = "devnet-admin")]`-gated OFF by
      # default. The litesvm suite exercises reset, so the ARTIFACT this job
      # uploads is the devnet build (feature ON). A mainnet build is plain
      # `cargo build-sbf` (no feature) and ships neither backdoor — the guard
      # step below asserts they stay gated.
      - name: F-01/F-02 — admin backdoors stay devnet-admin-gated
        run: |
          set -euo pipefail
          for ix in reset_merkle_tree close_vault_config; do
            grep -Pzoq "#\[cfg\(feature = \"devnet-admin\"\)\]\s*\n\s*pub fn $ix" \
              programs/vault/src/lib.rs \
              || { echo "::error file=programs/vault/src/lib.rs::$ix must stay #[cfg(feature=\"devnet-admin\")]-gated (audit_1 F-01/F-02)"; exit 1; }
          done
          echo "OK: reset_merkle_tree + close_vault_config are gated behind devnet-admin"

      # Compile the MAINNET artifact (no feature) first. Nothing consumes it —
      # it's a compile guard: the mainnet build is where F-01/F-02 are absent and
      # where F-03's upgrade-authority-bound `initialize` variant lives, so a
      # break there (that the devnet-admin build wouldn't catch) fails CI here.
      # The devnet-admin build below overwrites vault.so with the artifact the
      # litesvm jobs actually load.
      - name: cargo build-sbf — vault (mainnet build; compile-guards F-01/F-02 + F-03)
        run: cargo build-sbf --manifest-path programs/vault/Cargo.toml

      # Via the wrapper, not a bare build-sbf: it records a fingerprint manifest
      # beside the .so recording which source and feature set produced it. The
      # LiteSVM jobs download both and refuse to run if they disagree, so a
      # cached or mismatched artifact can no longer be validated silently
      # (T-13).
      - name: cargo build-sbf — vault (devnet build for the litesvm suite)
        run: bash scripts/build-vault-sbf.sh devnet-admin

      - name: Sanity-check .so size (must be > 100 KB)
        shell: bash
        run: |
          set -euo pipefail
          so=target/deploy/vault.so
          sz=$(stat -c%s "$so" 2>/dev/null || stat -f%z "$so")
          echo "$so: $sz bytes"
          if [[ "$sz" -lt 102400 ]]; then
            echo "::error file=$so::expected a real Solana program (>100 KB); got a stub ($sz bytes)."
            exit 1
          fi

      - name: Upload program .so file for litesvm jobs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbf-programs
          path: |
            target/deploy/vault.so
            target/deploy/vault.so.fingerprint
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # Phase 3 — cross-environment proof round-trip.
  # `zk_roundtrip` and `zk_spend_roundtrip` are the Section 22.4
  # "critical compatibility check": generate a snarkjs Groth16 proof
  # and verify it with the exact `groth16-solana` code the on-chain
  # program runs. `merkle_host` exercises pure-Rust Merkle invariants
  # (poseidon2, zero-subtree roots, append_leaf). None of these need
  # the .so — host-only — so they ride the circuit artefact alone
  # and run in parallel with sbf-build.
  # ------------------------------------------------------------------
  vault-zk:
    name: Vault ZK — host round-trips + Merkle invariants
    runs-on: ubuntu-latest
    needs: [changes, circuits]
    if: >-
      always() && (
        github.event_name == 'push' ||
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.circuits == 'true'
      ) && needs.circuits.result != 'failure'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive  # darknyx-tee's icicle-snark path dep is a git submodule; cargo workspace resolution needs its Cargo.toml

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0 (a BRANCH upstream, so it moves — pin it)

      - name: Install Node.js (for snarkjs)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: npm ci (snarkjs lives here)
        run: npm ci

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: pr-checks-rust

      - name: Download circuit build artefacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: circuit-build
          path: circuits/build

      - name: Cross-env round-trips + merkle host tests
        run: |
          cargo test -p vault \
            --test zk_roundtrip \
            --test zk_spend_roundtrip \
            --test merkle_host \
            --test merkle_fuzz \
            --test account_layout_fixture \
            -- --nocapture
          # NOTE: `merge_verify` is deliberately NOT here. It began as a pure
          # host round-trip target, but it now also drives litesvm (the merge
          # rejection paths), which needs `target/deploy/vault.so` — an
          # artefact this job neither depends on nor downloads. It runs in
          # `vault-litesvm` instead, which has the .so AND the circuit
          # artefacts AND npm/snarkjs. Adding a litesvm test to a target
          # listed here fails with "vault binary missing", not a build error.

  # ------------------------------------------------------------------
  # Phase 3 — vault litesvm tests.
  # Boots LiteSVM, loads `target/deploy/vault.so`, and drives the
  # registration + governance paths end-to-end.
  # `user_commitment_registration` shells out to snarkjs for a
  # VALID_WALLET_CREATE proof, so it needs the circuit artefact too.
  # `set_protocol_config` does not, but pulling both in is cheap.
  # ------------------------------------------------------------------
  vault-litesvm:
    name: Vault LiteSVM — registration + governance
    runs-on: ubuntu-latest
    needs: [changes, sbf-build, circuits]
    if: >-
      always() && (
        github.event_name == 'push' ||
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.circuits == 'true'
      ) &&
      needs['sbf-build'].result == 'success' &&
      needs.circuits.result != 'failure'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive  # darknyx-tee's icicle-snark path dep is a git submodule; cargo workspace resolution needs its Cargo.toml

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0 (a BRANCH upstream, so it moves — pin it)

      - name: Install Node.js (for snarkjs)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: pr-checks-rust

      - name: Download SBF programs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sbf-programs
          path: target/deploy

      - name: Download circuit build artefacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: circuit-build
          path: circuits/build

      - name: vault integration tests
        # Incl. the settle-regression suite migrated from matching_engine:
        # tee_forced_settle_batched (1:N BatchValidityMarker lifecycle) +
        # match_batch_verify (real N=16 proof → on-chain verify_match_batch).
        #
        # `deposit_with_proof` was in NO CI list at all — it drives a real
        # VALID_DEPOSIT proof through litesvm and is the only gate on the
        # deposit circuit's public-signal order, so it belongs here (it needs
        # both vault.so and the circuit artefacts, which is why it cannot live
        # in the proof-only job).
        run: |
          cargo test -p vault \
            --test set_protocol_config \
            --test set_tee_pubkey \
            --test user_commitment_registration \
            --test tee_forced_settle_batched \
            --test match_batch_verify \
            --test lock_note_consumed_guard \
            --test merge_verify \
            --test withdraw_lock_lifecycle \
            --test deposit_with_proof \
            --test initialize_governance \
            --test market_config \
            -- --nocapture

  # ------------------------------------------------------------------
  # T-08 — dependency vulnerability gate.
  # `audit_1` found a production-reachable openssl CVE by hand and nothing
  # stopped the next one shipping silently: no workflow ran cargo/npm audit.
  # Rust findings are triaged individually in .cargo/audit.toml with their
  # reachability analysis; the npm production backlog is recorded in
  # audit-baseline/ so NEW advisories fail loudly while known ones stay visible
  # and diffable rather than suppressed.
  # ------------------------------------------------------------------
  deps-audit:
    name: Dependencies — cargo audit + npm audit
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.indexer == 'true' ||
      needs.changes.outputs.deps == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0 (a BRANCH upstream, so it moves — pin it)

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Install cargo-audit
        # ^0.22, not ^0.21: the RustSec DB now carries CVSS 4.0 entries and 0.21
        # dies parsing them ("unsupported CVSS version: 4.0"). Keep this at or
        # above the version CLAUDE.md §2.5 runs locally — a gate that passes
        # locally and fails hosted for a TOOL reason teaches people to ignore it.
        run: cargo install cargo-audit --locked --version ^0.22

      - name: Record tool versions (audit evidence)
        run: |
          cargo audit --version
          npm --version
          node --version

      - name: cargo audit + npm audit (production)
        run: bash scripts/check-dependency-audits.sh

  # ------------------------------------------------------------------
  # Phase 3 — the in-enclave binary's own suite.
  #
  # Until this existed NO workflow ran `cargo test -p darknyx-tee`. The four
  # `cargo test` invocations across all seven workflows covered only
  # darkpool-crypto and vault, so the ~290 tests guarding the matcher, settle
  # pipeline, continuation derivation, Merkle mirror, oracle trust/freshness,
  # and the HTTP/auth surface — including every Phase A and `AU-` regression
  # test from the audit remediations — were local-gate-only. A regression in
  # any of them reached `main` with CI green (T-11).
  #
  # REQUIRE_CIRCUIT_ARTIFACTS=1 turns a missing circuit artifact into a hard
  # failure rather than a silent skip, so the proof-backed intake tests cannot
  # report success without proving (T-12). That is why this job depends on
  # `circuits` and downloads its artefacts.
  # ------------------------------------------------------------------
  tee:
    name: TEE — matcher, settle, oracle, auth (darknyx-tee)
    runs-on: ubuntu-latest
    needs: [changes, circuits]
    if: >-
      always() && (
        github.event_name == 'push' ||
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.circuits == 'true'
      ) &&
      needs.circuits.result != 'failure'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive  # icicle-snark is a path dep of darknyx-tee

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0 (a BRANCH upstream, so it moves — pin it)

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: pr-checks-rust

      - name: Download circuit build artefacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: circuit-build
          path: circuits/build

      # NOTE: there is deliberately no separate `--lib` step. `cargo test
      # --tests` already builds and runs the lib unit-test target, so a split
      # step re-ran all ~353 of them a second time (~25 s of pure duplication,
      # visible as two identical "353 passed" lines in the job log). The lib
      # tests are still individually identifiable in the output below.
      - name: darknyx-tee lib + integration tests (artifact-required)
        env:
          # A missing circuit artifact must FAIL here, never skip. See T-12.
          REQUIRE_CIRCUIT_ARTIFACTS: "1"
        run: cargo test -p darknyx-tee --tests -- --nocapture

  # ------------------------------------------------------------------
  # Aggregator. Branch protection should require ONLY this status check.
  # The individual job results are visible in the PR UI for debugging.
  # Note: dashes in job names require bracket lookup in the `needs`
  # expression context (`needs.foo-bar` parses as `needs.foo - bar`).
  # ------------------------------------------------------------------
  ci-success:
    name: pr-checks success
    needs:
      - changes
      - rust
      - circuits
      - sdk
      - indexer
      - typecheck
      - browser-custody
      - browser-client
      - daemon
      - consistency
      - sbf-build
      - vault-zk
      - vault-litesvm
      - tee
      - deps-audit
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all required jobs passed
        # 'skipped' is acceptable for the path-filtered jobs — it means the
        # filter determined that job was not relevant to this change. 'failure'
        # and 'cancelled' are hard failures.
        #
        # `changes` MUST be checked explicitly, and must NOT accept 'skipped'.
        # Every other job's `if:` reads `needs.changes.outputs.*`, so when
        # `changes` fails they all skip — and 'skipped' was being read as "not
        # relevant" when it actually meant "we never found out". The result was
        # an aggregate gate that reported success in ~3 s with zero tests
        # executed, which is exactly what a branch-protection rule keys on.
        # Observed live on PR #77: the namespace guard inside `changes` failed,
        # all nine jobs skipped, and `pr-checks success` still reported pass.
        # A filter that did not succeed cannot license any conclusion about the
        # jobs it gates.
        if: >-
          ${{
            needs.changes.result != 'success' ||
            (needs.rust.result != 'success' && needs.rust.result != 'skipped') ||
            (needs.circuits.result != 'success' && needs.circuits.result != 'skipped') ||
            (needs.sdk.result != 'success' && needs.sdk.result != 'skipped') ||
            (needs.indexer.result != 'success' && needs.indexer.result != 'skipped') ||
            (needs.typecheck.result != 'success' && needs.typecheck.result != 'skipped') ||
            (needs['browser-custody'].result != 'success' && needs['browser-custody'].result != 'skipped') ||
            (needs['browser-client'].result != 'success' && needs['browser-client'].result != 'skipped') ||
            (needs.daemon.result != 'success' && needs.daemon.result != 'skipped') ||
            needs.consistency.result != 'success' ||
            (needs['sbf-build'].result != 'success' && needs['sbf-build'].result != 'skipped') ||
            (needs['vault-zk'].result != 'success' && needs['vault-zk'].result != 'skipped') ||
            (needs['vault-litesvm'].result != 'success' && needs['vault-litesvm'].result != 'skipped') ||
            (needs.tee.result != 'success' && needs.tee.result != 'skipped') ||
            (needs['deps-audit'].result != 'success' && needs['deps-audit'].result != 'skipped')
          }}
        run: |
          echo "changes:                  ${{ needs.changes.result }}"
          echo "rust:                     ${{ needs.rust.result }}"
          echo "circuits:                 ${{ needs.circuits.result }}"
          echo "sdk:                      ${{ needs.sdk.result }}"
          echo "indexer:                  ${{ needs.indexer.result }}"
          echo "typecheck:                ${{ needs.typecheck.result }}"
          echo "browser-custody:          ${{ needs['browser-custody'].result }}"
          echo "browser-client:           ${{ needs['browser-client'].result }}"
          echo "daemon:                   ${{ needs.daemon.result }}"
          echo "consistency:              ${{ needs.consistency.result }}"
          echo "sbf-build:                ${{ needs['sbf-build'].result }}"
          echo "vault-zk:                 ${{ needs['vault-zk'].result }}"
          echo "vault-litesvm:            ${{ needs['vault-litesvm'].result }}"
          echo "tee:                      ${{ needs.tee.result }}"
          echo "deps-audit:               ${{ needs['deps-audit'].result }}"
          echo "::error::One or more required jobs failed."
          exit 1
      - name: All required checks passed
        run: echo "Phase 3 gate satisfied."
