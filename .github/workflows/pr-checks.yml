# PR gate — checks on the on-chain ZK custody layer + the SDK primitives
# that mirror it.
#
# Scope (per the CI plan):
#   - Rust: workspace `cargo fmt --check`, `cargo clippy -D warnings`,
#     unit tests for `darkpool-crypto`, `vault` (lib), `matching_engine` (lib).
#   - Circuits (Phase 2): compile all four circom circuits, run the
#     snarkjs ceremony, produce `.wasm` + `.zkey` + `verification_key.json`.
#   - SDK: parity tests (TS ↔ Rust byte equality, requires Rust example
#     binaries), transport / wire-format unit tests, and the snarkjs
#     prover smoke tests (require circuits — Phase 2 promotes these from
#     auto-skipped to required).
#
# Out of scope (covered by later phases):
#   - Strict VK-consistency byte diff. Deferred because the snarkjs dev
#     contribution is empirically non-deterministic across runs. The
#     real catch-net comes in Phase 3 via `programs/vault/tests/zk_*`
#     integration tests that verify proofs against the committed Rust
#     VK consts at runtime.
#   - `programs/vault/tests/` litesvm integration tests (Phase 3 — they
#     need built circuits AND a Solana SBF toolchain).
#   - `cargo build-sbf` (Phase 4 — informational only on PRs).
#   - Env-gated devnet/ER/CN end-to-end tests (auto-skipped without
#     `RUN_*=1`; promoted to a nightly cron in Phase 4).
#
# Required-for-merge status check: the aggregator `pr-checks success`.
# Configure branch protection on `main` (and `nyx-v2-onchain-hardening`
# until merged) to require it.

name: pr-checks

on:
  pull_request:
    branches: [main, nyx-v2-onchain-hardening]
  push:
    branches: [main, nyx-v2-onchain-hardening]

# When a PR is force-pushed, kill the in-flight run for that ref to save
# minutes. Push-to-main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # NOTE: do NOT set `RUSTFLAGS: -D warnings` here at workflow scope.
  # It would be inherited by every `cargo` invocation in every job,
  # including external builds like `cargo install --git iden3/circom`
  # — upstream crates often carry harmless `dead_code` warnings that
  # would then break the install. The strict-warnings gate is enforced
  # for OUR workspace via the `cargo clippy --workspace -- -D warnings`
  # CLI argument, which catches both rustc and clippy lints on our
  # code without poisoning third-party builds.

jobs:
  rust:
    name: Rust — fmt, clippy, unit tests, examples
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Pinned to match rust-toolchain.toml. Bump both together.
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-checks-rust
          # Don't cache target/ subdirs we'll wipe between steps.
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Library unit tests only. Integration tests under `programs/vault/tests/`
      # need the circuit artefacts (they shell out to snarkjs) — promoted in
      # Phase 3.
      - name: darkpool-crypto unit tests
        run: cargo test -p darkpool-crypto --lib

      - name: vault lib unit tests
        # Includes `canonical_payload_hash_fixed_vector` (TEE-signed hash
        # byte-stability) and `test_id` (program-ID sanity).
        run: cargo test -p vault --lib

      - name: matching_engine lib unit tests
        # Required for now; will be re-scoped when the TEE refactor lands.
        run: cargo test -p matching_engine --lib

      # SDK parity tests shell out to these helper binaries via spawnSync.
      # They cross-validate TS Poseidon / note-commitment / nullifier /
      # user-commitment / key-derivation against the canonical Rust impl.
      - name: Build darkpool-crypto example binaries
        run: cargo build -p darkpool-crypto --examples

      - name: Upload example binaries for the sdk job
        uses: actions/upload-artifact@v4
        with:
          name: darkpool-crypto-examples
          path: |
            target/debug/examples/poseidon-hash
            target/debug/examples/user-commitment
            target/debug/examples/note-commitment
            target/debug/examples/nullifier
            target/debug/examples/derive-keys
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # Phase 2 — circuit build.
  # Installs circom + uses the npm-installed snarkjs to run the dev
  # ceremony for all four circuits. Heavy caches on the circom binary
  # and PTAU file so warm runs are ~30s; cold runs ~4 min (circom
  # compile + first ceremony).
  # ------------------------------------------------------------------
  circuits:
    name: Circuits — circom + snarkjs build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.89.0 (for circom build)
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install Node.js (for snarkjs)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci (snarkjs + circomlib live here)
        run: npm ci

      # circom is a Rust binary; compiling from source takes ~3 min.
      # Cache the compiled binary keyed by version so subsequent runs
      # restore it instantly.
      - name: Cache circom binary
        id: cache-circom
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/circom
          key: circom-${{ runner.os }}-v2.2.2

      - name: Install circom 2.2.2 (cache miss only)
        if: steps.cache-circom.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v2.2.2 https://github.com/iden3/circom.git /tmp/circom
          cd /tmp/circom
          cargo install --path circom --locked

      # PTAU is ~72 MB and never changes. Cache aggressively.
      - name: Cache PTAU file
        id: cache-ptau
        uses: actions/cache@v4
        with:
          path: scripts/ptau/powersOfTau28_hez_final_16.ptau
          key: ptau-hez-final-16

      - name: Download PTAU (cache miss only)
        if: steps.cache-ptau.outputs.cache-hit != 'true'
        run: bash scripts/download-ptau.sh

      # Build all four circuits via the project's existing script. The
      # snarkjs dev contribution is non-deterministic across runs (we
      # do not rebuild the deterministic invariant here — that lands in
      # Phase 3's litesvm checks), so we always rebuild from scratch.
      # Build is ~30s for all four, so caching isn't worth the
      # complexity.
      - name: Build circuits (circom + snarkjs ceremony)
        run: bash scripts/build-circuits.sh

      # Upload the build output for the sdk job. Only the artefacts the
      # prover tests actually consume: `.wasm` and `.zkey`. We don't
      # need the `.r1cs` / `.sym` / `verification_key.json` downstream.
      - name: Upload circuit build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: circuit-build
          path: |
            circuits/build/*/circuit_js/circuit.wasm
            circuits/build/*/circuit_final.zkey
          if-no-files-found: error
          retention-days: 1

  sdk:
    name: SDK — parity + transport + provers (vitest)
    runs-on: ubuntu-latest
    needs: [rust, circuits]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci (root, with workspaces)
        run: npm ci

      # Artifacts were uploaded with workspace-relative paths
      # (`target/debug/examples/...` and `circuits/build/...`), so
      # downloading without a `path:` arg restores them to the exact
      # location the tests expect, relative to the repo root.
      - name: Download Rust example binaries
        uses: actions/download-artifact@v4
        with:
          name: darkpool-crypto-examples

      - name: Make example binaries executable
        run: chmod +x target/debug/examples/*

      - name: Download circuit build artefacts
        uses: actions/download-artifact@v4
        with:
          name: circuit-build

      # Run the entire SDK suite. With the circuit artefacts now in
      # place, the prover tests (`valid-input-prover`, `valid-create-prover`,
      # `helpers/snarkjs-prover`) leave the auto-skip path and execute
      # against the just-built `.wasm` + `.zkey`. Env-gated devnet / ER
      # / change-note flows still auto-skip via `RUN_*` env-var checks.
      - name: vitest run (parity, transport, provers, devnet-skipped)
        run: node node_modules/vitest/vitest.mjs run --root packages/sdk

  # ------------------------------------------------------------------
  # Aggregator. Branch protection should require ONLY this status check.
  # The individual job results are visible in the PR UI for debugging.
  # ------------------------------------------------------------------
  ci-success:
    name: pr-checks success
    needs: [rust, circuits, sdk]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all required jobs passed
        if: ${{ needs.rust.result != 'success' || needs.circuits.result != 'success' || needs.sdk.result != 'success' }}
        run: |
          echo "rust:     ${{ needs.rust.result }}"
          echo "circuits: ${{ needs.circuits.result }}"
          echo "sdk:      ${{ needs.sdk.result }}"
          echo "::error::One or more required jobs failed."
          exit 1
      - name: All required checks passed
        run: echo "Phase 2 gate satisfied."
