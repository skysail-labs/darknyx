# Belt-and-suspenders teardown for the nightly CVM (cvm-e2e.yml).
#
# cvm-e2e's own `Stop the CVM` step runs `if: always()`, covering pass/fail/error.
# But a HARD cancel (force-cancelling the run) can skip even always() steps, which
# would leak a billable CVM. This sweeper unconditionally stops the nightly CVM a
# few times a day, so any leak self-heals within hours instead of billing forever.
#
# SAFE vs a live nightly: it shares the SAME concurrency group as cvm-e2e.yml
# (`cvm-e2e-nightly`, cancel-in-progress: false) — GitHub concurrency groups are
# repo-global, so if a nightly is running this sweeper QUEUES behind it and can
# never stop a CVM an in-flight test is using. When it does run, `phala cvms stop`
# is a harmless no-op if the CVM is already stopped. The cron times are also
# offset from the 07:00 UTC nightly window as a second layer of separation.

name: cvm-sweeper (teardown safety)

on:
  schedule:
    - cron: "0 3,9,15,21 * * *" # 4x/day, offset from the 07:00 nightly window
  workflow_dispatch:

concurrency:
  group: cvm-e2e-nightly # SAME group as cvm-e2e.yml — never race a live nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install the Phala CLI
        run: npm install -g phala
      - name: Stop the nightly CVM (unconditional; no-op if already stopped)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          CVM="${{ vars.DARKNYX_NIGHTLY_CVM_ID }}"
          test -n "$CVM" || { echo "::warning::DARKNYX_NIGHTLY_CVM_ID unset — nothing to sweep"; exit 0; }
          phala cvms stop "$CVM" || echo "::notice::phala cvms stop returned non-zero (likely already stopped)"
