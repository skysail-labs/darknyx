# Post-run and manually dispatched belt-and-suspenders teardown for the release
# CVM.
#
# cvm-e2e's own `Stop the CVM` step runs `if: always()`, covering pass/fail/error.
# But a HARD cancel can skip even always() steps and leak a billable CVM. Run
# this action explicitly whenever a release run was force-cancelled or its own
# teardown status is uncertain.
#
# SAFE vs a live release run: it shares the SAME concurrency group as cvm-e2e.yml
# (`cvm-e2e-nightly`, cancel-in-progress: false) — GitHub concurrency groups are
# repo-global, so if an e2e run is active this sweeper QUEUES behind it and can
# never stop the CVM mid-test. `phala cvms stop` is a harmless no-op when the CVM
# is already stopped.

name: cvm-sweeper (teardown safety)

on:
  # A force-cancel can bypass the source workflow's `if: always()` step. The
  # completed event still launches this default-branch cleanup workflow.
  workflow_run:
    workflows: ["cvm-e2e (manual release gate)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cvm-e2e-nightly # SAME group as cvm-e2e.yml — never race a live run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install the Phala CLI
        run: npm install -g phala
      - name: Stop the release CVM (unconditional; no-op if already stopped)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          CVM="${{ vars.DARKNYX_NIGHTLY_CVM_ID }}"
          test -n "$CVM" || { echo "::warning::DARKNYX_NIGHTLY_CVM_ID unset — nothing to sweep"; exit 0; }
          phala cvms stop "$CVM" || echo "::notice::phala cvms stop returned non-zero (likely already stopped)"
