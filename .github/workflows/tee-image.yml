# Build the nyx-tee CVM image for linux/amd64 and push it to ghcr.io.
#
# WHY THIS EXISTS — Phala TDX CVMs are x86_64. Cross-building amd64 on
# an Apple-Silicon Mac via QEMU fails at link with
# `undefined symbol: __rust_probestack` (see deploy/Dockerfile header).
# `ubuntu-latest` is a NATIVE amd64 runner, so the build is clean and
# fast and produces a CVM-pullable image.
#
# AUTH — no secrets required. The run-scoped GITHUB_TOKEN below
# (granted `packages: write`) authenticates to ghcr.io. There is no
# PAT to create or rotate.
#
# ONE-TIME after the first push: ghcr packages are private by default.
# For Phala to pull anonymously, flip the package to public once:
#   Org (skysail-labs) -> Packages -> nyx-tee -> Package settings
#   -> Change visibility -> Public.
# (Or, to keep it private, add registry pull-credentials to the CVM
#  deploy instead — not needed for the dev spot-check.)
#
# HOW TO TRIGGER
#   * Tag push (robust — reads this workflow from the tag's tree, so it
#     works regardless of which branch is the repo default):
#         git tag tee-v3-spot && git push origin tee-v3-spot
#   * Manual dispatch (UI "Run workflow" / `gh workflow run`) — NOTE:
#     workflow_dispatch only appears/dispatches once this file is on
#     the repo's DEFAULT branch (same GitHub constraint documented for
#     /test-devnet in CLAUDE.md §3.7). The tag-push path has no such
#     constraint, so prefer it until this lands on the default branch.
#
# After a successful run the image is at:
#   ghcr.io/skysail-labs/nyx-tee:<tag>
# Point deploy/docker-compose.yaml `image:` at that, then
#   PATH=...nvm.../bin:$PATH phala deploy -c deploy/docker-compose.yaml -n nyx-tee-spot --wait

name: tee-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. tee-v3-spot)"
        required: true
        default: "tee-v3-spot"
  push:
    tags:
      - "tee-*"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # third_party/rapidsnark + its nested deps (ffiasm/json/circom_runtime)
          # — the Dockerfile builds rapidsnark's static libs from this source.
          submodules: recursive
          # No later step pushes to git (npm ci / circom / docker build only), so
          # don't leave the write-capable token in .git/config for them to reach.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image ref
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # ghcr requires a lowercase namespace.
          owner_lc="${OWNER,,}"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          echo "image=ghcr.io/${owner_lc}/nyx-tee:${tag}" >> "$GITHUB_OUTPUT"
          # Stable, tag-independent build cache ref (see cache-from/to).
          echo "cache=ghcr.io/${owner_lc}/nyx-tee:buildcache" >> "$GITHUB_OUTPUT"
          echo "Building -> ghcr.io/${owner_lc}/nyx-tee:${tag}"

      # The N=16 settle prover needs circuit.wasm + circuit.r1cs alongside
      # the committed circuit_final.zkey, but those two are gitignored.
      # Regenerate them with a circom compile (no ptau — we reuse the
      # committed zkey's ceremony). The Dockerfile then COPYs all three
      # into the runtime image. See deploy/Dockerfile + .dockerignore.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install circom 2.2.2 (prebuilt linux-amd64)
        run: |
          curl -fsSL https://github.com/iden3/circom/releases/download/v2.2.2/circom-linux-amd64 \
            -o /usr/local/bin/circom
          chmod +x /usr/local/bin/circom
          circom --version

      - name: npm ci (circomlib for circuit includes)
        run: npm ci

      - name: Compile N=16 circuit (wasm + r1cs + C++ witness-gen SOURCE; zkey committed)
        run: |
          # --wasm: the wasmer fallback path; --c: the native C++ witness
          # generator SOURCE (≈18× faster on amd64 — see witness-bench). circom
          # only GENERATES files here, so no compiler toolchain is needed on the
          # runner. r1cs feeds the cached CircomConfig. No ptau/zkey needed.
          circom circuits/match_batch_n16/circuit.circom \
            --r1cs --wasm --c \
            -l node_modules \
            -o circuits/build/match_batch_n16

      - name: Build native witness generator on debian:bookworm (glibc/ABI match)
        # The runtime image is debian:bookworm-slim (glibc 2.36 / GLIBCXX
        # 3.4.30). Compiling on the ubuntu-24.04 runner produces a binary that
        # needs GLIBC_2.38 / GLIBCXX_3.4.32 → fails at runtime in the container.
        # So `make` inside a bookworm container: the binary then matches the
        # runtime ABI. (-O3 + fr.asm ADX; the 32MB circuit.cpp takes ~2 min.)
        run: |
          docker run --rm \
            -v "$PWD/circuits/build/match_batch_n16/circuit_cpp:/cpp" -w /cpp \
            debian:bookworm-slim bash -c '
              apt-get update -qq &&
              apt-get install -y --no-install-recommends g++ make nasm libgmp-dev nlohmann-json3-dev &&
              time make
            '
          echo "--- artifacts the Dockerfile will COPY ---"
          ls -lh circuits/build/match_batch_n16/circuit_final.zkey \
                 circuits/build/match_batch_n16/circuit.r1cs \
                 circuits/build/match_batch_n16/circuit_js/circuit.wasm \
                 circuits/build/match_batch_n16/circuit_cpp/circuit \
                 circuits/build/match_batch_n16/circuit_cpp/circuit.dat

      - name: Build + push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.image }}
          # Single-platform, plain manifest (no attestation index) so
          # the CVM pull resolves a clean, stable digest. Keeps the
          # compose_hash story simple when we later pin by @sha256.
          provenance: false
          sbom: false
          # Layer cache across runs to keep the heavy Rust dep build
          # (the Dockerfile's dummy-source warmup layer) off the critical
          # path on re-runs.
          #
          # MUST be registry-backed, NOT just type=gha: GitHub Actions
          # cache is isolated per git-ref, so a cache written while
          # building tag `tee-v3-hardening-N` is unreadable when building
          # `-N+1` (a new ref) → every new tag was a full from-scratch
          # rebuild. A registry ref (`:buildcache`) is shared across ALL
          # tags, so each tag build restores the prior dep layers and only
          # the changed source recompiles. Keep bumping the *deploy* tag
          # per iteration (the CVM only re-pulls on a changed compose image
          # ref); the build cache is decoupled from it here. type=gha is
          # kept as a same-ref fallback (helps re-runs of the same tag).
          cache-from: |
            type=registry,ref=${{ steps.ref.outputs.cache }}
            type=gha
          cache-to: |
            type=registry,ref=${{ steps.ref.outputs.cache }},mode=max
            type=gha,mode=max

      - name: Emit pull command
        run: |
          echo "Pushed: ${{ steps.ref.outputs.image }}"
          echo "Pull/deploy: set deploy/docker-compose.yaml image: to the line above."
