# Phase 4 — nightly devnet E2E.
#
# Runs the env-gated devnet / ER / CN / PER SDK flows against the
# already-deployed programs on Solana devnet. This is INFORMATIONAL
# — it does NOT gate PRs. The point is to catch the class of
# regressions that only surface when wire format meets a real RPC:
# tx size, blockhash freshness, account-existence races, PER
# rollups, etc.
#
# Scope:
#   - devnet-setup.test.ts             (RUN_DEVNET_E2E=1)
#   - devnet-trade-flow.test.ts        (RUN_DEVNET_E2E=1)
#   - change-note-flow.test.ts         (RUN_CN_E2E=1)
#   - er-trade-flow.test.ts            (RUN_ER_E2E=1)
#   - orders-submit.devnet.test.ts     (RUN_PER_TESTS=1)
#   - partial-fill block in devnet-trade-flow (opt-in via dispatch input)
#
# Out of scope:
#   - cargo build-sbf / program deploy. The workflow assumes the
#     `Anchor.toml` program IDs are already deployed on devnet and
#     does NOT redeploy from CI (would require upgrade authority and
#     risk replacing a live demo). Use scripts/deploy-devnet.sh
#     locally to roll a new version.
#
# Required secrets (set via `gh secret set ...` or the repo UI):
#   DEVNET_ADMIN_KEYPAIR           — JSON array body of admin.json
#   DEVNET_TEE_AUTHORITY_KEYPAIR   — JSON array body of tee_authority.json
#   DEVNET_ROOT_KEY_KEYPAIR        — JSON array body of root_key.json
#   DEVNET_TRADER_KEYPAIR          — JSON array body of trader.json
#
# All four must be PRE-FUNDED on devnet. The workflow checks balances
# before running and fails early if any are below 0.05 SOL. To top
# them up, run `scripts/setup-devnet.sh` from a workstation that
# holds devnet SOL — the same script developers already use.

name: nightly-devnet

on:
  schedule:
    # 03:00 UTC ≈ quiet pre-work window. Cron is in UTC; daylight
    # savings does not shift it.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_partial_fill:
        description: 'Also run the partial-fill / re-lock devnet flow (RUN_DEVNET_PARTIAL_FILL=1)'
        type: boolean
        default: false
      skip_er:
        description: 'Skip the ER (Ephemeral Rollup) tests — useful when MagicBlock devnet is flaky'
        type: boolean
        default: false

# At most one nightly run in flight. Don't cancel — we want each
# scheduled run to complete (or fail clearly) on its own.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  devnet:
    name: devnet E2E (env-gated)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      L1_RPC_URL: https://api.devnet.solana.com
      # SDK tests resolve these as paths relative to the repo root.
      ADMIN_KEYPAIR: .devnet/keypairs/admin.json
      TEE_AUTHORITY_KEYPAIR: .devnet/keypairs/tee_authority.json
      ROOT_KEY_KEYPAIR: .devnet/keypairs/root_key.json
      TRADER_KEYPAIR: .devnet/keypairs/trader.json
      # Default the four RUN_* gates on. `workflow_dispatch` inputs
      # can disable ER and enable the partial-fill add-on.
      RUN_DEVNET_E2E: '1'
      RUN_CN_E2E: '1'
      RUN_PER_TESTS: '1'
      RUN_ER_E2E: ${{ inputs.skip_er && '0' || '1' }}
      RUN_DEVNET_PARTIAL_FILL: ${{ inputs.run_partial_fill && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      # ----- Materialise the four keypair secrets onto disk -----
      # Each secret holds the JSON array body of a Solana keypair file
      # (the same `[u8; 64]` shape `solana-keygen new` writes). We
      # write them under .devnet/keypairs/ with 600 perms; the SDK
      # tests will read them via the *_KEYPAIR env vars above.
      - name: Materialise devnet keypairs from secrets
        env:
          ADMIN_KP_JSON: ${{ secrets.DEVNET_ADMIN_KEYPAIR }}
          TEE_KP_JSON: ${{ secrets.DEVNET_TEE_AUTHORITY_KEYPAIR }}
          ROOT_KP_JSON: ${{ secrets.DEVNET_ROOT_KEY_KEYPAIR }}
          TRADER_KP_JSON: ${{ secrets.DEVNET_TRADER_KEYPAIR }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${ADMIN_KP_JSON:-}"  ]] && missing+=(DEVNET_ADMIN_KEYPAIR)
          [[ -z "${TEE_KP_JSON:-}"    ]] && missing+=(DEVNET_TEE_AUTHORITY_KEYPAIR)
          [[ -z "${ROOT_KP_JSON:-}"   ]] && missing+=(DEVNET_ROOT_KEY_KEYPAIR)
          [[ -z "${TRADER_KP_JSON:-}" ]] && missing+=(DEVNET_TRADER_KEYPAIR)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "Set them via: gh secret set <NAME> < .devnet/keypairs/<file>.json"
            exit 1
          fi
          mkdir -p .devnet/keypairs
          umask 077
          printf '%s' "$ADMIN_KP_JSON"  > .devnet/keypairs/admin.json
          printf '%s' "$TEE_KP_JSON"    > .devnet/keypairs/tee_authority.json
          printf '%s' "$ROOT_KP_JSON"   > .devnet/keypairs/root_key.json
          printf '%s' "$TRADER_KP_JSON" > .devnet/keypairs/trader.json

      # ----- Pre-flight: balance + reachability check -----
      # Cheaper than full vitest startup; fails fast if devnet is
      # unreachable or any keypair is underfunded. Uses a tiny inline
      # node script so we don't have to install solana CLI just for
      # this. Threshold is 0.05 SOL = 50_000_000 lamports.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Pre-flight devnet balance check
        env:
          RPC_URL: ${{ env.L1_RPC_URL }}
        run: |
          set -euo pipefail
          node <<'EOF'
            const fs = require("node:fs");
            const path = require("node:path");
            // Minimal Solana base58 keypair → pubkey extraction. The
            // last 32 bytes of the 64-byte secret-key array are the
            // Ed25519 public key; we encode them in base58.
            const BS58_ALPH = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
            function b58(bytes) {
              let n = 0n;
              for (const b of bytes) n = (n << 8n) | BigInt(b);
              let out = "";
              while (n > 0n) {
                const r = Number(n % 58n);
                n = n / 58n;
                out = BS58_ALPH[r] + out;
              }
              for (const b of bytes) { if (b === 0) out = "1" + out; else break; }
              return out;
            }
            const url = process.env.RPC_URL;
            const files = [
              ["admin",          ".devnet/keypairs/admin.json"],
              ["tee_authority",  ".devnet/keypairs/tee_authority.json"],
              ["root_key",       ".devnet/keypairs/root_key.json"],
              ["trader",         ".devnet/keypairs/trader.json"],
            ];
            const MIN_LAMPORTS = 50_000_000n; // 0.05 SOL
            const pubkeys = files.map(([name, p]) => {
              const arr = JSON.parse(fs.readFileSync(p, "utf8"));
              if (!Array.isArray(arr) || arr.length !== 64) {
                throw new Error(`${p}: not a 64-byte secret-key array`);
              }
              return [name, b58(Uint8Array.from(arr.slice(32)))];
            });
            (async () => {
              const body = {
                jsonrpc: "2.0", id: 1, method: "getMultipleAccounts",
                params: [pubkeys.map(([, pk]) => pk), { encoding: "base64" }],
              };
              const res = await fetch(url, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(body),
              });
              if (!res.ok) throw new Error(`RPC ${res.status}: ${await res.text()}`);
              const j = await res.json();
              const accs = j.result?.value ?? [];
              let underfunded = 0;
              for (let i = 0; i < pubkeys.length; i++) {
                const [name, pk] = pubkeys[i];
                const lam = BigInt(accs[i]?.lamports ?? 0);
                const sol = Number(lam) / 1e9;
                const mark = lam < MIN_LAMPORTS ? "LOW " : "OK  ";
                console.log(`${mark} ${name.padEnd(15)} ${pk}  ${sol.toFixed(4)} SOL`);
                if (lam < MIN_LAMPORTS) underfunded++;
              }
              if (underfunded > 0) {
                console.error(`::error::${underfunded} keypair(s) below 0.05 SOL — run scripts/setup-devnet.sh from a funded workstation to top up`);
                process.exit(1);
              }
            })().catch(e => { console.error(e); process.exit(1); });
          EOF

      # ----- Build the circuit artefacts the prover tests consume -----
      # Same recipe as pr-checks.yml. Aggressive cache keyed by
      # circom version + PTAU filename.
      - name: Cache circom binary
        id: cache-circom
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/circom
          key: circom-${{ runner.os }}-v2.2.2

      - name: Install Rust 1.89.0 (only if circom needs building)
        if: steps.cache-circom.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install circom 2.2.2 (cache miss only)
        if: steps.cache-circom.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v2.2.2 https://github.com/iden3/circom.git /tmp/circom
          cd /tmp/circom
          cargo install --path circom --locked

      - name: Cache PTAU file
        id: cache-ptau
        uses: actions/cache@v4
        with:
          path: scripts/ptau/powersOfTau28_hez_final_16.ptau
          key: ptau-hez-final-16

      - name: Download PTAU (cache miss only)
        if: steps.cache-ptau.outputs.cache-hit != 'true'
        run: bash scripts/download-ptau.sh

      - name: npm ci (snarkjs + sdk deps)
        run: npm ci

      - name: Build circuits
        run: bash scripts/build-circuits.sh

      # ----- Run the env-gated SDK suite -----
      # Every RUN_* gate is set in the job-level `env:` above, so the
      # vitest invocation is identical to pr-checks. The previously
      # auto-skipped devnet/ER/CN/PER blocks now execute.
      - name: vitest run (devnet flows enabled)
        run: node node_modules/vitest/vitest.mjs run --root packages/sdk

      # ----- Cleanup -----
      # Belt-and-braces: the runner is ephemeral, but explicitly wipe
      # the materialised keypairs so they don't leak into a job-level
      # artefact upload by accident.
      - name: Wipe materialised keypairs
        if: always()
        run: rm -rf .devnet/
