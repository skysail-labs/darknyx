# docker-compose.gpu.yaml — the GPU (ICICLE CUDA) variant of docker-compose.yaml
# for a Phala **H200 confidential-compute GPU CVM**.
#
# Why a SEPARATE file (not a flag on the base compose): `phala deploy -c <file>`
# hashes ONE self-contained file into `compose_hash` (no override-merge), and the
# `deploy.resources.reservations.devices: nvidia` block below BREAKS a deploy on a
# non-GPU (plain TDX) host. So the CPU/rapidsnark image keeps using
# docker-compose.yaml; this file is used ONLY for the GPU CVM.
#
# ⚠️ KEEP THE `environment:` BLOCK IN SYNC with docker-compose.yaml — the intake
# config (mints / fee rate / owner commitment) must match the base, or real
# deposits fail `verify_commitment`. The ONLY intended differences are: the
# `image:` (a `-cuda` tag), the `deploy.resources` GPU block, and the
# `DARKNYX_TEE_ICICLE_DEVICE` default. See docker-compose.yaml for the full per-var
# rationale (comments are terse here to keep the diff reviewable).
#
# Deploy (NEW cvm — different instance type → new app_id → new K-shard signers):
#   phala deploy -n darknyx-gpu -c deploy/docker-compose.gpu.yaml -e /tmp/darknyx.env \
#     -t h200.small --kms phala --wait
# Then confirm CC mode:  phala ssh -- nvidia-smi conf-compute -q   # ConfComputeMode : ON
# NEVER stop an on-demand GPU CVM: the fixed window is prepaid, and stopping
# permanently deallocates the GPU. Leave it running until the window expires.
# This differs intentionally from the stop-after-use rule for billable CPU CVMs.

services:
  darknyx-tee:
    # The ICICLE CUDA image (built by tee-image.yml with ENABLE_CUDA=1 — a
    # `-cuda`-suffixed tag), pinned by IMMUTABLE DIGEST for the same reason as
    # the CPU compose: compose_hash hashes this text, so a mutable tag lets the
    # measured enclave's code change underneath an unchanged measurement.
    #
    # This previously pointed at tee-v3-hardening-69-cuda, a tag that did not
    # exist in GHCR at all — the `-cuda` build had been failing since the
    # DARKNYX_ICICLE_CUDA_ARCH rename (see 05c86ef), so no image was ever
    # published under it. A GPU deploy would have failed at image pull.
    #
    # Source tag for audit cross-reference: tee-v3-hardening-75-cuda (5d11188), rebuilt from merged source. Enforced by
    # scripts/check-compose-image-digests.sh.
    image: ghcr.io/skysail-labs/darknyx-tee@sha256:eda803e3c16cc6a4443444857b560a3dcf4f6e3126c0545a31cf81e30b3dcf66
    restart: unless-stopped

    # Device-node permissions. The image drops to `USER darknyx` (non-root) but
    # /dev/nvidia* is root-owned, so the prover gets EACCES and icicle panics
    # `PermissionDenied` inside pre_compute_keys — crucially AFTER set_device
    # succeeds, which makes it read like a CUDA bug rather than a permissions
    # one. Found the hard way on 2026-07-21.
    # TODO(prod): add the runtime user to the `video`/`render` groups in the
    # -cuda image and drop this. Running as root widens the container user and is
    # tolerable only because the TDX CVM is the real trust boundary.
    user: root

    # GPU passthrough — Phala injects the NVIDIA driver (libcuda.so.1) via the
    # nvidia container runtime; the image already ships libcudart/libcurand + the
    # ICICLE CUDA backend .so. This block is what makes the H200 visible to the
    # container; it is ALSO why this compose must not be deployed to a TDX-only CVM.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - darknyx_state:/var/lib/darknyx-tee

    # RAM-backed scratch for the prover witness (SW-14). This matters MORE on
    # the GPU path than the CPU one: the same `input.json` that must not reach
    # storage is also what gets copied into GPU device memory, which SW-32 now
    # refuses to do unless the GPU is in confidential-compute mode.
    #
    # `uid`/`gid` match deploy/Dockerfile's `useradd -u 1100 -g 1100 darknyx`.
    # This service currently runs as root (see the TODO above), for which they
    # are redundant — root ignores the mode bits. They are set anyway so that
    # dropping `user: root`, which is the stated intent, does not silently make
    # /witness unwritable and fail every proof with EACCES.
    tmpfs:
      - /witness:size=256m,mode=0700,uid=1100,gid=1100,noexec,nosuid

    environment:
      # Scratch for the prover witness — the tmpfs above (SW-14).
      DARKNYX_TEE_WITNESS_DIR: /witness
      DARKNYX_TEE_LOG: "info,darknyx_tee::settle=debug,darknyx_tee::oracle=info,darknyx_tee::merkle=info"
      DARKNYX_TEE_HTTP_BIND: "0.0.0.0:8080"
      DARKNYX_TEE_FEED_IDS: "ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d"
      # Same mainnet preflight as the CPU compose.
      DARKNYX_TEE_DEPLOYMENT_TIER: ${DARKNYX_TEE_DEPLOYMENT_TIER:-mainnet}
      DARKNYX_TEE_ORACLE_MODE: ${DARKNYX_TEE_ORACLE_MODE:-pyth-solana-push-v1}
      DARKNYX_TEE_HERMES_ENDPOINT: ${DARKNYX_TEE_HERMES_ENDPOINT:-https://pyth.dourolabs.app/hermes}
      DARKNYX_TEE_PYTH_API_KEY: ${DARKNYX_TEE_PYTH_API_KEY}
      DARKNYX_TEE_STATE_DIR: "/var/lib/darknyx-tee"

      # BOOTSTRAP admin from the encrypted deploy env. Public test credentials
      # are rejected outside explicit local simulator mode.
      DARKNYX_TEE_API_KEY: ${DARKNYX_TEE_API_KEY}
      DARKNYX_TEE_API_SECRET: ${DARKNYX_TEE_API_SECRET}
      DARKNYX_TEE_PASSPHRASE: ${DARKNYX_TEE_PASSPHRASE}

      # Secret + per-deploy values from the encrypted -e env (never hardcoded).
      DARKNYX_TEE_SOLANA_RPC_URL: ${DARKNYX_TEE_SOLANA_RPC_URL}
      DARKNYX_TEE_SYNC_FROM_SLOT: ${DARKNYX_TEE_SYNC_FROM_SLOT}
      DARKNYX_TEE_BASE_MINT: ${DARKNYX_TEE_BASE_MINT}
      DARKNYX_TEE_QUOTE_MINT: ${DARKNYX_TEE_QUOTE_MINT}
      DARKNYX_TEE_MARKET_SYMBOL: ${DARKNYX_TEE_MARKET_SYMBOL:-SOL-USDC}
      DARKNYX_TEE_MARKETS_JSON: ${DARKNYX_TEE_MARKETS_JSON}
      DARKNYX_TEE_FEE_RATE_BPS: ${DARKNYX_TEE_FEE_RATE_BPS}
      DARKNYX_TEE_FEE_EPOCH_KEY: ${DARKNYX_TEE_FEE_EPOCH_KEY}
      DARKNYX_TEE_PROTOCOL_OWNER_COMMITMENT: ${DARKNYX_TEE_PROTOCOL_OWNER_COMMITMENT}

      # Prover backend. On the GPU CVM set DARKNYX_TEE_PROVER=icicle (via -e) to
      # exercise the GPU; flip to rapidsnark on the SAME image for the CPU
      # baseline A/B. Defaults to rapidsnark so a misconfigured deploy still boots.
      DARKNYX_TEE_PROVER: ${DARKNYX_TEE_PROVER:-rapidsnark}

      # Witness generator: native (default) | wasm. Same native circom --c gen as
      # the CPU image (witness gen is GPU-independent).
      DARKNYX_TEE_WITNESS: ${DARKNYX_TEE_WITNESS:-native}

      # ICICLE compute device. Defaults to CUDA here (this is the GPU compose);
      # the backend .so is loaded from ICICLE_BACKEND_INSTALL_DIR (baked in the
      # image). Set DARKNYX_TEE_ICICLE_DEVICE=CPU to A/B icicle-CPU on the same image.
      DARKNYX_TEE_ICICLE_DEVICE: ${DARKNYX_TEE_ICICLE_DEVICE:-CUDA}

      DARKNYX_TEE_SETTLE_SEND_CONCURRENCY: ${DARKNYX_TEE_SETTLE_SEND_CONCURRENCY:-16}
      DARKNYX_TEE_SETTLE_BATCH_CONCURRENCY: ${DARKNYX_TEE_SETTLE_BATCH_CONCURRENCY:-1}
      DARKNYX_TEE_NUM_TREES: ${DARKNYX_TEE_NUM_TREES:-1}

    ports:
      - "8080:8080"

volumes:
  darknyx_state:
