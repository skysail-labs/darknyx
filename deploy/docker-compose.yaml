# docker-compose.yaml for darknyx-tee under Phala Cloud / dstack.
#
# This file gets hashed (canonically, alphabetically-sorted JSON
# under app-compose.json) into the `compose_hash` baked into RTMR3.
# Every byte here is load-bearing — adding a port, a volume, an env
# var, changing the runner, all change compose_hash and require a
# new image authorization in dstack governance + a multisig rotation
# on Solana. See docs/tee-attestation-flow.md §5.
#
# Deploy:
#   phala deploy -c deploy/docker-compose.yaml -n darknyx-tee-spike
#
# The first deploy creates the CVM; subsequent deploys with
# `phala deploy` update it (after a fresh compose-hash is
# allowlisted in Phala's dashboard).

services:
  # The main darknyx-tee binary — matcher, prover, settle scheduler,
  # indexer, API server. See crates/darknyx-tee/ + docs/tee-architecture.md.
  darknyx-tee:
    # Pinned by IMMUTABLE DIGEST, never by tag. `compose_hash` hashes this
    # file's text, so a mutable tag would bind only "run whatever is at that
    # tag" — anyone able to re-point it changes the code the enclave runs while
    # RTMR3, the governance allowlist entry, and every client's expected
    # compose_hash stay byte-identical, and attestation still passes. The digest
    # makes compose_hash transitively bind the exact image bytes, which is what
    # the measurement is already assumed to mean.
    #
    # Source tag for audit cross-reference: tee-v3-hardening-79 (commit 3adc9c2, slice-8 review fixes).
    # The tag is a build label only; the digest is the deployed identity.
    # Enforced on every PR by scripts/check-compose-image-digests.sh.
    image: ghcr.io/skysail-labs/darknyx-tee@sha256:eb4987ea06a2c9d59952526a36ff34dc730f454e630c59a4b5fb6eee20cdb4f9
    restart: unless-stopped

    # /var/run/dstack.sock gives the container access to:
    #   - getKey(path)   — deterministic key derivation
    #   - getQuote(data) — TDX attestation quote
    #   - info()         — app_id / instance_id / RTMRs
    # This is the canonical mount documented in
    # phala-docs/dstack/getting-started.mdx.
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      # Persistent, LUKS-encrypted (dstack-kms sealing key) named volume
      # for the Layer-A auth snapshot (accounts.db) — Phase 1b. Survives
      # CVM restart + migration; encryption-at-rest is transparent to
      # the app. The matcher book / Merkle-leaf snapshots will share
      # this volume when that persistence lands. See
      # docs/tee-architecture.md §8 + §11.6.
      - darknyx_state:/var/lib/darknyx-tee

    environment:
      # Logs are visible in `phala logs --cvm-id darknyx-tee-spike`.
      # In production we'd ship to a remote sink — but the logs
      # must be careful: any plaintext order intent in logs is a
      # privacy leak.
      # Keep the settle pipeline at debug but quiet the 1/sec oracle-sync
      # + merkle-poll DEBUG spam so settle errors aren't buried.
      #
      # Overridable through the ENCRYPTED deploy env so a diagnostic run (e.g.
      # raising darknyx_tee::oracle to debug to sample per-refresh timings) does
      # NOT require editing this file. Editing it would change compose_hash and
      # drag a governance allowlist entry, client pin update, and signer rotation
      # behind a temporary log-level change. Only the `${VAR}` reference is in
      # compose_hash; the value never is. Unset/empty falls back to this default,
      # so production stays quiet by default.
      DARKNYX_TEE_LOG: ${DARKNYX_TEE_LOG:-info,darknyx_tee::settle=debug,darknyx_tee::oracle=info,darknyx_tee::merkle=info}
      DARKNYX_TEE_HTTP_BIND: "0.0.0.0:8080"

      # Real Pyth feed for the matcher's oracle. Every configured feed is
      # requested in ONE authenticated Hermes batch per refresh. The explicit
      # profile pins the complete upgraded router signer set, quorum, and Pyth
      # emitter; the TEE never infers a trust profile from the payload.
      DARKNYX_TEE_FEED_IDS: "ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d"
      DARKNYX_TEE_PYTH_TRUST_PROFILE: "router-quorum-v1"
      DARKNYX_TEE_HERMES_ENDPOINT: "https://pyth.dourolabs.app/hermes"
      # Upgraded Hermes bearer credential. Supplied through the encrypted
      # deploy env; missing/invalid auth leaves the oracle pause reason set, so
      # cancellation/reconciliation continue while new trading stays closed.
      DARKNYX_TEE_PYTH_API_KEY: ${DARKNYX_TEE_PYTH_API_KEY}

      # State directory for the auth snapshot (accounts.db). Points at
      # the persistent volume mounted above so registrations + token
      # revocations survive a restart (Phase 1b). Unset → persistence
      # disabled (in-memory only). See crate::persistence::auth.
      DARKNYX_TEE_STATE_DIR: "/var/lib/darknyx-tee"

      # BOOTSTRAP admin. All three values come from the encrypted deploy env;
      # known public TEST_* values are rejected unless explicit local simulator
      # mode is enabled (which this production compose never sets).
      DARKNYX_TEE_API_KEY: ${DARKNYX_TEE_API_KEY}
      DARKNYX_TEE_API_SECRET: ${DARKNYX_TEE_API_SECRET}
      DARKNYX_TEE_PASSPHRASE: ${DARKNYX_TEE_PASSPHRASE}

      # Secret + per-deploy values are SUBSTITUTED from the encrypted
      # env, NOT hardcoded here — `${VAR}` is interpolated by dstack
      # from the values supplied at deploy (`phala deploy -e VAR=…` or
      # the dashboard's encrypted-env UI). Only the var REFERENCE is in
      # the compose (and thus compose_hash); the value never is. An
      # unset var interpolates empty → the app falls back to its
      # default (public devnet RPC / no sync floor).
      #
      # Solana RPC the Merkle sync and settlement pipeline use.
      # MUST be a private RPC (Helius); the public devnet RPC 429s on
      # the sync's getSignaturesForAddress. DO NOT hardcode a key here.
      DARKNYX_TEE_SOLANA_RPC_URL: ${DARKNYX_TEE_SOLANA_RPC_URL}
      # Merkle cold-boot floor slot (Phase 2b). Set to the vault deploy
      # slot, or a reset_merkle_tree slot on devnet, so the mirror
      # reconstructs the CURRENT tree. Empty/unset → 0 (replay genesis).
      DARKNYX_TEE_SYNC_FROM_SLOT: ${DARKNYX_TEE_SYNC_FROM_SLOT}
      # Market mints (base58). Order intake verifies each input-note
      # opening's mint against these (bid→quote, ask→base), so for a REAL
      # settle they MUST equal the on-chain mints the deposited notes use
      # (the devnet-setup e2e-config mints). Empty/unset → placeholder
      # dev mints (synthetic-order loadgen mode; settlement disabled). Supplying
      # only one mint is rejected. See Config.
      DARKNYX_TEE_BASE_MINT: ${DARKNYX_TEE_BASE_MINT}
      DARKNYX_TEE_QUOTE_MINT: ${DARKNYX_TEE_QUOTE_MINT}
      DARKNYX_TEE_MARKET_SYMBOL: ${DARKNYX_TEE_MARKET_SYMBOL:-SOL-USDC}
      # Preferred multi-market identity table. When non-empty it replaces the
      # singular mint/symbol/feed identity envs (which must leave both mint
      # vars empty). The value is supplied through the encrypted deploy env.
      DARKNYX_TEE_MARKETS_JSON: ${DARKNYX_TEE_MARKETS_JSON}
      # On-chain address of the STATIC settle ALT (vault_config +
      # instructions_sysvar + system_program) that devnet-setup creates
      # (e2e-config `settleLookupTable`). The settle worker stacks it
      # under the per-batch ALT so the v0 settle tx (Tx D) stays under
      # the 1232-byte cap on the real-mint path. Empty/unset → per-batch
      # ALT only (fine for the small test payloads, overflows a real
      # settle). See crate::config + settle::worker.
      DARKNYX_TEE_SETTLE_LOOKUP_TABLE: ${DARKNYX_TEE_SETTLE_LOOKUP_TABLE}

      # Protocol fee rate (basis points) the matcher charges per leg.
      # Empty/unset → the code default (30 bps = 0.3%), so fee notes
      # actually mint. Set to 0 to disable fees, or any value ≤ 10_000.
      # Real-market boot adopts the finalized on-chain value exactly; this env
      # value is only a simulator/loadgen default. See crate::config.
      DARKNYX_TEE_FEE_RATE_BPS: ${DARKNYX_TEE_FEE_RATE_BPS}
      # Simulator/loadgen owner commitment default (32-byte hex). Governed
      # real-market boot adopts the finalized VaultConfig value instead.
      # Empty/unset in simulator/loadgen mode → [0;32] (fee notes still mint +
      # append but are unclaimable).
      DARKNYX_TEE_PROTOCOL_OWNER_COMMITMENT: ${DARKNYX_TEE_PROTOCOL_OWNER_COMMITMENT}
      # Groth16 prover backend: rapidsnark (default) | ark. The image ships
      # both (built --features rapidsnark); flip this to A/B proving on the
      # SAME image + instance. `:-rapidsnark` so an unset/empty value defaults
      # to rapidsnark — the CPU baseline we compare the future GPU (ICICLE)
      # backend against, so it's the steady-state prover, not an opt-in. Set
      # `DARKNYX_TEE_PROVER=ark` to A/B against the ark backend on the same image.
      DARKNYX_TEE_PROVER: ${DARKNYX_TEE_PROVER:-rapidsnark}

      # Witness generator: native (default) | wasm (wasmer). `native` spawns the
      # circom --c C++ generator shipped in the image — CVM-validated, byte-
      # identical witness, ~8-10× faster (witness_ms 201 vs ~1.7-2.1s; see
      # witness-bench). The prover falls back to wasmer if the binary is absent,
      # so `:-native` is safe. Set DARKNYX_TEE_WITNESS=wasm to A/B the wasmer path.
      DARKNYX_TEE_WITNESS: ${DARKNYX_TEE_WITNESS:-native}

      # Max settle Tx D's sent CONCURRENTLY within a batch (default 16). Firing
      # them together lets the leader co-include them in one block so they
      # confirm in a single ~1.13s window instead of one-at-a-time. Sweep this
      # (1/4/8/16/32) to find the on-chain settle throughput ceiling. `:-16`.
      DARKNYX_TEE_SETTLE_SEND_CONCURRENCY: ${DARKNYX_TEE_SETTLE_SEND_CONCURRENCY:-16}
      DARKNYX_TEE_SETTLE_BATCH_CONCURRENCY: ${DARKNYX_TEE_SETTLE_BATCH_CONCURRENCY:-1}

      # Number of Merkle-tree shards. The settle worker derives K fee-payer
      # keys (darknyx/ed25519-signer/v2/{0..K-1}) and round-robins each match
      # across (key[j], merkle_tree[j]) so the concurrent Tx D's share no
      # writable account. MUST equal the on-chain num_trees (e2e-config
      # numTrees). `:-1` keeps single-shard by default.
      DARKNYX_TEE_NUM_TREES: ${DARKNYX_TEE_NUM_TREES:-1}

    ports:
      # 8080: darknyx-tee's internal HTTP. dstack-ingress fronts this
      # on :443 once that container is added (Phase 2+).
      - "8080:8080"

# Named volumes. dstack backs these with the CVM's LUKS-encrypted data
# disk (sealing key from dstack-kms), so they persist across restart +
# instance migration. See phala-docs/dstack/trust-center-technical.mdx
# for the pattern.
volumes:
  darknyx_state:

# Phase 2+ additions (not enabled yet — listed here as a roadmap):
#
#  - dstack-ingress sidecar for the custom domain + ACME + CAA setup
#    (api.darknyx.example.com → :8080 inside this CVM, with /evidences/
#    published per docs/tee-attestation-flow.md §4)
#  - the matcher book + Merkle-leaf + settle-outbox snapshots sharing
#    the darknyx_state volume above (docs/tee-architecture.md §8 — the auth
#    snapshot already uses it as of Phase 1b)
#  - healthcheck that probes /tree/root to gate readiness
