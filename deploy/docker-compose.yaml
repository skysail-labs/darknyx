# docker-compose.yaml for nyx-tee under Phala Cloud / dstack.
#
# This file gets hashed (canonically, alphabetically-sorted JSON
# under app-compose.json) into the `compose_hash` baked into RTMR3.
# Every byte here is load-bearing — adding a port, a volume, an env
# var, changing the runner, all change compose_hash and require a
# new image authorization in dstack governance + a multisig rotation
# on Solana. See docs/tee-attestation-flow.md §5.
#
# Deploy:
#   phala deploy -c deploy/docker-compose.yaml -n nyx-tee-spike
#
# The first deploy creates the CVM; subsequent deploys with
# `phala deploy` update it (after a fresh compose-hash is
# allowlisted in Phala's dashboard).

services:
  # The main nyx-tee binary — matcher, prover, settle scheduler,
  # indexer, API server. See crates/nyx-tee/ + docs/tee-architecture.md.
  nyx-tee:
    # TODO(phase 1): replace with a pinned ghcr.io/<org>/nyx-tee@sha256:...
    # digest once we set up the build pipeline. Local builds during
    # Phase 1 use `phala docker build` + `phala docker push` to push
    # to Phala's image registry directly.
    image: ghcr.io/skysail-labs/nyx-tee:tee-v3-spot
    restart: unless-stopped

    # /var/run/dstack.sock gives the container access to:
    #   - getKey(path)   — deterministic key derivation
    #   - getQuote(data) — TDX attestation quote
    #   - info()         — app_id / instance_id / RTMRs
    # This is the canonical mount documented in
    # phala-docs/dstack/getting-started.mdx.
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock

    environment:
      # Logs are visible in `phala logs --cvm-id nyx-tee-spike`.
      # In production we'd ship to a remote sink — but the logs
      # must be careful: any plaintext order intent in logs is a
      # privacy leak.
      NYX_TEE_LOG: "info,nyx_tee=debug"
      NYX_TEE_HTTP_BIND: "0.0.0.0:8080"

      # Real Pyth Hermes feed for the matcher's oracle. This is the
      # canonical SOL/USD mainnet feed id (see crates/nyx-tee/src/oracle/
      # cache.rs). One feed only: the oracle-sync polls Hermes once per
      # feed every 1 s (main.rs), and Pyth's free public Hermes caps at
      # 10 req / 10 s per IP — one feed sits right at that edge, and the
      # matcher's 5 s staleness window (DEFAULT_MAX_ORACLE_AGE_MS) absorbs
      # the occasional 429. Do NOT add a second feed here for the bench.
      NYX_TEE_FEED_IDS: "ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d"

      # BOOTSTRAP auth (dev/bench only). Seeds ONE account so the loadgen
      # can acquire a bearer — the production from_boot path otherwise
      # boots with an empty account registry (real account registration
      # is deferred; see crates/nyx-tee/src/api/auth.rs module doc). These
      # are throwaway test credentials (they match the loadgen's CLI
      # defaults). NOT a real secret; fine in plaintext for a devnet bench.
      # Remove once the registration feature lands.
      NYX_TEE_API_KEY: "nyx-test-api-key"
      NYX_TEE_API_SECRET: "nyx-test-secret"
      NYX_TEE_PASSPHRASE: "nyx-test-passphrase"

      # Encrypted env vars get added here via the Phala dashboard's
      # UI (it encrypts them client-side to the CVM's env-encrypt
      # pubkey). DO NOT commit secrets to this file.
      #   NYX_TEE_SOLANA_RPC_URL: ${SOLANA_RPC_URL}  (encrypted)

    ports:
      # 8080: nyx-tee's internal HTTP. dstack-ingress fronts this
      # on :443 once that container is added (Phase 2+).
      - "8080:8080"

# Phase 2+ additions (not enabled yet — listed here as a roadmap):
#
#  - dstack-ingress sidecar for the custom domain + ACME + CAA setup
#    (api.nyx.example.com → :8080 inside this CVM, with /evidences/
#    published per docs/tee-attestation-flow.md §4)
#  - persistent disk volume (LUKS-encrypted via dstack-kms) for the
#    order book + Merkle leaf snapshots (docs/tee-architecture.md §8)
#  - healthcheck that probes /tree/root to gate readiness
