[workspace]
resolver = "2"
members = [
  "icicle-runtime",
  "icicle-core",
  # Only bn254 is used by icicle-snark; the bw6-761 / bls12-377 / bls12-381
  # wrapper crates were removed when vendoring (unused, and their conditional
  # curve mod files made stock rustfmt choke under `cargo fmt --all`).
  "icicle-curves/icicle-bn254",
]
exclude = []

[workspace.package]
version = "3.8.0"
edition = "2021"
authors = ["Ingonyama"]
homepage = "https://www.ingonyama.com"
repository = "https://github.com/ingonyama-zk/icicle"

[workspace.dependencies]
icicle-core = { path = "icicle-core" }
icicle-runtime = { path = "icicle-runtime" }
