# cargo-nextest configuration.
#
# nextest is the FAST path for the local gate; `cargo test` remains correct and
# is what CI runs today. Measured 2026-07-28 on 8 cores, already-compiled:
#   cargo test --workspace        266.1 s
#   cargo nextest run --workspace 155.6 s   (-41%)
#
# The win is cross-BINARY parallelism — `cargo test` already threads within a
# binary but runs the ~48 binaries one after another. That also means the
# advantage shrinks with core count: on a 2-core CI runner expect far less than
# 41%, which is why CI has not switched.
#
# COVERAGE CAVEAT: nextest does not run doctests. The workspace currently has
# ZERO executable doctests (`cargo test --workspace --doc` → 0 tests), so
# nothing is lost. `scripts/check-no-doctests.sh` fails the gate if that ever
# stops being true, so a doctest cannot be added and silently skipped.

[profile.default]
# Deliberately NOT setting `test-threads`. Its default is already "num-cpus",
# and — importantly — that means *logical* CPUs, not physical cores, so pinning
# it here would be a no-op that also reads as a memory bound it does not provide.
# Memory is bounded by `threads-required` on the heavy tests below, which is the
# mechanism actually designed for it.

# Surface a test that has become pathologically slow rather than letting it hide
# inside a green run. This only WARNS at the period; `terminate-after` bounds a
# genuine hang so one wedged test cannot hold the run to the job timeout.
slow-timeout = { period = "30s", terminate-after = 8 }

[[profile.default.overrides]]
# MEMORY cap. These binaries shell out to snarkjs or load a Groth16 proving key
# (`match_batch_n16/circuit_final.zkey` alone is 97 MB). nextest runs every test
# in its OWN process, so that working set multiplies by concurrency instead of
# being shared as under `cargo test`. Four slots each caps concurrent provers at
# cpus/4 and bounds peak RSS.
#
# `binary(...)`, not `test(...)`: these are test-BINARY names. An earlier
# revision listed `deposit_with_proof` and `merge_verify` inside a `test(/.../)`
# pattern, which matches test NAMES — so both matched nothing and the two
# heaviest proving binaries silently got no cap. Verified with
# `cargo nextest list -E '<filter>'`, not assumed.
filter = 'binary(prover_roundtrip) + binary(n16_assemble_prove_verify) + binary(prove_throughput_bench) + binary(valid_input_intake_verify) + binary(rapidsnark_roundtrip) + binary(match_batch_verify) + binary(zk_roundtrip) + binary(zk_spend_roundtrip) + binary(deposit_with_proof) + binary(merge_verify) + binary(user_commitment_registration)'
threads-required = 4
slow-timeout = { period = "120s", terminate-after = 4 }

[[profile.default.overrides]]
# SLOW but not memory-heavy: long Poseidon loops and a loadgen smoke run, no
# proving key. They need the timeout raised so they do not warn on every run —
# `merkle_host` alone takes ~60s and is the slowest thing in the suite — but
# they must NOT take four slots each, which would throttle the run for no
# memory benefit.
#
# Chosen from measured durations in a full run, not from name patterns. An
# earlier revision guessed with a loose `prove` substring, which over-matched
# trivial `prover::*` unit tests (charging 4 slots to a 1 ms test) while missing
# every binary listed here.
filter = 'binary(merkle_host) + binary(merkle_fuzz) + binary(smoke)'
slow-timeout = { period = "120s", terminate-after = 4 }
