[package]
name = "darkpool-matcher"
version.workspace = true
edition.workspace = true
description = "Pure matching algorithm for the Darknyx dark pool. Uniform-clearing-price batch auction with FIFO tie-break and Pyth-band circuit breaker. No Anchor or Solana runtime dependencies; consumed by the in-TEE matcher."

[lib]
crate-type = ["rlib"]

[dependencies]
borsh = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
hex = { workspace = true }

# SHA-256 backend for `change_note::derive_*`.
sha2 = { workspace = true }

# Cryptographic primitives — re-used so all hashing stays byte-identical
# with the on-chain side. darkpool-crypto is itself Anchor-free.
darkpool-crypto = { path = "../darkpool-crypto" }

[dev-dependencies]
proptest = { workspace = true }
# Independent Solana SHA-256 backend used by `tests/change_note_parity.rs`.
solana-program = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn" }
