[package]
name = "darkpool-matcher"
version.workspace = true
edition.workspace = true
description = "Pure matching algorithm for the Nyx dark pool. Uniform-clearing-price batch auction with FIFO tie-break and Pyth-band circuit breaker. No Anchor / no Solana / no Anchor-Lang deps — same crate consumed by both the in-TEE matcher (nyx-tee) and the existing on-chain run_batch litesvm parity tests."

[lib]
crate-type = ["rlib"]

[dependencies]
borsh = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
hex = { workspace = true }

# SHA-256 backend for `change_note::derive_*`. The on-chain side uses
# `solana_program::hash::hashv`; we use `sha2::Sha256` here so the
# matcher stays Anchor-free. Byte-equivalence between the two is
# gated by `tests/change_note_parity.rs`.
sha2 = { workspace = true }

# Cryptographic primitives — re-used so all hashing stays byte-identical
# with the on-chain side. darkpool-crypto is itself Anchor-free.
darkpool-crypto = { path = "../darkpool-crypto" }

[dev-dependencies]
proptest = { workspace = true }
# litesvm-and-friends-free reference impl of the on-chain hash. Used
# only by `tests/change_note_parity.rs` to assert byte-equality.
solana-program = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn" }
